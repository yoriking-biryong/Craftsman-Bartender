<template id="mnemonic-jj-31"><details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">데킬라 하나 반, 오렌지 Fill, 석류 반 온스는 마지막.</span></summary><div class="mnemonic-body"><p><b>데킬라 1 1/2 oz · 오렌지 주스 Fill · 그레나딘 1/2 oz.</b> 필스너 잔, Build/Float, 장식 없음.</p><p class="note-aside">뒤집은 바 스푼을 대고 시럽을 붓기 → 더 젓지 않기. 뉴욕은 석류 1/2 tsp, 선라이즈는 1/2 oz!</p></div></details></template>
<template id="mnemonic-jj-08"><details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">데·트·라, 하나 반·반·반. 소금 테두리!</span></summary><div class="mnemonic-body"><p><b>데</b>킬라 <b>1 1/2 oz</b> + <b>트</b>리플 섹(또는 쿠앵트로) <b>1/2 oz</b> + <b>라</b>임 주스 <b>1/2 oz</b>. Shake, 칵테일 잔, 소금 리밍.</p><p class="note-aside">선라이즈와 기주 1 1/2 oz로 한 쌍. 코스모와 트리플 섹·라임 1/2 oz씩은 같지만, 코스모는 보드카 1 oz와 크랜베리가 더 들어감.</p></div></details></template>
<template id="tequila-sunrise-note-template"><section aria-label="테킬라 선라이즈 수업 노트" class="recipe-notes tequila-sunrise-notes"><p class="note-cue">오렌지 위에 석류 반 온스 · 마지막은 젓지 않기</p><details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body"><header class="note-heading"><h4>테킬라 선라이즈 필기</h4></header><div class="note-basics"><p><b>데킬라 1 1/2 oz · 오렌지 주스 Fill · 그레나딘 시럽 1/2 oz</b></p><p>Build/Float · 필스너 잔 · 가니시 없음</p></div><section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>필스너 잔과 얼음</strong><p>필스너 잔을 칠링하고 서비스할 얼음을 준비한다.</p><p class="note-aside">필스너 잔이지만 Blend 아님! 이번 기법은 Build/Float.</p></li><li><strong>데킬라 1 1/2 oz</strong><p>기주를 계량해 얼음이 있는 잔에 넣는다.</p><p class="note-aside">마가리타와 같은 1 1/2 oz. 이번 두 메뉴는 숏·롱 구분 없이 묶기.</p></li><li><strong>오렌지 주스 Fill</strong><p>오렌지 주스를 채운다. 마지막에 넣을 시럽과 넘치지 않을 여유를 남긴다.</p><p class="note-aside">여기까지 잔에서 만드는 Build. Fill을 고정 oz나 정확히 80%로 바꾸지 않기.</p></li><li><strong>그레나딘 시럽 1/2 oz</strong><p>시럽을 계량하고 뒤집은 바 스푼을 잔에 대어 붓는다.</p><p class="note-aside">자동으로 가라앉더라도 스푼을 대는 기법을 보여 주기. 뉴욕은 1/2 tsp, 선라이즈는 1/2 oz!</p></li><li><strong>젓지 않고 제출</strong><p>시럽이 아래로 내려가 만든 그라데이션을 유지한다. 가니시 없이 코스터에 올려 제출한다.</p><p class="note-aside">마지막 Float를 기억하되, 시험 표에는 Build/Float 두 기법으로 적혀 있음.</p></li></ol></section><div class="note-topic-grid"><section class="note-topic"><h5>수업에서 들은 말</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>데킬라 선라이즈: 플로트: 서울은 blend 또는 플로트 기법이 필수로 나옴. 그러니 50% 확률이라는 뜻. 마지막에 행한 거라 float기법으로 분류됨.<br/>데킬라는 롱 드링크라 1 1/2, 오렌지 주스 핍. ----------- 까지 빌드, 그리고 석류시럽 oz임. floating. 잘 부을 필요 없음. 블렌드라 필스널 잔.<br/>바에서는 머들러나 빨대 2개를 주는데, 빨대는 하나는 빨고 하나는 머들러로 쓰라고 줌. 머들러는 또 손님에게는 젓는 용이고, 바 내부에서는 빻는 용으로 두개로 나뉘어 쓰임<br/>그냥 붓되 수저를 뒤집어 대고 부어야 함. 어차피 가라앉아서 자동으로 그라데이션 된다고는 해도, 시험에서는 기법을 중시하기 때문임</p></section><section class="note-topic"><h5>헷갈린 부분 정리</h5><p><b>Build/Float · 필스너 잔 · 가니시 없음.</b> 잔 종류만 보고 블렌더를 사용하지 않는다. 시럽은 <b>1/2 oz</b>이며 마지막에는 젓지 않는다.</p><p class="note-aside">서울은 Blend 또는 Float. 둘 다 완벽히 외울 것!</p></section><section class="note-topic"><h5>빨대와 도구</h5><p>손님이 음료를 젓는 막대는 스티러·스위즐 스틱으로 구분하고, 바에서 재료를 으깨는 도구는 머들러로 구분해 기억한다.</p><p><a href="https://viski.com/products/10182" rel="noopener noreferrer" target="_blank">Viski · 과일·허브를 으깨는 머들러 설명</a></p><p class="note-aside">빨대 두 개 중 하나를 젓는 용도로 쓴다는 이야기는 수업에서 들은 업장 서비스 예시. 모든 바에서 반드시 두 개를 주는 규칙은 아님.</p></section></div><section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">데킬라 선라이즈: 플로트: 서울은 blend 또는 플로트 기법이 필수로 나옴. 그러니 50% 확률이라는 뜻. 마지막에 행한 거라 float기법으로 분류됨.</p><p class="note-aside">데킬라는 롱 드링크라 1 1/2, 오렌지 주스 핍. ----------- 까지 빌드, 그리고 석류시럽 oz임. floating. 잘 부을 필요 없음. 블렌드라 필스널 잔.</p><p class="note-aside">바에서는 머들러나 빨대 2개를 주는데, 빨대는 하나는 빨고 하나는 머들러로 쓰라고 줌. 머들러는 또 손님에게는 젓는 용이고, 바 내부에서는 빻는 용으로 두개로 나뉘어 쓰임</p><p class="note-aside">그냥 붓되 수저를 뒤집어 대고 부어야 함. 어차피 가라앉아서 자동으로 그라데이션 된다고는 해도, 시험에서는 기법을 중시하기 때문임</p><p class="note-aside">보드카, 럼, 데킬라: 라임</p></div></section></div></details>
</section></template>
<template id="margarita-note-template"><section aria-label="마가리타 수업 노트" class="recipe-notes margarita-notes"><p class="note-cue">기주는 하나 반, 나머지는 반씩 · 소금 리밍</p><details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body"><header class="note-heading"><h4>마가리타 필기</h4></header><div class="note-basics"><p><b>데킬라 1 1/2 oz · 쿠앵트로 또는 트리플 섹 1/2 oz · 라임 주스 1/2 oz</b></p><p>Shake · 칵테일 잔 · 소금 리밍</p></div><section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>칵테일 잔 칠링 · 소금 리밍</strong><p>차갑게 준비한 잔 가장자리에 소금 리밍을 준비한다.</p><p class="note-aside">Rimming with Salt. 업장에서는 잔의 반만 소금을 바르기도 함.</p></li><li><strong>셰이커 얼음 · 데킬라 1 1/2 oz</strong><p>셰이커에 얼음을 준비하고 데킬라를 계량해 넣는다.</p><p class="note-aside">칵테일 잔의 숏 드링크여도 기주를 1 oz로 줄이지 않기.</p></li><li><strong>오렌지 리큐르 · 라임, 각각 1/2 oz</strong><p>쿠앵트로 또는 트리플 섹 중 하나를 1/2 oz 넣고, 라임 주스도 1/2 oz 넣는다.</p><p class="note-aside">트리플 섹을 쓰는 수업 레시피: 데·트·라 = 1 1/2 · 1/2 · 1/2 oz. 리큐르 둘을 동시에 넣지 않기.</p></li><li><strong>셰이킹</strong><p>셰이커 뚜껑을 닫고 흔들어 차갑게 섞는다.</p><p class="note-aside">소금은 셰이커에 넣는 재료가 아니라 잔 가장자리 장식.</p></li><li><strong>칠링 얼음 비우고 거르기</strong><p>잔의 칠링 얼음과 물을 비우고, 소금 리밍을 건드리지 않도록 혼합용 얼음을 걸러 따른다.</p><p class="note-aside">완성 칵테일 잔 안에는 얼음을 남기지 않기.</p></li><li><strong>코스터에 제출</strong><p>추가 과일 장식 없이 소금 리밍 상태를 확인하고 코스터에 올린다.</p></li></ol></section><div class="note-topic-grid"><section class="note-topic"><h5>수업에서 들은 말</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>보드카, 럼, 데킬라: 라임<br/><br/>마카리타는 마르게리따가 아님.<br/>업장에서는 잔의 반만 소금을 바르기도 함.<br/>버번도 불바빼고 1 1/2, 데킬라도 1 1/2, 어차피 두개니까. 숏 롱 무시하고 용량 외우자.<br/>데킬라가 숏인데 용량이 많이 들어감.<br/>ㄷ트리플 섹도 1/2이네. rimming with salt 여기서 한번 나옴</p></section><section class="note-topic"><h5>이름과 리밍</h5><p>칵테일 이름은 <b>마가리타(Margarita)</b>. 마르게리타 피자와 구분해 적는다. 소금 리밍은 기존 40종 시험 표에서 이 메뉴에만 지정된다.</p><p>업장의 반쪽 소금 리밍은 IBA의 선택 가능한 Half salt rim 사례와도 연결된다. 시험 표의 Rimming with Salt는 그대로 기억한다.</p></section><section class="note-topic"><h5>묶어서 외우되, 범위를 붙이기</h5><p><b>이번 데킬라 2종 = 기주 1 1/2 oz.</b> 버번은 불바디에 1 oz를 제외하고 이번 위스키 수업 메뉴에서 1 1/2 oz로 묶는다.</p><p class="note-aside">전체 40종에는 롱 아일랜드 아이스드 티도 있어 데킬라 1/2 oz가 들어감. ‘보드카·럼·데킬라→라임’은 라임이 실제로 들어가는 메뉴의 연상법. 선라이즈는 오렌지 주스이고 라임을 더하지 않음!</p></section></div></div></details></section></template>
<template id="dry-martini-note-template"><section aria-label="드라이 마티니 수업 노트" class="recipe-notes"><p class="note-cue">진 2 · 드라이 1/3 · Stir · 올리브</p><details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body"><header class="note-heading"><h4>드라이 마티니 필기</h4></header><div class="note-basics"><p><b>드라이 진 <span class="qr-qty qr-qty-7">2 oz</span> · 드라이 베르무트 <span class="qr-qty qr-qty-16">1/3 oz</span></b></p><p>Stir · 칵테일 잔 · 올리브</p></div><section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>칵테일 잔 · 믹싱 글라스 준비</strong><p>제공 잔을 칠링하고 믹싱 글라스에 얼음을 준비한다.</p><p class="note-aside">진의 품질과 향이 크게 느껴지는 식전주라는 수업 설명.</p></li><li><strong>드라이 진 <span class="qr-qty qr-qty-7">2 oz</span></strong><p>드라이 진을 계량해 믹싱 글라스에 넣는다.</p><p class="note-aside">숏 드링크라도 진은 <span class="qr-qty qr-qty-7">2 oz</span>. 보드카 숏 <span class="qr-qty qr-qty-1">1 oz</span> 연상을 가져오지 않기.</p></li><li><strong>드라이 베르무트 <span class="qr-qty qr-qty-16">1/3 oz</span></strong><p>드라이 베르무트를 계량해 넣는다.</p><p class="note-aside">마티니 초록 뚜껑 ↔ 드라이. 빨간 뚜껑 스위트와 구분.</p></li><li><strong>Stir · 잔의 칠링 얼음 비우기</strong><p>바 스푼으로 섞고 제공 잔의 칠링 얼음과 물을 비운다.</p><p class="note-aside">스터링은 맨·드·불·고 네 종.</p></li><li><strong>거르기 · 올리브 · 코스터</strong><p>혼합용 얼음을 걸러 칵테일 잔에 따르고 올리브로 장식해 제출한다.</p><p class="note-aside">작은 양파 장식은 깁슨. 락교 자체가 지정 가니시는 아님.</p></li></ol></section><section class="note-class-sheet"><h5>필기</h5><p class="note-transcript">dry martini: 가장 드라이한 칵테일, 마티니 홍보용, 식전주. 처칠마티니: 진 8 :2, 가장 드라이함. 얘보다 심하게 먹으려면 걍 위스키를 먹어. 진이 다해서 진의 품질이 중요하다는 것. 좋은거 쓰면 좋음. 소주 좋아하면 좋아할 메뉴. stir은 전체 시험 종목중 4개뿐. 불바디에, 맨하탄, 드라이마티니. 클래식 칵테일 중 베르무트는 원래다 stir긴 한데 뒷장에 이상한게 있음. olive 대신 락교같이 생긴 작은 양파 가니쉬가 들어가면 깁슨 칵테일이 됨. 레시피만 같고 가니쉬만 바뀜.</p></section></div></details></section></template>
<template id="mnemonic-jj-03"><details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">진 둘, 드라이 1/3. 젓고 거른 뒤 올리브!</span></summary><div class="mnemonic-body"><p><b>마티니는 드라이, 맨해튼은 스위트 베르무트.</b> Stir 네 종은 맨·드·불·고: 맨해튼·드라이 마티니·불바디에·고창. 올리브 대신 칵테일 어니언을 쓰는 깁슨과도 연결해요.</p></div></details></template>
<template id="negroni-note-template"><section aria-label="네그로니 수업 노트" class="recipe-notes"><p class="note-cue">진·스위트·캄파리 <span class="qr-qty qr-qty-2">3/4 oz</span>씩 · Build · 레몬 트위스트</p><details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body"><header class="note-heading"><h4>네그로니 필기</h4></header><div class="note-basics"><p><b>드라이 진 <span class="qr-qty qr-qty-2">3/4 oz</span> · 스위트 베르무트 <span class="qr-qty qr-qty-2">3/4 oz</span> · 캄파리 <span class="qr-qty qr-qty-2">3/4 oz</span></b></p><p>Build · 올드 패션드 잔 · 레몬 껍질 트위스트</p></div><section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>올드 패션드 잔 · 레몬 껍질</strong><p>얼음과 레몬 껍질 트위스트를 준비한다.</p><p class="note-aside">불바디에도 같은 잔이지만 장식은 오렌지.</p></li><li><strong>드라이 진 <span class="qr-qty qr-qty-2">3/4 oz</span></strong><p>얼음이 있는 제공 잔에 진을 계량해 넣는다.</p><p class="note-aside">진·스위트·캄파리는 모두 같은 보라색 용량.</p></li><li><strong>스위트 베르무트 · 캄파리, 각각 <span class="qr-qty qr-qty-2">3/4 oz</span></strong><p>두 부재료를 계량해 같은 잔에 넣는다.</p><p class="note-aside">불바디에의 1 : 1 : 1과 비율만 같음. 용량은 <span class="qr-qty qr-qty-2">3/4 oz</span>씩.</p></li><li><strong>잔에서 Build</strong><p>제공 잔에서 바 스푼으로 가볍게 저어 섞는다.</p><p class="note-aside">시험 표의 기법은 Build. 믹싱 글라스에서 Stir로 바꾸지 않기.</p></li><li><strong>레몬 트위스트 · 코스터</strong><p>레몬 껍질 트위스트로 장식하고 코스터에 제출한다.</p><p class="note-aside">네=레, 불=오. 네그로니 레몬 / 불바디에 오렌지.</p></li></ol></section><section class="note-class-sheet"><h5>필기</h5><p class="note-transcript">negroni: 니그로 아님. 자주 나오나? 네그로니 백작의 이름. 버번위스키가 들어가는 1:1:1은 불바디에 레시피가 있었지. 여긴 3/4oz 지만 비율은 1:1:1로 동일함. 오렌지 트위스트였지. 여기는 레몬. 원래 바에서는 기법이 stir+오렌지필인데, 그럼 정말 불바디에랑 똑같은 수준. 이건 그냥 시험용 레시피일 뿐. 다 3/4oz네 색 지정할 것</p></section></div></details></section></template>
<template id="mnemonic-jj-20"><details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">네그로니는 진, 보라색 3/4 셋. 빌드·레몬!</span></summary><div class="mnemonic-body"><p><b>네그로니: 진·스위트·캄파리 각 <span class="qr-qty qr-qty-2">3/4 oz</span>.</b> 불바디에: 버번·스위트·캄파리 각 <span class="qr-qty qr-qty-1">1 oz</span>. 둘 다 1 : 1 : 1이지만 시험 기법·기주·장식을 바꿔 기억해요. 네그로니 Build·레몬 / 불바디에 Stir·오렌지.</p></div></details></template>
<template id="singapore-sling-note-template"><section aria-label="싱가포르 슬링 수업 노트" class="recipe-notes"><p class="note-cue">진·레몬·설탕 Shake → 소다 Fill → 체리 브랜디 On Top</p><p class="note-taste"><span>한 줄 평</span> 맛 ㄱㅊ음.</p><details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body"><header class="note-heading"><h4>싱가포르 슬링 필기</h4></header><div class="note-basics"><p><b>드라이 진 <span class="qr-qty qr-qty-3">1 1/2 oz</span> · 레몬 주스 <span class="qr-qty qr-qty-0">1/2 oz</span> · 설탕 1 tsp · 소다 워터 Fill · 체리 브랜디 <span class="qr-qty qr-qty-0">1/2 oz</span> (On Top)</b></p><p>Shake/Build · 필스너 잔 · 오렌지 슬라이스 + 체리</p></div><section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>필스너 잔 · 가니시</strong><p>제공 잔을 차갑게 준비하고 오렌지 슬라이스와 체리를 준비한다.</p><p class="note-aside">필스너 잔이지만 Blend가 아님. 장식은 올드 패션드와 같은 오·체.</p></li><li><strong>셰이커 얼음 · 진 <span class="qr-qty qr-qty-3">1 1/2 oz</span></strong><p>얼음을 준비한 셰이커에 드라이 진을 계량해 넣는다.</p><p class="note-aside">롱 드링크의 진 하나 반으로 연결.</p></li><li><strong>레몬 <span class="qr-qty qr-qty-0">1/2 oz</span> · 설탕 1 tsp</strong><p>레몬 주스와 설탕을 넣는다.</p><p class="note-aside">진은 ‘투명하니 무조건 라임’으로 외우지 않기. 슬링은 레몬!</p></li><li><strong>뚜껑 닫고 Shake</strong><p>진·레몬·설탕을 셰이킹한다.</p><p class="note-aside">탄산수와 체리 브랜디는 아직 넣지 않음.</p></li><li><strong>필스너 잔으로 거르기</strong><p>서비스용 얼음을 준비한 필스너 잔에 혼합용 얼음을 걸러 따른다.</p><p class="note-aside">소다와 체리 브랜디가 들어갈 여유 남기기.</p></li><li><strong>소다 Fill → 체리 브랜디 <span class="qr-qty qr-qty-0">1/2 oz</span> On Top</strong><p>소다 워터를 채우고 체리 브랜디를 계량해 마지막에 얹는다.</p><p class="note-aside">Fill은 고정 oz가 아님. 마지막 체리 브랜디를 다시 셰이킹하거나 섞지 않기.</p></li><li><strong>오렌지 슬라이스·체리 · 코스터</strong><p>준비한 장식과 함께 코스터에 제출한다.</p><p class="note-aside">맛 ㄱㅊ음. 올드 패션드와 장식 짝꿍!</p></li></ol></section><section class="note-class-sheet"><h5>필기</h5><p class="note-transcript">singapore sling: 시험에 자주 나오며 난이도가 높다. 꿀꺽 삼킨다. sling. 그레나딘 넣구 공식은 체리브랜드 넣구 shaking, 마지막에 ~~~하구. 싱가포르 트레이드마크(레플스호텔 "롱바" 태국인 바텐더가 여성들의 낮술위한 술로 만들었음.) 복각이 이루어졌는데, 오리지날(트로피칼 칵테일)은 파일애플주스가 들어가고, 또다른 두번재 레시피는 조주기능사용으로 탄산이 들어간다. 드라이 진, 레몬 주스,(레몬이라 1/2) 설탕 들어가니 쉐이킹 - 그다음 탄산수를 fill 빌드지. top(위스키사워) 체리브랜디. 원래 키르쉬인데, 여긴 "브랜디" 이름의 리큐르를 쓰란 소리임. 원래가 트로피칼이었어서 + 롱드링크 라서 필스너 잔, 가니쉬는 여기서만 나옴. 올드패션드와 같지. 맛 ㄱㅊ음.</p></section></div></details></section></template>
<template id="mnemonic-jj-06"><details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">진 하나 반, 레몬 반, 설탕 하나. 소다 채우고 체리 반은 위!</span></summary><div class="mnemonic-body"><p><b>레몬 <span class="qr-qty qr-qty-0">1/2 oz</span>와 체리 브랜디 <span class="qr-qty qr-qty-0">1/2 oz</span>는 같은 색.</b> 레몬은 셰이킹할 때, 체리는 마지막. 소다는 셰이킹하지 않아요. 위스키 사워는 소다 <span class="qr-qty qr-qty-1">1 oz</span> On Top, 슬링은 소다 Fill 뒤 체리 <span class="qr-qty qr-qty-0">1/2 oz</span> On Top. 장식은 올드 패션드와 오렌지 슬라이스·체리로 한 쌍.</p></div></details></template>
<template id="long-island-note-template"><section aria-label="롱 아일랜드 아이스드 티 필기" class="recipe-notes"><p class="note-cue">진·보·럼·데·트, 전부 반! S/S 하나 반, 콜라는 위.</p><details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body"><header class="note-heading"><h4>롱 아일랜드 아이스드 티</h4></header><div class="note-basics"><p><b>드라이 진 <span class="qr-qty qr-qty-0">1/2 oz</span> · 보드카 <span class="qr-qty qr-qty-0">1/2 oz</span> · 라이트 럼 <span class="qr-qty qr-qty-0">1/2 oz</span> · 테킬라 <span class="qr-qty qr-qty-0">1/2 oz</span> · 트리플 섹 <span class="qr-qty qr-qty-0">1/2 oz</span> · 스위트 앤 사워 믹스 <span class="qr-qty qr-qty-3">1 1/2 oz</span> · 콜라 <span class="qr-qty qr-qty-16">On Top</span></b></p><p>Build · 콜린스 잔 · 라임 또는 레몬 웨지</p></div><section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>콜린스 잔 칠링 · 얼음과 웨지 준비</strong></li><li><strong>진·보드카·럼·데킬라·트리플 섹 각 <span class="qr-qty qr-qty-0">1/2 oz</span></strong></li><li><strong>스위트 앤드 사워 믹스 <span class="qr-qty qr-qty-3">1 1/2 oz</span></strong></li><li><strong>제공 잔에서 섞고 콜라 <span class="qr-qty qr-qty-16">On Top</span></strong></li><li><strong>라임 또는 레몬 웨지 · 코스터에 제출</strong></li></ol></section><section class="note-class-sheet"><h5>필기</h5><p class="note-transcript">long island iced tea: 맛있어.</p><p class="note-transcript">롱은 도수가 높아서 '레이디킬러' 라는 분야가 따로 있음. + 대강 비슷하고 트리플 섹만 바뀜.</p><p class="note-transcript">브랜디,위스키X</p><p class="note-transcript">기주가 4개. 진, 보드카, 럼, 데킬라. 진 보드카 럼은 투명술은 다 넣고 거기에 데킬라 넣는다고 생각하자.</p><p class="note-transcript">sweet&amp;sour: mix 시럽. msg. 맛있음. 레몬1:라임1:설탕1. 레몬주스+설탕같은 것. 쥬시에서 넣었어서 망하게 했지. 해외에서는 S/S라고도 부름.</p><p class="note-transcript">콜라니까 가니쉬는 wedge.</p><p class="note-transcript">콜린스잔은 호가든잔.</p><p class="note-transcript">s/s 어디에 쓰이냐면, 피치크러쉬, 카시스, 프라페? 레몬&amp;라임 monin 제품이랑 동원앤푸드(가루) 있는데 동원은 유자향이 나고 저렴함.</p><p class="note-transcript">진보럼데가 40도라 술 섞어둬도 안상함. 그래서 섞어서 2oz씩 쓰기도 함.</p></section><p class="note-aside">진·보드카·럼·데킬라 = 기주 네 가지. 트리플 섹까지 다섯 재료가 각각 <span class="qr-qty qr-qty-0">1/2 oz</span>. 네 기주만 합치면 <span class="qr-qty qr-qty-7">2 oz</span>. 준 벅과 콜린스 잔으로 묶기. 콜라 → 웨지 가니시.</p></div></details></section></template>
<template id="mnemonic-jj-21"><details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">진·보·럼·데·트, 전부 반! S/S 하나 반, 콜라는 위.</span></summary><div class="mnemonic-body"><p>진·보드카·럼·데킬라 = 기주 네 가지. 트리플 섹까지 다섯 재료가 각각 <span class="qr-qty qr-qty-0">1/2 oz</span>. 네 기주만 합치면 <span class="qr-qty qr-qty-7">2 oz</span>. 준 벅과 콜린스 잔으로 묶기. 콜라 → 웨지 가니시.</p></div></details></template>
<template id="gin-fizz-note-template"><section aria-label="진 피즈 필기" class="recipe-notes"><p class="note-cue">진 하나 반, 레몬 반, 설탕 하나. 피이이이, 소다 <span class="qr-qty qr-qty-15">Fill</span>!</p><details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body"><header class="note-heading"><h4>진 피즈</h4></header><div class="note-basics"><p><b>드라이 진 <span class="qr-qty qr-qty-3">1 1/2 oz</span> · 레몬 주스 <span class="qr-qty qr-qty-0">1/2 oz</span> · 가루 설탕 <span class="qr-qty qr-qty-11">1 tsp</span> · 소다 워터 <span class="qr-qty qr-qty-15">Fill</span></b></p><p>Shake/Build · 하이볼 잔 · 레몬 슬라이스</p></div><section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>하이볼 잔 칠링 · 레몬 슬라이스 준비</strong></li><li><strong>셰이커 얼음 → 진 <span class="qr-qty qr-qty-3">1 1/2 oz</span></strong></li><li><strong>레몬 주스 <span class="qr-qty qr-qty-0">1/2 oz</span> · 설탕 <span class="qr-qty qr-qty-11">1 tsp</span></strong></li><li><strong>뚜껑을 닫고 셰이킹</strong></li><li><strong>서비스용 얼음이 있는 하이볼 잔에 걸러 따르기</strong></li><li><strong>소다 워터 <span class="qr-qty qr-qty-15">Fill</span> · 레몬 슬라이스 · 코스터</strong></li></ol></section><section class="note-class-sheet"><h5>필기</h5><p class="note-transcript">gin fizz</p><p class="note-transcript">fizz: 캔 딸때 나오는 피이이이 소리. 위스키 사워랑 계란만 바뀜. 진피즈+체리브랜디 = 싱가포르 슬링</p><p class="note-transcript">하이볼잔이라 기주가 1 1/2, 레몬 설탕 탄산수라 fizz. 탄산수 fill 필업해야 함.</p><p class="note-transcript">쿠모시진(칵테일 앞글자들 이름) 용량은 1 1/2</p></section><p class="note-aside">쿠·모·시·진: 쿠바 리브레·모스코 뮬·시 브리즈·진 피즈의 기주 <span class="qr-qty qr-qty-3">1 1/2 oz</span>. 진 피즈 + 체리 브랜디 → 싱가포르 슬링. 위스키 사워의 소다 <span class="qr-qty qr-qty-1">1 oz</span> <span class="qr-qty qr-qty-16">On Top</span>과 진 피즈의 <span class="qr-qty qr-qty-15">Fill</span>을 비교하기.</p></div></details></section></template>
<template id="mnemonic-jj-37"><details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">진 하나 반, 레몬 반, 설탕 하나. 피이이이, 소다 <span class="qr-qty qr-qty-15">Fill</span>!</span></summary><div class="mnemonic-body"><p>쿠·모·시·진: 쿠바 리브레·모스코 뮬·시 브리즈·진 피즈의 기주 <span class="qr-qty qr-qty-3">1 1/2 oz</span>. 진 피즈 + 체리 브랜디 → 싱가포르 슬링. 위스키 사워의 소다 <span class="qr-qty qr-qty-1">1 oz</span> <span class="qr-qty qr-qty-16">On Top</span>과 진 피즈의 <span class="qr-qty qr-qty-15">Fill</span>을 비교하기.</p></div></details></template>
<template id="apricot-note-template"><section aria-label="애프리콧 칵테일 필기" class="recipe-notes"><p class="note-cue">살구 하나 반, 노란 주스 둘은 반. 진은 1 티스푼!</p><details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body"><header class="note-heading"><h4>애프리콧 칵테일</h4></header><div class="note-basics"><p><b>애프리콧 플레이버드 브랜디 <span class="qr-qty qr-qty-3">1 1/2 oz</span> · 드라이 진 <span class="qr-qty qr-qty-11">1 tsp</span> · 레몬 주스 <span class="qr-qty qr-qty-0">1/2 oz</span> · 오렌지 주스 <span class="qr-qty qr-qty-0">1/2 oz</span></b></p><p>Shake · 칵테일 잔 · 없음</p></div><section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>칵테일 잔 칠링 · 셰이커 얼음</strong></li><li><strong>애프리콧 브랜디 <span class="qr-qty qr-qty-3">1 1/2 oz</span></strong></li><li><strong>드라이 진 <span class="qr-qty qr-qty-11">1 tsp</span> · 레몬과 오렌지 주스 각 <span class="qr-qty qr-qty-0">1/2 oz</span></strong></li><li><strong>뚜껑을 닫고 셰이킹</strong></li><li><strong>칠링 얼음을 비우고 걸러 따르기</strong></li><li><strong>가니시 없이 코스터에 제출</strong></li></ol></section><section class="note-class-sheet"><h5>필기</h5><p class="note-transcript">apricot: 이름대로 살구 브랜디. 1번씀 여기에만. 증류주가 아니라 리큐르 있음. 증류주도 있긴 한데 얘는 리큐르 쓰는 것. 체리브랜디때도 그랬음.</p><p class="note-transcript">레몬, 오랜지 주스는 노란주스라 1/2</p><p class="note-transcript">기주 = 베이스. 많이 사용된 것을 의미함.</p></section><p class="note-aside">살구 브랜디는 리큐르. 레몬과 오렌지는 각각 <span class="qr-qty qr-qty-0">1/2 oz</span>로 같은 색. 드라이 진은 oz가 아닌 <span class="qr-qty qr-qty-11">1 tsp</span>. 체리 브랜디도 이름은 브랜디지만 리큐르였지!</p></div></details></section></template>

<template id="june-bug-note-template"><section aria-label="준 벅 필기" class="recipe-notes"><p class="note-cue">멜론 하나, 코·바 반씩. 파인·S/S 둘씩!</p><details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body"><header class="note-heading"><h4>준 벅</h4></header><div class="note-basics"><p><b>미도리 (멜론 리큐르) <span class="qr-qty qr-qty-1">1 oz</span> · 코코넛 플레이버드 럼 <span class="qr-qty qr-qty-0">1/2 oz</span> · 바나나 리큐르 <span class="qr-qty qr-qty-0">1/2 oz</span> · 파인애플 주스 <span class="qr-qty qr-qty-7">2 oz</span> · 스위트 앤 사워 믹스 <span class="qr-qty qr-qty-7">2 oz</span></b></p><p>Shake · 콜린스 잔 · 생파인애플 웨지 + 체리</p></div><section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>콜린스 잔 칠링 · 파인애플과 체리 준비</strong></li><li><strong>셰이커 얼음 → 멜론 리큐르 <span class="qr-qty qr-qty-1">1 oz</span></strong></li><li><strong>코코넛 럼·바나나 리큐르 각 <span class="qr-qty qr-qty-0">1/2 oz</span></strong></li><li><strong>파인애플 주스·스위트 앤드 사워 믹스 각 <span class="qr-qty qr-qty-7">2 oz</span></strong></li><li><strong>파지를 단단히 하고 셰이킹</strong></li><li><strong>얼음이 있는 콜린스 잔에 걸러 따르기 · 가니시·코스터</strong></li></ol></section><section class="note-class-sheet"><h5>필기</h5><p class="note-transcript">june bug: 준벅. 6월의 벌레. 해운대점 TGI 프라이데이 바 관련이었구나. 공식문헌은 없고 구전만 되어 내려옴. 패밀리레스토랑으로 너무 알려졌지.</p><p class="note-transcript">스템잔 빼고는 다 얼음.</p><p class="note-transcript">멜론 리큐르 / TGI 준벅은 미도리가 공식. 쿠로나+노재팬 영향으로 가격올라 시험에는 안나옴 미도리는. 멜론리큐르는 1번만 씀</p><p class="note-transcript">코코넛럼: 하와이안ㅋㅋ 말리부.</p><p class="note-transcript">바나나 리큐어: 1번만씀 .업장에서도 잘 안씀.</p><p class="note-transcript">파인애플주스 라서 가니쉬가 파인애플</p><p class="note-transcript">s/s너무 달아서 시연에서는 좀 줄이셨음. 주스랑 ss가 2oz씩</p><p class="note-transcript">콜린스 잔. 롱드링크 쉐이크라 무게가 무거움. 투명하고 긴 쉐이킹 잔과 아래는 은색인 쉐이킹안에 넣고, 파지조심()열린다?!) 조심해서 쉐이킹. 아일랜드, 준벅 2번 콜린스 잔 나옴.</p></section><p class="note-aside">코코넛 럼·바나나 리큐르 각 <span class="qr-qty qr-qty-0">1/2 oz</span>, 파인애플·S/S 각 <span class="qr-qty qr-qty-7">2 oz</span>. 멜론만 <span class="qr-qty qr-qty-1">1 oz</span>. 말리부 → 블루 하와이안, 파인애플 주스 → 파인애플·체리 가니시. 롱 아일랜드와 콜린스 잔.</p></div></details></section></template>

</p><p class="pdf-memory">금산 인삼주 43도. 커피 리큐르 원문에는 Kahlûa가 병기되어 있습니다.</p></article></template><template id="catalog-pdf-jj-36"><article class="pdf-card pdf-recipe-card"><h3><span class="pdf-number">36</span>고창</h3><p class="pdf-small">Gochang · 전통주</p><dl class="pdf-recipe"><div><dt>선운산 복분자주</dt><dd class="qty-two">2 oz</dd></div><div><dt>트리플 섹</dt><dd class="qty-half">1/2 oz</dd></div><div><dt>스프라이트</dt><dd class="qty-two">2 oz</dd></div></dl><p class="pdf-method"><b>Stir</b> · 플루트 샴페인 잔<br/>가니시: 없음</p><p class="pdf-memory">선운산 복분자주와 스프라이트 각 2 oz. 플루트 샴페인 잔.</p><p class="pdf-difference"><b>표기 비교</b> 수업 PDF 6쪽은 Cointreau 또는 Triple Sec, 공식 표는 Triple Sec입니다.</p></article></template><template id="catalog-pdf-jj-37"><article class="pdf-card pdf-recipe-card"><h3><span class="pdf-number">37</span>진 피즈</h3><p class="pdf-small">Gin Fizz · 진</p><dl class="pdf-recipe"><div><dt>드라이 진</dt><dd class="qty-onehalf">1 1/2 oz</dd></div><div><dt>레몬 주스</dt><dd class="qty-half">1/2 oz</dd></div><div><dt>가루 설탕</dt><dd class="qty-spoon">1 tsp</dd></div><div><dt>소다 워터</dt><dd class="qty-other">Fill</dd></div></dl><p class="pdf-method"><b>Shake/Build</b> · 하이볼 잔<br/>가니시: 레몬 슬라이스</p><p class="pdf-memory">진·레몬·설탕을 셰이크하고 소다 워터로 채웁니다.</p></article></template><template id="catalog-pdf-jj-38"><article class="pdf-card pdf-recipe-card"><h3><span class="pdf-number">38</span>프레시 레몬 스쿼시</h3><p class="pdf-small">Fresh Lemon Squash · 무알코올</p><dl class="pdf-recipe"><div><dt>생레몬 착즙</dt><dd class="qty-other">1/2 ea</dd></div><div><dt>가루 설탕</dt><dd class="qty-other">2 tsp</dd></div><div><dt>소다 워터</dt><dd class="qty-other">Fill</dd></div></dl><p class="pdf-method"><b>Build</b> · 하이볼 잔<br/>가니시: 레몬 슬라이스</p><p class="pdf-memory">생레몬 반 개를 착즙합니다. 가루 설탕은 2 tsp입니다.</p></article></template><template id="catalog-pdf-jj-39"><article class="pdf-card pdf-recipe-card"><h3><span class="pdf-number">39</span>버진 프루트 펀치</h3><p class="pdf-small">Virgin Fruit Punch · 무알코올</p><dl class="pdf-recipe"><div><dt>오렌지 주스</dt><dd class="qty-one">1 oz</dd></div><div><dt>파인애플 주스</dt><dd class="qty-one">1 oz</dd></div><div><dt>크랜베리 주스</dt><dd class="qty-one">1 oz</dd></div><div><dt>자몽 주스</dt><dd class="qty-one">1 oz</dd></div><div><dt>레몬 주스</dt><dd class="qty-half">1/2 oz</dd></div><div><dt>그레나딘 시럽</dt><dd class="qty-half">1/2 oz</dd></div></dl><p class="pdf-method"><b>Blend</b> · 필스너 잔 (받침형)<br/>가니시: 생파인애플 웨지 + 체리</p><p class="pdf-memory">네 과즙 각 1 oz, 레몬과 그레나딘 각 1/2 oz. 무알코올 메뉴.</p></article></template><template id="catalog-pdf-jj-40"><article class="pdf-card pdf-recipe-card"><h3><span class="pdf-number">40</span>불바디에</h3><p class="pdf-small">Boulevardier · 위스키</p><dl class="pdf-recipe"><div><dt>버번 위스키</dt><dd class="qty-one">1 oz</dd></div><div><dt>스위트 베르무트</dt><dd class="qty-one">1 oz</dd></div><div><dt>캄파리</dt><dd class="qty-one">1 oz</dd></div></dl><p class="pdf-method"><b>Stir</b> · 올드 패션드 잔<br/>가니시: 오렌지 껍질 트위스트</p><p class="pdf-memory">버번·스위트 베르무트·캄파리 각 1 oz, 오렌지 껍질 트위스트.</p></article></template><template id="catalog-notebook-template"><div class="catalog-notebook"><h2 class="catalog-notebook-heading">기주·이론·시험 필기</h2><div class="tn-page">
<nav aria-label="필기 바로가기" class="tn-spirit-nav"><a href="#notebook/tequila">데킬라</a><a href="#notebook/gin">진</a><a href="#notebook/liqueur">리큐르</a><a href="#notebook/wine">와인</a><a href="#notebook/exam">기출·낙서</a></nav><section class="tn-section tn-notebook" id="tequila"><h2>데킬라 · Distilled liquor</h2><div class="tn-grid"><article class="tn-class-block" id="tequila-0"><h3>아가베·이름·전파</h3><blockquote class="tn-class-entry"><p class="tn-note-line">[데킬라]</p><p class="tn-note-line">용설란의 일종인 아가베(알로에과, 안에 젤이 없어서 선인장과 라고도 함) 수액을 원료로 증류시켜 만드는 증류주</p><p class="tn-note-line">상당히 크다.</p><p class="tn-note-line">데킬라의 어원: 16세기 스페인이 멕시코를 점령했을 때 테킬라 작은 마을(지명)에 이름에서 유래(스페인어: 격찬, 감탄)</p><p class="tn-note-line">블루아가베만 써야함</p><p class="tn-note-line">멕시코 원주민 언어 테키틀에서 유리(일하다)</p><p class="tn-note-line">전파: 1960년 재즈곡 이름으로 알림, 1968년 멕시코 올림픽</p></blockquote></article><article class="tn-class-block" id="tequila-7"><h3>제조·숙성</h3><blockquote class="tn-class-entry"><p class="tn-note-line">distilled liquor - tequila</p><p class="tn-note-line">제조과정: 메즈칼(Mezcal) 풀퀘(Pulque) 단식증류로 두번 증류, 블랑코, 레포사도, 아네호</p><p class="tn-note-line">에벌레가 있음</p><p class="tn-note-line">색이 들어간 것: 오크통에서 숙성 - 데킬라도 노란색이지.</p><p class="tn-note-line">블랑코(숙성 3개월 아래라 투명, 향적고, 칵테일 용)</p><p class="tn-note-line">REPOSADO : 3개월\~1년 Rested. 통에서 쉬었다.</p><p class="tn-note-line">ANEJO=Aged, 2년숙성, 숙성되었다.</p><p class="tn-note-line">extra nejo? 3년, 비쌈, 클라세아줄.</p></blockquote></article><article class="tn-class-block" id="tequila-14"><h3>메스칼·병 이름</h3><blockquote class="tn-class-entry"><p class="tn-note-line">메즈칼: 데킬라마을 아닌 곳에서 만듬. 훈연향 - 근데 데킬라 아니라면서 왜 데킬라에 포함되는지는 아직 이해못함</p><p class="tn-note-line">시험에는 듀랑고(화이트와인이긴함) 랑 몽테즈마 블루가 나옴.</p><p class="tn-note-line">병에 데킬라라고 써있어야 데킬라다.</p></blockquote></article><article class="tn-class-block" id="tequila-18"><h3>벌레·소금</h3><blockquote class="tn-class-entry"><p class="tn-note-line">애벌레 소금은 몬테알바니에만 있음.(검사 두번 해야한다. 동식물이라. 귀찮아서 잘 수입안됨) - 데킬라는 애벌레 넣는 것 금지. 매지칼은 허용.</p><p class="tn-note-line">잘 익었는지 확인하려고 아가베웜을 넣어 술을 체크했는데, 흰색이면 괜찮고, 파란색이면 메틸알코올 등이 나오는 것이라는 뜻인데, 잘못 되었다는 뜻이겠지.</p></blockquote></article><article class="tn-class-block" id="tequila-20"><h3>브랜드·맛</h3><blockquote class="tn-class-entry"><p class="tn-note-line">patron은 고급, 호세쿠엘보는 마트에서 흔히 보이며, 상위라인은 1800. 이건 고급라인. 인삼향이 남.</p><p class="tn-note-line">데킬라는 1800이랑 HERRADURA가 추천. HERRA이거 맛있음. 실버, 레파사도/엑스트라(내수)</p><p class="tn-note-line">- 데킬라는 소금이랑 같이 먹음. 데킬라 마을이 바다가 없어서 섭취가 어려운데 더워서 땀이 많이 나므로, 소금을 채취한다. 벌레 오줌.</p><p class="tn-note-line">- DOSMAS보다 파이어볼이 한국 내수 시장을 잡았음. DOS가 비싸게 가격 책정을 해서...</p><p class="tn-note-line">- 수정과 맛이 난다. 계피+데킬라 리큐르를 섞었기 때문.</p><p class="tn-note-line">- 파인애플모양 pina 아가베 발효술 '풀퀘' - 이걸 끓여서 증류한게 메즈칼.</p></blockquote></article></div></section><section class="tn-section tn-notebook" id="gin"><h2>진 · Distilled liquor</h2><div class="tn-grid"><article class="tn-class-block" id="gin-0"><h3>정의·주니퍼 베리</h3><blockquote class="tn-class-entry"><p class="tn-note-line">distilled liquor - gin</p><p class="tn-note-line">진의 정의: 보리, 밀, 옥수수 등과 당밀을 혼합, 증류하여 쥬니퍼 베리 노간주나무의 매의 성분을 착미한 증류주.</p><p class="tn-note-line">진은 기주, 주정, 재료가 정해져 있지 않음 주정 만들고, 추가로 들어가는 재료가 훨씬 중요함.</p><p class="tn-note-line">쥬니퍼 베리는 이뇨작용 촉진제로 약용으로 처음 판매되었음</p></blockquote></article><article class="tn-class-block" id="gin-4"><h3>이름·향·전파</h3><blockquote class="tn-class-entry"><p class="tn-note-line">어원: 주니퍼의 불어인 주니에브르에서 유래, 네덜란드로 전해져 제네바, 영국에서 진.(약용으로 첫판매된게 영국에서 술이됨. 너무 인기많아져 다 취하니 금지시킴. 욕조에 넣고 끓여서 먹다보니 "배쓰텁")</p><p class="tn-note-line">침엽수라 솔의눈향이 남. 진은 솔향이 남.</p><p class="tn-note-line">전파: 실비우스 박사에 의해 의약품으로 창시, 1830년 영국에서 진 대량 생산 성공</p><p class="tn-note-line">쥬니퍼베리 + 코리엔더씨(고쉬) 나름 첫입 향기는 향긋했음... 고수향, 마라탕 향... + 레몬껍질 + 안젤리카뿌리(감초) + 설탕 끓여 증류한게 진</p></blockquote></article><article class="tn-class-block" id="gin-8"><h3>맛·품질·시험장</h3><blockquote class="tn-class-entry"><p class="tn-note-line">호불호가 강함. 솔향이라.</p><p class="tn-note-line">진의 품질이 중요함. 바톤은 질이 낮음. 가성비(단가대비 품질좋은 고든스)</p><p class="tn-note-line">두 번의 증류를 통하여 불순물이 완전히 제거된 증류주</p><p class="tn-note-line">진은 숙성, 저장을 하지 않는다.</p><p class="tn-note-line">특유한 방향성의 무색, 투명한 증류주</p><p class="tn-note-line">드라이 진은 감미가 없는 증류주</p><p class="tn-note-line">탱커레이: 고급 진</p><p class="tn-note-line">시험장: 바톤진</p></blockquote></article><article class="tn-class-block" id="gin-17"><h3>진의 종류·병 이름</h3><blockquote class="tn-class-entry"><p class="tn-note-line">네덜란드진: 쥬네바, 제네바진, DAMRAK 칵테일 호환X 사지마. 달아서 쓸 수 없음. 존콜린스에만 쓰임.</p><p class="tn-note-line">OLDTAMJIN은 당도가 미량이나(네덜란드진보다는), 그래도 담... HAYMAN's가 질은 좋음.</p><p class="tn-note-line">LONDON Dry Jin: 설탕 거의 없어서 단맛이 거의 나지 않음. 칵테일 용. 런던에서 만들어짐. 아까 다섯가지 재료들이 법적으로 명시됨. 바에서는 고든스, 비피더 많이 씀.</p><p class="tn-note-line">distilied jin: 증류 리큐르. 무언가가 추가됨. 오렌지, 통레몬 등등. No Ten: 품질은 좋으나 규제와 달라서 런던드라이진이라 하지 못함. 하지만 많이 사용됨</p></blockquote></article></div></section><section class="tn-section tn-notebook" id="liqueur"><h2>리큐르 · Compounded liquor</h2><div class="tn-grid"><article class="tn-class-block" id="liqueur-basics"><h3>정의·어원·제조</h3><blockquote class="tn-class-entry"><p class="tn-note-line">compounded liquor - liqueur 리큐즈</p><p class="tn-note-line">여태 우리 증류주만 했지.</p><p class="tn-note-line">리큐어의 정의: 양조주나 증류주를 기초로 주류, 기타의 물료를 섞거나 초근목피, 약초, 향미, 과실, 당분등을 배합한 술</p><p class="tn-note-line">어원: 녹는다, 녹이다 의미의 라틴어: 리케파세레, 또는 리쿼 에서 유래</p><p class="tn-note-line">기원: 고대 그리스의 의성 히포크라테스</p><p class="tn-note-line">제조방법: 증류법(증류하면 술에 향이 입혀짐, 비쌈) / 침출법(가라앉혀서, 차처럼 우림) / 에센스 추출법, 향유혼합법: 흔하고 저렴, 인공적으로 향 첨가.</p></blockquote></article><article class="tn-class-block" id="liqueur-apricot"><h3>브랜디라는 이름의 리큐르</h3><blockquote class="tn-class-entry"><p class="tn-note-line">apricot: 이름대로 살구 브랜디. 1번씀 여기에만. 증류주가 아니라 리큐르 있음. 증류주도 있긴 한데 얘는 리큐르 쓰는 것. 체리브랜디때도 그랬음.</p><p class="tn-note-line">레몬, 오랜지 주스는 노란주스라 1/2</p><p class="tn-note-line">기주 = 베이스. 많이 사용된 것을 의미함.</p></blockquote></article><article class="tn-class-block" id="liqueur-grasshopper"><h3>그린·화이트·우유</h3><blockquote class="tn-class-entry"><p class="tn-note-line">grasshopper: 풀이 폴짝 뛴다 = 메뚜기</p><p class="tn-note-line">2개 틀리면 실력, 1개 틀리면 감점. 민트초코우유. 맛있다.</p><p class="tn-note-line">creme de menthe망트(G)그린.</p><p class="tn-note-line">creme de cacao(W)는 화이트는 투명(단종)---menthe(W)의 얘기인가? cacao(W)가 단종이면 시험에는 어떻게 나와. W가 B보다 도수가 높고 초코향이 낮음.</p><p class="tn-note-line">밀크라 쉐이크.</p><p class="tn-note-line">잔때문에 실격 잦음. saucer champagne glass.</p><p class="tn-note-line">거품이 올라와야 풍미가 좋아 우유는 전부 하드쉐이킹 하자. 부드럽다. 깔루아 밀크는 일부러 생크림을 넣구 더 풍부하게 하기도 한다.</p></blockquote></article><article class="tn-class-block" id="liqueur-june-bug"><h3>멜론·말리부·바나나</h3><blockquote class="tn-class-entry"><p class="tn-note-line">june bug: 준벅. 6월의 벌레. 해운대점 TGI 프라이데이 바 관련이었구나. 공식문헌은 없고 구전만 되어 내려옴. 패밀리레스토랑으로 너무 알려졌지.</p><p class="tn-note-line">스템잔 빼고는 다 얼음.</p><p class="tn-note-line">멜론 리큐르 / TGI 준벅은 미도리가 공식. 쿠로나+노재팬 영향으로 가격올라 시험에는 안나옴 미도리는. 멜론리큐르는 1번만 씀</p><p class="tn-note-line">코코넛럼: 하와이안ㅋㅋ 말리부.</p><p class="tn-note-line">바나나 리큐어: 1번만씀 .업장에서도 잘 안씀.</p><p class="tn-note-line">파인애플주스 라서 가니쉬가 파인애플</p><p class="tn-note-line">s/s너무 달아서 시연에서는 좀 줄이셨음. 주스랑 ss가 2oz씩</p><p class="tn-note-line">콜린스 잔. 롱드링크 쉐이크라 무게가 무거움. 투명하고 긴 쉐이킹 잔과 아래는 은색인 쉐이킹안에 넣고, 파지조심()열린다?!) 조심해서 쉐이킹. 아일랜드, 준벅 2번 콜린스 잔 나옴.</p></blockquote></article></div></section><section class="tn-section tn-notebook" id="wine"><h2>와인 · Fermented liquor</h2><article class="tn-class-block" id="wine-kir"><h3>키르 · G7 · 카시스</h3><blockquote class="tn-class-entry"><p class="tn-note-line">fermented liquor - wine</p><p class="tn-note-line">Kir: 키르. 키르와인도 있음.</p><p class="tn-note-line">시험장은 G7</p><p class="tn-note-line">화이트와인 베이스의 기주.</p><p class="tn-note-line">creme de cassis: 리큐르계의 msg. 맛있음. 파우스트(고도수) 모든 술을 살려서 아무거나 싼 와인 써도 됨. 부남이 소비뇽블랑 같은거?? 블랙베리(산성)이라 알렉산더에 넣으면 굳음. 프랑스 디종지역 머스타드도 유명함.</p><p class="tn-note-line">white wine glass 1번나옴.</p><p class="tn-note-line">스템글라스니까 칠링.</p></blockquote></article></section><section class="tn-section tn-notebook" id="exam"><h2>기출·낙서</h2><div class="tn-grid"><article class="tn-class-block" id="exam-combinations"><h3>시험장·기출 조합</h3><blockquote class="tn-class-entry"><p class="tn-note-line">데킬라 서울은 듀랑고로 나옴.</p><p class="tn-note-line">올해 시험 조합(기출): 드-풋-비, 미-큐-블(루하와이안 많이 나오니 필수 암기) 코,,, 금-시-, 허-데-피, 풋 - ,,, 블-러-크, 코-오-블 휘경동은 전통주도 자주 나옴.</p></blockquote></article><article class="tn-class-block" id="exam-mnemonic"><h3>쿠·모·시·진</h3><blockquote class="tn-class-entry"><p class="tn-note-line">쿠모시진(칵테일 앞글자들 이름) 용량은 1 1/2</p></blockquote></article><article class="tn-class-block" id="manga"><h3>마더로미 바메이드</h3><blockquote class="tn-class-entry"><p class="tn-note-line">마더로미바메이드 일본만화. 마더로미: 꾸벅꾸벅, 바메이드: 여성은 바텐더가 아니라 바메이드라고 함</p></blockquote></article></div></section></div><div class="pdf-page">

정찬 코스에서 오르되브르(hors d'oeuvre)나 수프(Soup)대신으로 제공하며, 식사와 조화를 
이루고 자극성이 강한 칵테일 
서퍼 칵테일 
(Supper Cocktail) 
만찬용의 식사 중에 제공되는 드라이한 칵테일 - 압생트(Absinthe) 
나이트 캡 칵테일 
(Night Cap Cocktail) 
잠자리 들기 전에 마시는 칵테일 -아니세트(Anisette), 코인트로(Cointreau) 
샴페인 칵테일 
(Champagne Cocktail) 
축하연 때 마시는 상쾌한 맛을 풍기는 칵테일</pre></details><details id="source-history-p27"><summary>27쪽 · Cocktail Category</summary><pre>Cocktail Category 
⑺ 형태에 의한 분류 
 하이볼 
( High-Ball ) 
하이볼 글라스에 증류주를 넣고 얼음과 청량음료를 넣어 혼합된 것 
콜린스 
( Collins ) 
영국에서 시작된 음료로 연회에 초대된 고객에게 감사의 인사로 만들어 졌으며, 처음 만든 사람의 
이름을 따서 부름 
온 더 락스 
( On the Rocks ) 
올드 패션드 글라스에 얼음을 제공하여 그 위에 술을 따라 마시는 것 
스트레이트 
( Straight Up ) 
아무 것도 혼합하지 않고 그대로 마시는 것 
피즈 
( Fizz ) 
탄산음료를 오픈 할 때 피-하는 소리에 의해 붙여진 이름. 베이스에 레몬주스, 설탕, 소다수를 혼
합하고 과일을 장식해 나가는 것 
사워 
( Sour ) 
신맛이라는 뜻으로 베이스에 레몬주스와 설탕을 넣어 만드는 것</pre></details><details id="source-history-p28"><summary>28쪽 · Cocktail Category</summary><pre>Cocktail Category 
⑺ 형태에 의한 분류 
 쿨러 
( Cooler) 
증류주나 와인에 소다수, 진저 엘들 여러 가지 탄산음료를 사용하여 차갑게 제공되는 칵테일 
코블러 
( Cobbler ) 
미국에서 시작된 음료로 텀블러 글라스에 얼음을 채우고 와인이나 증류주에 레몬이나 설탕을 첨
가하여 만든 피로 회복을 위한 칵테일 - 구두 수선공 
크러스터 
( Crusta ) 
껍질이라는 의미로 증류주에 레몬이나 오렌지 껍질을 넣어 만든 칵테일

( Julep ) 
민트가 제공되는 칵테일로 프랑스어로 물약이라는 뜻 
에이드 
( Ade ) 
레몬 또는 오렌지의 과즙에 설탕, 물 또는 탄산음료를 혼합한 칵테일 - 논 알코올릭 칵테일

( Pousse Cafe ) 
정찬에서 식 후에 제공되며, 술의 비중을 두어 층층이 쌓아 술이 섞이지 않도록 띄워서 제공하는 
칵테일</pre></details><details id="source-history-p29"><summary>29쪽 · Cocktail Category</summary><pre>Cocktail Category

에. 스카치: 러스티 네일.</p><p class="pdf-memory">버번은 불바디에만 1 oz, 나머지 네 잔은 1½ oz. 러스티는 스카치 1 + 드람뷔 ½.</p></article><article class="pdf-card" data-entry=""><h3>브랜디 · 과일 → 발효·증류</h3><p>포도 브랜디와 사과 브랜디를 구분합니다. 코냑·아르마냐크는 지역과 생산 기준이 있는 이름이며, 사과 브랜디의 예로 칼바도스를 연결합니다.</p><p><b>레시피 연결</b> 사이드카·브랜디 알렉산더는 브랜디, 허니문은 애플 브랜디. 세 메뉴 모두 칵테일 잔 + Shake.</p><p class="pdf-memory">사이드카 1·1·¼ / 알렉산더 ¾·¾·¾ / 허니문 ¾·¾·¼·½. 레몬이 없는 알렉산더는 우유와 카카오!</p></article><article class="pdf-card" data-entry=""><h3>보드카 · 주재료의 이름부터</h3><p>곡물이나 감자 등 여러 원료로 만듭니다. 자료의 무색·무미·무취는 중성적인 성격을 강조한 설명입니다. 모든 보드카의 향과 맛이 완전히 없다는 뜻은 아니에요.</p><p><b>레시피 연결</b> 블랙 러시안·모스코 뮬·시브리즈·코스모폴리탄·애플 마티니에 연결합니다.</p><p class="pdf-memory">뮬·시브리즈의 보드카는 1½, 블랙·코스모·애플은 1. 코스모의 세 부재료는 ½·½·½.</p></article><article class="pdf-card" data-entry=""><h3>럼 · 사탕수수 계열 원료</h3><p>수업 자료는 당밀을 원료로 소개합니다. 화이트·골드·다크를 비교하되 색만으로 숙성 기간과 제품 성격을 확정하지 않아요.</p><p><b>레시피 연결</b> 피나 콜라다·블루 하와이안·마이 타이·쿠바 리브레·다이키리·바카디 칵테일.</p><p class="pdf-memory">피나·마이는 1¼ / 블루는 1 / 쿠바는 1½ / 다이키리·바카디는 1¾. 바카디 칵테일은 바카디 화이트 럼!</p></article><article class="pdf-card" data-entry=""><h3>데킬라 · 블루 아가베</h3><p>아가베의 중심부 피냐에서 얻은 당을 발효·증류합니다. 원료·메스칼·풀케·숙성 분류는 기존 데킬라 노트의 근거를 함께 확인하세요.</p><p><b>레시피 연결</b> 마가리타와 테킬라 선라이즈의 기주는 모두 1½ oz. 롱 아일랜드의 데킬라는 ½ oz입니다.</p><p class="pdf-memory">마가리타 1½·½·½ + 소금. 선라이즈 1½ + 오렌지 Fill + 석류 ½.</p><a class="pdf-inline" href="tequila.html">아가베·숙성 상세 노트 →</a></article><article class="pdf-card" data-entry=""><h3>진 · 주니퍼 향 연결</h3><p>주니퍼 향이 중심인 증류주입니다. 자료의 ‘숙성시키지 않는다’ 같은 문장은 진의 모든 제품에 대한 절대 규칙으로 외우지 않아요. <a href="tequila.html#gin">새 진 수업 필기·종류·병 이름 →</a></p><p><b>레시피 연결</b> 드라이 마티니·네그로니·싱가포르 슬링·롱 아일랜드·진 피즈. 애프리콧에는 진이 1 tsp만 들어갑니다.</p><p class="pdf-memory">마티니 진 2, 네그로니 ¾씩, 슬링·피즈 진 1½. 애프리콧은 진 한 티스푼!</p></article><article class="pdf-card" data-entry=""><h3>리큐르 · 향과 당을 더한 술</h3><p>증류·침출·에센스 첨가 등 향을 얻는 방식을 묶어 봅니다. 커피·과일·허브·크림 등 재료로 이름을 연결하세요.</p><p><b>레시피 연결</b> 그래스호퍼는 민트 그린·카카오 화이트·우유 각 1 oz. 알렉산더의 카카오 브라운과 색을 구분합니다.</p><p class="pdf-memory">푸스 카페: 석류 → 초록 민트 → 브랜디. B-52: 커피 → 크림 → 그랑 마르니에. 각 ⅓ part.</p></article><article class="pdf-card" data-entry=""><h3>와인 · 발효주와 강화와인</h3><p>와인은 포도 발효주입니다. 베르무트는 향을 가한 강화와인으로, 드라이와 스위트를 구분해 레시피에 연결합니다.</p><p><b>레시피 연결</b> 키르는 화이트 와인 3 oz + 크렘 드 카시스 ½ oz, Build, 화이트 와인 잔, 레몬 껍질 트위스트.</p><p class="pdf-memory">마티니엔 드라이, 맨해튼·불바디에·네그로니엔 스위트 베르무트.</p></article><article class="pdf-card" data-entry=""><h3>논알코올 · 두 잔 비교</h3><p>프레시 레몬 스쿼시는 생레몬 반 개를 짜서 설탕 2 tsp, 소다 Fill. 버진 프루트 펀치는 과즙 5종과 석류 시럽을 블렌딩합니다.</p><p><b>레시피 연결</b> 스쿼시: Build + 하이볼 + 레몬 슬라이스. 펀치: Blend + 필스너 + 파인애플 웨지·체리.</p><p class="pdf-memory">스쿼시는 설탕 둘. 펀치는 오·파·크·자 1씩, 레몬·석류 ½씩.</p></article><article class="pdf-card" data-entry="" id="traditional-memory"><h3>전통주 5종 · 힐감 · 진홍 · 풋안 · 금삼 · 고복</h3><ul><li><b>힐링 → 감홍로</b> · 베네딕틴과 카시스가 각 ⅓ oz.</li><li><b>진도 → 진도 홍주</b> · 민트 화이트와 라즈베리 각 ½ oz, 청포도 ¾ oz.</li><li><b>풋사랑 → 안동소주</b> · 소주와 애플 퍼커 각 1 oz, 트리플 섹과 라임 각 ⅓ oz.</li><li><b>금산 → 금산 인삼주</b> · 커피와 애플 퍼커 각 ½ oz, 라임은 <b>1 tsp</b>.</li><li><b>고창 → 선운산 복분자주</b> · 복분자와 스프라이트 각 2 oz, 트리플 섹 ½ oz.</li></ul><p class="pdf-memory">앞의 네 잔은 Shake + 칵테일 잔. 고창만 Stir + 플루트 샴페인 잔. 장식은 힐링 레몬, 풋사랑 사과!</p></article><article class="pdf-card" data-entry=""><h3>기법 5개 · 손동작과 연결</h3><ul><li><b>Build</b> · 제공할 잔에서 재료를 조합합니다.</li><li><b>Stir</b> · 바 스푼으로 저어 섞습니다. 얼음을 거를지는 메뉴의 제공 방식에 맞춥니다.</li><li><b>Shake</b> · 셰이커에서 흔들어 섞고 차갑게 합니다.</li><li><b>Blend</b> · 블렌더로 재료와 얼음을 갑니다.</li><li><b>Float</b> · 층을 이루도록 올립니다. 1/3 part는 oz가 아니라 비율입니다.</li></ul><p class="pdf-memory">수업 블렌드 순서: 제출 잔에 얼음을 계량해 잠깐 칠링 → 그 얼음을 바로 블렌더 통으로 → 통에 재료 계량 → 뚜껑 닫고 블렌딩. 녹은 물을 따로 버리는 단계를 넣지 않기.</p></article></div></section><section aria-labelledby="theory-title" class="pdf-section" data-section="theory" id="theory"><div class="pdf-section-head"><h2 id="theory-title">이론·역사·용어</h2><p>칵테일_history.pdf의 흐름을 따라 정리했습니다. 연대와 어원 설화는 레시피 숫자와 구분해서 읽어요.</p></div><div class="pdf-grid"><article class="pdf-card" data-entry=""><h3>음료의 큰 분류</h3><ul><li><b>비알코올 음료</b> · 탄산음료, 과일·채소 주스, 우유, 커피·차.</li><li><b>발효주</b> · 곡물이나 과일의 당을 발효: 맥주·와인 등.</li><li><b>증류주</b> · 발효한 술을 증류: 위스키·브랜디·럼 등.</li><li><b>혼성주</b> · 술에 향·당 등을 더한 술: 여러 리큐르.</li></ul><p class="pdf-memory">발효 → 증류 → 향·당 첨가. 만드는 과정을 먼저 떠올리기.</p></article><article class="pdf-card" data-entry=""><h3>맥주 · 보·홉·효·물</h3><p><b>보리(맥아) · 홉 · 효모 · 물</b>을 원료 축으로 외웁니다. 홉은 쓴맛과 향, 효모는 발효와 연결합니다.</p><p><b>에일</b>은 상면발효, <b>라거</b>는 하면발효로 비교합니다. 수업의 예시는 에일·포터·스타우트와 필스너·뮌헨·도르트문트·보크예요.</p><p class="pdf-memory">에일 위, 라거 아래. 색이 진하면 무조건 에일이라는 규칙은 만들지 않기.</p><p>기원·수도원 양조·1516년 독일 맥주 순수령은 자료가 다루는 역사 흐름입니다. 모든 역사 연대와 일화를 확정 사실로 검증한 것은 아닙니다.</p></article><article class="pdf-card" data-entry=""><h3>한국 전통주 · 분류와 지역</h3><p>자료는 <b>탁주·약주·청주·소주·가향주</b>를 소개합니다. 누룩과 발효, 증류의 차이를 함께 떠올리세요.</p><p>문배주, 한산 소곡주, 면천 두견주, 안동소주, 경주 교동 법주가 지역 술의 예로 나옵니다. <b>한산 소곡주는 충남 서천</b>으로 정정해 읽습니다.</p><p>삼한의 누룩 이야기 → 고려의 증류주 전래 → 조선의 가양주 → 근현대 주세·제도 변화가 수업의 역사 순서입니다. 자료 속 옛 부처명과 법 정의는 현재 규정으로 사용하지 않아요.</p><p class="pdf-memory">전통주 칵테일 5종의 기주와, 이론 페이지의 지역 술 목록은 다른 목록!</p></article><article class="pdf-card" data-entry=""><h3>칵테일의 뜻과 유래 이야기</h3><p>여러 재료를 혼합해 만드는 음료로, 기주와 부재료의 조합을 익힙니다. 논알코올 칵테일도 별도로 분류합니다.</p><p>수업은 <b>수탉 꼬리·Cola de Gallo·Coquetier·Coquetel</b> 등의 어원 이야기를 소개합니다. 여러 설을 하나의 확정된 기원으로 합치지 않아요.</p><p>혼합 음료 → 펀치 → 얼음의 보급 → 미국 금주법 시대 → 대중화 순으로 흐름을 잡고, 금주법 시기(1920~1933)는 자료 속 연표로 연결합니다.</p></article><article class="pdf-card" data-entry=""><h3>칵테일 분류 · 기준별로 따로</h3><ul><li><b>마시는 방식</b> · Straight / Mixed.</li><li><b>양과 즐기는 방식</b> · Long / Short.</li><li><b>맛</b> · Dry / Sweet / Sour.</li><li><b>온도</b> · Cold / Hot.</li><li><b>알코올 유무</b> · Alcoholic / Non-alcoholic.</li><li><b>용도</b> · Aperitif(식전), After Dinner(식후), Club, Supper, Night Cap, Champagne.</li></ul><p class="pdf-memory">방식·길이·맛·온도·알코올·용도. 분류 기준을 하나씩 붙여 보기.</p><p>식전·식후·나이트캡은 제공 상황을 설명하는 용어예요. 소화·수면 개선을 보장하는 효능으로 읽지 않습니다.</p></article><article class="pdf-card" data-entry=""><h3>형태 이름 · 이미지로 연결</h3><dl class="pdf-terms"><div><dt>Highball / Collins</dt><dd>하이볼은 증류주·얼음·청량음료의 조합으로, 콜린스는 시트러스·당·탄산이 있는 긴 음료 계열로 연결합니다.</dd></div><div><dt>On the Rocks / Straight Up</dt><dd>온 더 록스는 얼음과 함께 제공. Straight Up은 자료에서 원액 음용으로 설명하지만 현장에서는 의미가 혼용되므로 아래 비교 노트를 확인하세요.</dd></div><div><dt>Fizz / Sour</dt><dd>피즈는 탄산, 사워는 산미와 당의 균형으로 연상합니다. 시험 위스키 사워의 소다 워터도 전체 레시피대로 기억하세요.</dd></div><div><dt>Cooler / Cobbler / Crusta</dt><dd>쿨러는 차갑고 긴 음료, 코블러는 얼음·과일 장식, 크러스타는 가장자리 장식과 시트러스 껍질로 연결합니다.</dd></div><div><dt>Julep / Smash</dt><dd>민트와 얼음의 이미지로 묶습니다. 두 이름을 동일한 레시피로 외우지는 않아요.</dd></div><div><dt>Ade / Squash / Tropical</dt><dd>에이드·스쿼시는 과즙·당·물 또는 탄산, 트로피컬은 열대 과일의 이미지. 국가별 이름 사용은 다를 수 있어요.</dd></div><div><dt>Pousse Cafe</dt><dd>비중 차이로 층을 만드는 음료. 시험의 푸스 카페와 B-52를 함께 연습합니다.</dd></div><div><dt>Flip / Mist / Sangaree / Swizzle</dt><dd>플립은 달걀, 미스트는 잘게 부순 얼음, 상가리는 와인·증류주와 당·향신료, 스위즐은 젓는 동작으로 연결합니다. 모든 플립을 따뜻하게만 제공하는 것은 아닙니다.</dd></div></dl></article><article class="pdf-card" data-entry=""><h3>마지막 장의 용어 10개</h3><dl class="pdf-terms"><div><dt>Dry</dt><dd>단맛이 적거나 드라이한 성격. 상품 이름과 실제 당도는 구분합니다.</dd></div><div><dt>Recipe</dt><dd>재료·용량·만드는 방법을 적은 조합.</dd></div><div><dt>Base</dt><dd>칵테일의 중심이 되는 기주.</dd></div><div><dt>Spirits</dt><dd>위스키·럼 등 증류주.</dd></div><div><dt>Single</dt><dd>한 잔의 기본 제공량. 모든 업장에 같은 oz로 고정하지 않아요.</dd></div><div><dt>Snow style</dt><dd>잔 가장자리에 소금·설탕 등을 묻히는 장식과 연결.</dd></div><div><dt>Slice</dt><dd>얇게 썬 조각. 시험의 웨지와 자르는 모양을 구분합니다.</dd></div><div><dt>Chaser</dt><dd>술과 곁들여 마시는 물·음료.</dd></div><div><dt>Pouring</dt><dd>따르기. Jiggering은 지거로 계량하기.</dd></div><div><dt>Peel</dt><dd>과일 껍질. 껍질 트위스트를 과육 웨지와 구분합니다.</dd></div></dl><p>30쪽에는 용어 이름만 있습니다. 위 풀이는 학습을 위해 덧붙인 설명입니다.</p></article><article class="pdf-card" data-entry=""><h3>단위 · 분수보다 단위부터 읽기</h3><dl class="pdf-terms"><div><dt>oz</dt><dd>액량 온스. 레시피에 적힌 분수와 함께 읽기.</dd></div><div><dt>tsp</dt><dd>티스푼. 뉴욕의 그레나딘 ½ tsp를 ½ oz로 붓지 않기.</dd></div><div><dt>dash</dt><dd>비터스 등을 한 번 털어 넣는 소량 단위.</dd></div><div><dt>part</dt><dd>전체에 대한 비율. ⅓ part씩 세 재료 = 1:1:1.</dd></div><div><dt>ea</dt><dd>개수. 생레몬 ½ ea = 반 개.</dd></div><div><dt>Fill / On Top</dt><dd>채우기 / 마지막에 올리기. 공식 표에 없는 수치로 고정하지 않기.</dd></div></dl><p class="pdf-memory">½ oz · ½ tsp · ½ ea 는 전부 다른 양. 숫자 색이 같아도 단위를 끝까지 읽기.</p></article></div></section><section aria-labelledby="differences-title" class="pdf-section" data-section="differences" id="differences"><div class="pdf-section-head"><h2 id="differences-title">다른 표기와 바로잡을 내용</h2><p>원문은 보존하고, 공부할 때 혼동되는 부분에만 비교 설명을 붙였습니다. 모든 역사 일화를 검증했다는 뜻은 아닙니다.</p></div><div class="pdf-grid"><article class="pdf-card" data-entry=""><h3>공식 표 ↔ 수업 레시피</h3><dl class="pdf-terms"><div><dt>힐링</dt><dd>2024 공식 표도 감홍로를 “1/1/2oz”로 인쇄했습니다. 수업 PDF 2쪽은 “1, ½ oz”. 수업 표기는 1½ oz로 읽히지만 공식 정정으로 간주하지 않으며, 기존 용량 채점 제외를 유지합니다.</dd></div><div><dt>고창</dt><dd>수업 PDF 6쪽은 Cointreau 또는 Triple Sec, 공식 표는 Triple Sec입니다.</dd></div><div><dt>롱 아일랜드</dt><dd>수업 47쪽의 콜라는 Fill, 공식 표는 On Top입니다. 정해진 oz를 임의로 붙이지 않아요.</dd></div><div><dt>마이 타이</dt><dd>공식 가니시 원문은 “A Wedge of fresh Pineapple(orange) &amp; Cherry”. 생파인애플 또는 오렌지 웨지 + 체리로 읽으며, 수업 자료는 파인애플 + 체리로 표기합니다. 사이트 연습은 파인애플로 통일했어요.</dd></div><div><dt>시브리즈</dt><dd>수업 27쪽은 레몬 웨지, 공식 표는 라임 또는 레몬 웨지입니다.</dd></div><div><dt>코스모폴리탄</dt><dd>수업 28쪽은 레몬 껍질 트위스트, 공식 표는 라임 또는 레몬 껍질 트위스트입니다.</dd></div><div><dt>마가리타</dt><dd>수업 41쪽은 Triple Sec, 공식 표는 Cointreau 또는 Triple Sec으로 표기합니다.</dd></div><div><dt>tsp와 oz</dt><dd>수업 자료의 1 tsp 옆 “1/8 oz” 병기는 그대로 환산 정답으로 쓰지 않습니다. 공식 표 단위는 1 tsp예요.</dd></div></dl></article><article class="pdf-card" data-entry=""><h3>코냑 등급 · VS 2 / VSOP 4 / XO 10</h3><p>코냑의 최소 숙성 연수는 블렌드에서 <b>가장 어린 원액</b> 기준으로 VS 2년, VSOP 4년, XO 10년입니다. 자료의 <b>Extra 50~75년</b>을 공통 공식 기준으로 암기하지 않아요.</p><p>‘그랑 샹파뉴 최소 50%’ 조건은 모든 코냑이 아니라 <b>Fine Champagne</b> 표기에 해당합니다. Grande Champagne와 Petite Champagne 원액으로 구성합니다.</p><p><a href="https://www.cognac.fr/faq/" rel="noopener noreferrer" target="_blank">BNIC · 숙성 등급 ↗</a> · <a href="https://www.cognac.fr/en/discover/a-unique-spirit/a-protected-origin/" rel="noopener noreferrer" target="_blank">BNIC · Fine Champagne ↗</a></p></article><article class="pdf-card" data-entry=""><h3>셰리·포트와 브랜디 구분</h3><p>자료 17쪽의 Jerez(셰리)와 Porto(포트)는 <b>와인 계열</b>로 읽습니다. 포트는 강화와인이며, 이를 곧바로 브랜디라고 부르지 않아요. Brandy de Jerez는 별개의 제품명입니다.</p><p><a href="https://www.ivdp.pt/en/wines/port-wines/introduction/" rel="noopener noreferrer" target="_blank">IVDP · 포트 와인 ↗</a> · <a href="https://www.sherry.wine/recent-regulatory-changes" rel="noopener noreferrer" target="_blank">셰리 원산지 위원회 · 와인 규정 ↗</a></p></article><article class="pdf-card" data-entry=""><h3>홉과 한산 소곡주</h3><p>홉 <i>Humulus lupulus</i>는 <b>삼과(Cannabaceae)</b>입니다. 자료의 ‘뽕나무과’와 구분합니다.</p><p>한산 소곡주의 지역은 <b>충남 서천</b>입니다. 자료 16쪽의 ‘충북’ 표기는 정정합니다.</p><p><a href="https://powo.science.kew.org/taxon/303502-2" rel="noopener noreferrer" target="_blank">Kew · 홉 분류 ↗</a> · <a href="https://www.mafra.go.kr/bbs/mafra/68/250671/download.do" rel="noopener noreferrer" target="_blank">농림축산식품부 · 서천 한산소곡주 ↗</a></p></article><article class="pdf-card" data-entry=""><h3>보드카의 보온 이야기</h3><p>자료 24쪽의 “저체온증을 방지하기 위해 개발”이라는 설명을 음주의 보온 효과로 외우지 않습니다. <b>술은 저체온증 예방 수단이 아닙니다.</b> 해당 문장의 역사적 기원도 확인되지 않았어요.</p><p><a href="https://www.cdc.gov/winter-weather/prevention/" rel="noopener noreferrer" target="_blank">CDC · 저체온증과 음주 ↗</a></p></article><article class="pdf-card" data-entry=""><h3>Straight Up · 말보다 제공 상태 확인</h3><p>자료는 “아무것도 혼합하지 않고 그대로”라고 설명합니다. 현장에서는 <b>Straight Up</b>이 혼용되기도 하므로, 차갑게 섞어 얼음을 거르는지(Up), 그대로 따르는지(Neat)를 확인하는 편이 명확합니다.</p><p><a href="https://jeffreymorgenthaler.com/up-neat-straight-up-or-on-the-rocks/" rel="noopener noreferrer" target="_blank">바텐더 Jeffrey Morgenthaler · 용어 구분 ↗</a></p></article><article class="pdf-card" data-entry=""><h3>데킬라·어원·출제 빈도 읽는 법</h3><p>데킬라의 아가베 분류·숙성 기간·풀케와 메스칼 관계는 기존 <a href="tequila.html">기주 노트</a>에 원문과 근거를 함께 정리했습니다.</p><p>칵테일 이름의 유래 설화, 브랜드의 홍보 이야기, 지역별 출제 확률은 <b>공식 표의 재료·용량 정보와 구분</b>합니다. 이 PDF들만으로 특정 지역에서 Blend/Float가 반드시 나온다는 확률을 확정하지 않습니다.</p></article></div></section>
