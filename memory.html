<template id="memory-mnemonics-guide-template">
<details class="memory-mnemonics-guide">
<summary><strong>암기법</strong></summary>
<div class="mnemonics-guide-body">

<div class="mnemonics-pairs">
<section><h3>① 러스티 ↔ 블랙</h3><p class="mnemonics-formula">기주 1 oz + 짝꿍 ½ oz</p><p>러스티: <b>스카치 + 드람뷔</b><br/>블랙: <b>보드카 + 커피</b></p><p class="note-aside">둘 다 Build · 올드 패션드 잔 · 장식 없음. 두 병의 이름만 바꿔 말하기!</p></section>
<section><h3>② 모스코 ↔ 쿠바</h3><p class="mnemonics-formula">기주 1½ oz + 라임 ½ oz + 탄산 Fill</p><p>모스코: <b>보드카 + 진저 에일 + 슬라이스</b><br/>쿠바: <b>라이트 럼 + 콜라 + 레몬 웨지</b></p><p class="note-aside">보·진·슬 ↔ 럼·콜·웨. 둘 다 Build, 하이볼 잔!</p></section>
<section><h3>③ 다이키리 ↔ 바카디</h3><p class="mnemonics-formula">럼 1¾ oz + 라임 ¾ oz + 단맛 1 tsp</p><p>다이키리: <b>라이트 럼 + 가루 설탕</b><br/>바카디: <b>바카디 화이트 럼 + 그레나딘</b></p><p class="note-aside">가루 ↔ 빨간 시럽. 끝 숫자는 둘 다 ¾, 장식은 둘 다 없음.</p></section>
<section><h3>④ 사이드카 ↔ 애플 마티니</h3><p class="mnemonics-formula">기주 1 oz + 리큐르 1 oz + 신맛</p><p>사이드카: 브랜디·트리플 섹 + <b>레몬 ¼ oz</b><br/>애플: 보드카·애플 퍼커 + <b>라임 ½ oz</b></p><p class="note-aside">사이드카는 ¼, 애플은 ½. 둘 다 Shake, 애플만 사과 장식!</p></section>
</div>
<div class="mnemonics-shortcuts">
<section><h3>같은 양이어도, 온스는 다르다</h3><p><b>불바디에</b> 버·베·캄 → <b>각 1 oz</b><br/><b>알렉산더</b> 브·카·밀 → <b>각 ¾ oz</b><br/><b>블루 하와이안</b> 술 세 병 → <b>각 1 oz</b>, 파인애플만 <b>2½ oz</b></p></section>
<section><h3>블렌더는 ‘피·블·마·버’</h3><p><b>피</b>나 콜라다 · <b>블</b>루 하와이안 · <b>마</b>이 타이 · <b>버</b>진 프루트 펀치</p><p class="note-aside">이번 33종 중 Blend는 이 네 잔. 시험 시간 기준: ‘잔에 얼음 계량·칠링 → 바로 블렌더로 → 통에 재료 넣기 → 갈아서 같은 잔에’. 필스너 잔과 과일·체리도 연결!</p></section>
<section><h3>석류는 메뉴마다 단위까지!</h3><p><b>뉴욕</b> ½ <b>tsp</b> · <b>바카디</b> 1 <b>tsp</b><br/><b>마이 타이</b> ¼ <b>oz</b> · <b>버진 펀치</b> ½ <b>oz</b></p><p class="note-aside">‘뉴·바는 숟갈, 마·버는 온스.’ 코스모의 빨강은 석류가 아니라 크랜베리.</p></section>
<section><h3>순서에 예외가 있는 두 잔</h3><p><b>올드 패션드</b>는 설탕부터 녹이고 → 얼음·버번.<br/><b>위스키 사워</b>는 소다를 빼고 Shake → 마지막에 소다 1 oz.</p><p class="note-aside">올드 패션드는 설탕 먼저, 위스키 사워는 소다만 마지막에 따로!</p></section>
</div>

</div>
</details>
</template>
<template id="mnemonic-jj-02">
<details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">버·베 2:1, 비터스는 톡!</span></summary><div class="mnemonic-body"><p><b>버</b>번 1½ oz + 스위트 <b>베</b>르무트 ¾ oz + 비터스 1 dash. 2:1은 비율이며, 2 oz·1 oz를 넣는다는 뜻이 아니에요.</p><p class="note-aside">맨해튼은 체리 하나 떠올리기. Stir → 얼음 없이 칵테일 잔.</p></div></details>
</template>
<template id="mnemonic-jj-04">
<details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">설·비·소 먼저, 얼·버 나중!</span></summary><div class="mnemonic-body"><p><b>설</b>탕 1 tsp → <b>비</b>터스 1 dash → <b>소</b>다 ½ oz로 녹이기 → <b>얼</b>음 → <b>버</b>번 1½ oz. 마지막에 가볍게 젓고 장식해요.</p><p class="note-aside">설탕이 있어도 Shake로 가지 않는 메뉴. 직접 잔에 Build, 오렌지 슬라이스 + 체리.</p></div></details>
</template>
<template id="mnemonic-jj-11">
<details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">뉴욕은 라임 반, 석류는 반 숟갈.</span></summary><div class="mnemonic-body"><p>버번 1½ oz + <b>라임 ½ oz</b> + 설탕 1 tsp + <b>그레나딘 ½ tsp</b>. 같은 ‘반’이어도 주스는 oz, 석류 시럽은 tsp예요.</p><p class="note-aside">빨간 뉴욕은 석류! 빨간 코스모는 크랜베리. Shake, 레몬 껍질 트위스트.</p></div></details>
</template>
<template id="mnemonic-jj-10">
<details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">레몬 반·설탕 하나, 소다는 나중에 하나.</span></summary><div class="mnemonic-body"><p>버번 1½ oz + <b>레몬 ½ oz</b> + <b>설탕 1 tsp</b>를 Shake. 잔에 따른 뒤 <b>소다 1 oz</b>를 On Top으로 넣어요.</p><p class="note-aside">사워 전용 잔 + 레몬 슬라이스·체리. 소다까지 흔들지 않기, 이 수업에서는 얹은 뒤 젓지 않기.</p></div></details>
</template>
<template id="mnemonic-jj-40">
<details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">버·베·캄, 한 온스씩.</span></summary><div class="mnemonic-body"><p><b>버</b>번·스위트 <b>베</b>르무트·<b>캄</b>파리 = 각각 <b>1 oz</b>. 세 병이 같은 양이에요.</p><p class="note-aside">같은 양인 알렉산더는 각각 ¾ oz! 불바디에는 Stir → 얼음 있는 잔 → 오렌지 트위스트.</p></div></details>
</template>
<template id="mnemonic-jj-09">
<details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">스카치 하나, 드람뷔 반.</span></summary><div class="mnemonic-body"><p><b>스카치 1 oz + 드람뷔 ½ oz</b>. 두 재료를 제공 잔에서 Build하고 장식 없이 마무리해요.</p><p class="note-aside">블랙 러시안과 양·기법·잔·무장식이 같음. 러스티는 스카치+드람뷔, 블랙은 보드카+커피.</p></div></details>
</template>
<template id="mnemonic-jj-22">
<details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">브·트 하나씩, 레몬은 4분의 1.</span></summary><div class="mnemonic-body"><p><b>브</b>랜디 1 oz + <b>트</b>리플 섹 1 oz + <b>레몬 ¼ oz</b>. 사이드카의 신맛은 유독 ¼로 기억해요.</p><p class="note-aside">애플 마티니도 앞의 두 재료가 1 oz씩. 사이드카는 레몬¼, 애플은 라임½. 둘 다 Shake, 사이드카는 장식 없음.</p></div></details>
</template>
<template id="mnemonic-jj-05">
<details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">브·카·밀, 4분의 3씩.</span></summary><div class="mnemonic-body"><p><b>브</b>랜디·크렘 드 <b>카</b>카오 브라운·라이트 <b>밀</b>크 = 각각 <b>¾ oz</b>. 비율은 1:1:1이지만 1 oz씩이 아니에요.</p><p class="note-aside">초코 우유 같은 세 재료를 하드 셰이킹. 마지막은 넛메그 가루, 함께 흔드는 재료 아님.</p></div></details>
</template>
<template id="mnemonic-jj-28">
<details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">사·베 ¾, 트 ¼, 레 ½.</span></summary><div class="mnemonic-body"><p><b>사</b>과 브랜디와 <b>베</b>네딕틴은 각각 ¾ oz. <b>트</b>리플 섹은 ¼ oz, <b>레</b>몬은 ½ oz. 이 줄은 모두 oz예요.</p><p class="note-aside">허니문 부부처럼 사과와 허브가 같은 양! 트리플 섹보다 레몬이 두 배. Shake, 장식 없음.</p></div></details>
</template>
<template id="mnemonic-jj-38">
<details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">생레몬 반 개, 설탕 두 숟갈, 소다 채워.</span></summary><div class="mnemonic-body"><p><b>생레몬 ½ ea</b>를 짜고 <b>설탕 2 tsp</b>, 소다 워터 <b>Fill</b>. 반 ‘개’와 티스푼 ‘두 개’를 묶어요.</p><p class="note-aside">기존 40종 표에서 가루 설탕 2 tsp는 이 메뉴. 레몬 주스 ½ oz와 구분! Build, 하이볼 잔, 레몬 슬라이스.</p></div></details>
</template>
<template id="mnemonic-jj-39">
<details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">오·파·크·자 하나, 레·그 반.</span></summary><div class="mnemonic-body"><p><b>오</b>렌지·<b>파</b>인애플·<b>크</b>랜베리·<b>자</b>몽은 각각 <b>1 oz</b>. <b>레</b>몬과 <b>그</b>레나딘은 각각 <b>½ oz</b>. 여섯 재료 = 과즙 다섯 + 시럽 하나.</p><p class="note-aside">라임 없이 레몬! Blend → 필스너 잔 → 파인애플 웨지 + 체리.</p></div></details>
</template>
<template id="mnemonic-jj-07">
<details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">보드카 하나, 커피 반.</span></summary><div class="mnemonic-body"><p><b>보드카 1 oz + 커피 리큐르 ½ oz</b>. 검은 커피가 ‘블랙’이라고 연결해요.</p><p class="note-aside">러스티 네일의 스카치·드람뷔만 보드카·커피로 바꿔 떠올리기. Build, 올드 패션드 잔, 장식 없음.</p></div></details>
</template>
<template id="mnemonic-jj-26">
<details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">보·라·진, 하나 반·반·Fill.</span></summary><div class="mnemonic-body"><p><b>보</b>드카 1½ oz + <b>라</b>임 ½ oz + <b>진</b>저 에일 Fill. 여기서 ‘진’은 기주 Gin이 아니라 진저 에일이에요.</p><p class="note-aside">모스코는 슬라이스! 쿠바는 콜라와 웨지. 두 메뉴 모두 Build, 하이볼 잔.</p></div></details>
</template>
<template id="mnemonic-jj-18">
<details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">보·크·자, 하나 반·셋·반.</span></summary><div class="mnemonic-body"><p><b>보</b>드카 <b>1½ oz</b> + <b>크</b>랜베리 <b>3 oz</b> + <b>자</b>몽 <b>½ oz</b>. 빨간 주스만 세 온스로 가장 많아요.</p><p class="note-aside">바닷바람에는 크랜베리와 자몽 두 주스. 라임 주스를 더하지 않기! Build, 하이볼 잔, 웨지.</p></div></details>
</template>
<template id="mnemonic-jj-25">
<details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">보드카만 하나, 트·라·크는 반씩.</span></summary><div class="mnemonic-body"><p><b>보드카 1 oz</b> + <b>트</b>리플 섹·<b>라</b>임·<b>크</b>랜베리 각각 <b>½ oz</b>. 하나 뒤에 반·반·반.</p><p class="note-aside">코스모의 빨강은 크랜베리. 뉴욕의 그레나딘과 바꾸지 않기. Shake, 칵테일 잔, 껍질 트위스트.</p></div></details>
</template>
<template id="mnemonic-jj-19">
<details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">보·애 하나씩, 라임은 반.</span></summary><div class="mnemonic-body"><p><b>보</b>드카 1 oz + <b>애</b>플 퍼커 1 oz + <b>라임 ½ oz</b>. 애플 퍼커는 사워 애플 리큐르예요.</p><p class="note-aside">사이드카와 1·1까지 같고 신맛만 ¼↔½로 비교. 애플은 라임, 사과 슬라이스! 이름에 마티니가 있어도 베르무트는 없음.</p></div></details>
</template>
<template id="mnemonic-jj-24">
<details class="memory-mnemonic"><summary><span class="mnemonic-label">암기 한 줄</span><span class="mnemonic-chant">럼 하나와 ¼, 믹스·파인은 둘씩.</span></summary><div class="mnemonic-body"><p><b>라이트 럼 1¼ oz</b> + <b>피나 콜라다 믹스 2 oz</b> + <b>파인애플 2 oz</b>. 큰 두 잔은 똑같이 둘.</p><p class="note-aside">럼 1¼는 마이 타이와 짝꿍. 시험에서는 믹스를 쓰고 Blend → 필스너 잔 → 파인애플 웨지 + 체리.</p></div></details>
</template>

<template id="common-prep-template">
<section aria-labelledby="common-prep-title" class="common-prep">
<div class="common-prep-head"><h2 id="common-prep-title">공통 준비 · 만들기 전, 잔부터 차갑게</h2></div>
<div class="common-prep-brief"><p><b>시험 준비</b> 제출할 잔 3개를 먼저 고른다. 기본 칠링은 각 잔에 얼음 3개씩. Blend 메뉴는 필스너 잔에 얼음을 계량해 한 번 칠링하고 바로 블렌더 통으로 옮기기.</p><p><b>계량 자세</b> 술을 받을 잔은 몸 앞에. 지거로 계량하고 가까이에서 따르기.</p></div>
<details class="common-prep-details"><summary>칠링·얼음·도구 준비</summary><div class="common-prep-grid">
<section><h3>시험과 업장의 칠링</h3><p>업장에서는 얼음을 넣고 스푼으로 저어 사전 칠링하거나, 냉동실에 보관한 잔을 꺼내 사용한다.</p><p class="note-aside">올드 패션드는 얼음이 있으니 사전 칠링 생략. 헷갈리면 시험 때 잔 3개에 얼음을 다 넣어 두기. 설탕 녹이기 전에는 칠링 얼음을 비운다.</p></section>
<section><h3>믹싱 글라스와 녹은 물</h3><p>Stir용 믹싱 글라스는 얼음과 스푼으로 미리 칠링한다. 계량 전에 스트레이너로 얼음을 잡고 녹은 물만 버린다.</p><p class="note-aside">수업에서 말한 ‘길고 투명한 쉐이킹 잔’. 잔 자체를 냉동실에 두기도 함. 업장에서는 얼음을 넉넉히 준비 — 너무 적으면 빨리 녹아 물이 많이 생긴다는 메모.</p></section>
<section><h3>레몬 껍질 손질</h3><p>껍질을 사용하는 메뉴는 흰 부분을 덜어내고 노란 부분 위주로 준비한다.</p><p class="note-aside">‘흰 부분을 없애듯 베어 노란 부분만!’ 껍질 가니시용 메모. 올드 패션드의 장식은 오렌지 슬라이스 + 체리.</p></section>
</div></details>
<details class="lesson-original"><summary>필기</summary><div class="lesson-original-body"><p class="note-aside">순서: 잔 고르기 &gt; 얼음 칠링하기 &gt; 기법 생각하기 &gt; 기주 선택하기 &gt; 칠링한 얼음 물 버리기 &gt; 술 말기 &gt; 가니쉬(장식) 넣기</p><p class="note-aside">시험: 잔에 얼음 3개넣어(칠링) 옆에 빼두기 / 업장이라면 사전칠링(얼음넣어 수저로 젓기) 하거나 잔을 냉동실에 보관했다 꺼내서 제공할 것 / 실제 업장이라면 얼음 너무 적게 넣으면 빨리 녹아서 물이 많이 생기니까 쉐이킹 잔(투명하고 긴 컵)에 얼음을 가득 채운 후 진행함. 스푼으로 저어 사전칠링하거나 얘 자체를 냉동실에 넣어놈. 스트레이너로 잘 잡고 물만 따라서 버림. 잔은 흘리지 않도록 몸 앞에 두고 지거링(술 계량) 해서 따르는 것이 흘리지 않음.</p><p class="note-aside">만들기 전, 잔부터 차갑게: 모든 것에 동일 적용.</p><p class="note-aside">지거링할때 손 가로로 할 것</p><p class="note-aside">술 뚜껑 다 여는 것은 권장하지 않음</p><p class="note-aside">짐빔: 버번위스키</p><p class="note-aside">나폴레옹: 브랜디</p><p class="note-aside">블렌딩: 필스너 잔에 얼음 계량해서 칠링 한번 하고 바로 블렌더로 옮깁니다. 녹은 물 따라버리기 이런거 말구요. 그리고 블렌더 통에 술 부으며 작업합니다.(시험 시간 기준)</p></div></details>
</section>
</template>
<template id="manhattan-note-template">
<section aria-label="맨해튼 수업 노트" class="recipe-notes manhattan-notes">
<p class="note-cue">버번부터 계량 · Stir · 얼음 없이 제출</p>
<p class="note-taste"><span>한 줄 평</span> 깔끔함.............. 걍 깔끔한 술.</p>
<details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body">
<header class="note-heading"><h4 id="manhattan-notes-title">맨해튼 필기</h4></header>
<div class="mn-layout">
<section aria-labelledby="mn-flow-title" class="mn-flow mn-practice"><h5 id="mn-flow-title">맨해튼, 실제로 손이 움직이는 순서</h5>
<p class="mn-small">스터링 약 3번·믹싱 글라스 80%·코스터 동작은 수업 메모. 재료와 용량은 위 표 기준.</p>
<ol>
<li><strong>바틀 열기 → 라벨 쇼잉</strong><p>병을 열고 <strong>라벨이 보이도록</strong> 잡는다. 재료를 확인하면서 계량 시작!</p></li>
<li><strong>버번 위스키 1 1/2 oz</strong><p>기주부터 지거링해서 믹싱 글라스에 따른다. <strong>켄터키 = 미국</strong>으로 연결!</p><p class="mn-small">시험용 병 암기: ‘켄터키 젠틀맨(Kentucky Gentleman)’. 실제 지급 병의 라벨을 확인하기.</p></li>
<li><strong>스위트 베르무트 3/4 oz</strong><p><strong>마티니 빨간 뚜껑 · Rosso.</strong> 지거로 계량해서 넣는다. 초록 뚜껑 Extra Dry와 헷갈리지 않기.</p></li>
<li><strong>앙고스투라 비터스 1 dash</strong><p>뚜껑을 열고, <strong>병과 잔을 ‘八’ 모양</strong>으로 잡는 동작을 떠올린다. 옆쪽으로 기울여 <strong>톡!</strong> 한 번 털기.</p><p class="mn-small">확 기울이면 비터스가 앞으로 튈 수 있으니 방향을 잡고 톡 털기.</p></li>
<li><strong>바스푼으로 스터링</strong><p>시험: 약 3번 젓기. 업장: 손등에 소량 떨어뜨려 맛보고, 더 저을지 판단.</p><p class="mn-small">업장에서는 횟수만 세기보다 차가움·희석·맛의 균형을 확인하기.</p></li>
<li><strong>제출 잔의 칠링 얼음 버리기</strong><p>옆에 둔 <strong>V자 칵테일 글라스의 얼음과 녹은 물</strong>을 비운다. 이 맨해튼은 <strong>얼음 없이</strong> 담아 제출!</p><p class="mn-small">‘스템(stem)’은 잔의 다리. 여기서 ‘얼음 없음’은 이 맨해튼의 제공 방식으로 기억하기.</p></li>
<li><strong>스트레이너로 입구 잡기</strong><p><strong>용수철이 달린 스트레이너</strong>를 긴 믹싱 글라스 입구에 맞춰 잘 잡는다. 따를 때 혼합용 얼음이 함께 나오지 않도록 거른다.</p></li>
<li><strong>믹싱 글라스 80% 확인</strong><p><strong>술을 섞는 긴 믹싱 글라스의 80%를 넘기지 않기.</strong> 따르기 전, 수업에서 강조한 채움 기준과 흘리지 않을 여유를 확인한다.</p><p class="mn-small">80%는 V자 제출 잔이 아니라 믹싱 글라스 기준.</p></li>
<li><strong>V자 잔에 따르기 → 코스터로</strong><p>스트레이너로 걸러 <strong>칵테일 글라스에 먼저</strong> 따른다. 흘리지 않도록 완성 잔을 코스터로 옮긴다.</p><p class="mn-small">시험 수업 메모: 코스터 위에서 만들지 않기. 먼저 따르고, 그다음 코스터로!</p></li>
<li><strong>가니시 픽에 체리 꽂기</strong><p>이쑤시개처럼 생긴 <strong>가니시 픽</strong>에 체리를 꽂아 잔에 담고 마무리한다.</p></li>
</ol>
<p class="mn-order-reminder">라벨 → 버번 → 스위트 베르무트 → 비터스 → 스터링 → 제출 잔 비우기 → 거르기 → 따르기 → 코스터 → 체리</p>
</section>
<div class="mn-memos">
<section><h5>도시 이름을 보면, 나라부터!</h5><p>맨해튼·뉴욕은 도시명 → <strong>시티 칵테일</strong>로 연결해서 외우기. 이 두 메뉴의 시험 레시피는 미국의 <strong>버번 위스키</strong>를 사용한다.</p><p class="mn-highlight">버번 ↔ 시티 칵테일 ↔ 미국</p><p class="mn-small">맨해튼·뉴욕을 외우기 위한 연결 문장. 기주는 각 메뉴의 공식 레시피로 확인!</p></section>
<section><h5>기주와 부재료 구분하기</h5><p><strong>버번 위스키 = 기주.</strong><br/>스위트 베르무트와 앙고스투라 비터스 = 부재료.<br/><strong>베르무트 = 향을 더한 주정강화와인.</strong><br/><strong>oz = 온스</strong>(여기서는 액량 온스).</p></section>
<section><h5>Stir, 그리고 한 번 툭!</h5><p>Stir = 바 스푼으로 저어 거름망으로 거르기. dash = 한 번 툭, 3~5방울.</p><p class="mn-small">1 dash = 한 번 톡! 3~5방울.</p><p>앙고스투라는 <strong>병보다 큰 라벨</strong>로 기억! 형제가 병과 라벨을 따로 맡았다가 크기를 맞추지 못했다는 이야기.</p></section>
<section><h5>베르무트 병을 고를 때</h5><p><strong>MARTINI(마티니)</strong>는 베르무트를 만드는 브랜드. 여기서 ‘마티니’는 제품의 브랜드명으로 기억하기.</p><div class="mn-bottles"><div><span class="mn-cap mn-cap-green">초록 뚜껑</span><strong>Extra Dry</strong><span>드라이 베르무트 · 옅은 색</span></div><div><span class="mn-cap mn-cap-red">빨간 뚜껑</span><strong>Rosso</strong><span>스위트 베르무트 · 붉은색</span></div></div><p class="mn-small">마티니 초록 뚜껑 = Extra Dry, 드라이 베르무트. 빨간 뚜껑 = Rosso, 스위트 베르무트.</p></section>
<section class="mn-reminder"><h5>기주 바꾸면 이름도 바뀐다</h5><p>맨해튼에 버번 대신 <strong>스카치 위스키</strong>를 쓰면 <strong>롭 로이(Rob Roy)</strong>로 연결된다. 국가와 기주를 헷갈리지 않게 조심!</p></section>
<section><h5>친자노도 같이 기억하기</h5><p><strong>Cinzano(친자노)</strong>도 이탈리아의 베르무트 브랜드. <strong>Rosso는 스위트 베르무트.</strong></p><p class="mn-quote">수업 메모: “빨간 뚜껑. 실기 시험에는 나오지 않음.”</p><p class="mn-small">시험에서 제공하는 브랜드는 시험장 지급 재료 안내로 확인.</p></section>
</div>
</div>
<section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">맨해튼, 뉴욕: 도시명 - 시티 칵테일(국자의 기주 사용 필수)</p><p class="note-aside">버번 위스키: 미국</p><p class="note-aside">stir: 바스푼으로 저어 거름망으로 거르기</p><p class="note-aside">버번 = 시티칵테일 = 미국</p><p class="note-aside">버번위스키는 기주, 스위트 베르무트부터 아래는 부재료. 베르무트: 주정강화와인. oz는 온스</p><p class="note-aside">앙고수트라는 형제가 잘못만든 병. dash는 한번 툭 털기(3~5방울)</p><p class="note-aside">베르무트: 생산하는 회사: 마티니. 마티니 = 베르무트. 초록뚜껑은 화이트와인, extra dry 베르무트, 빨간 뚜껑은 레드와인, rosso, 스위트 베르무트, 즉, 마티니 초록은 dry베르무트, 마티니 빨강은 스위트 베르무트.</p><p class="note-aside">맨하튼 버번 위스키 안쓰고 스카치 쓰면 록로이로 변경되니 국가 기주 안헷갈리게 조심.</p><p class="note-aside">개인적인 맛 평가: 깔끔함.............. 걍 깔끔한 술.</p><p class="note-aside">cinzano라고 있음. 그것도 이태리 주정 강화와인이고 빨간 뚜껑인데 스위트 베르무트임. 실기 시험에는 나오지 않음.</p><p class="note-aside">맨해튼 순서: 바틀 열고 &gt; 라벨 쇼잉 해주면서 &gt; 기주인 버번 위스키(시험장에서는 &#x27;켄터키=미국&#x27; 젠틀맨) 1 1/2oz &gt; 스위트 베르무트 마티니 빨간 뚜껑 3/4oz &gt; 앙고수트라 비터스는 압력에 의해 나오는 거라 확 기울이면 앞으로 날아가니, 뚜껑 열고 잔 八 이렇게 잡구 옆쪽으로 기울여 톡 털기 &gt; 스푼으로 젓기 &gt; 스터링도 3번정도(시험) 업장은 손등에 떨구고 맛보고(테이스팅) 더 할지말지 고민함. &gt; v모양의 스텐글라스?(칵테일글라스)에 담아뒀던 얼음 버리기. 스템글라스는 얼음이 존재하지 않음! &gt; 스트레이너(용수철로 입구 막는거) 로 긴 쉐이킹 잔의 입구 잘 막기 &gt; 긴 쉐이킹 잔의 80% 넘기지 말 것. v잔에 따르고 코스터로 옮겨야 하기 때문. 시험장에서는 코스터 위에서 작업하면 안되고 먼저 따르고 코스터로 옮겨야 하거든....... &gt; 이쑤시개 같은 걸로 가니쉬픽에 체리를 꽂아서 담기</p><p class="note-aside">80%는 술을 섞는 긴 믹싱 글라스.</p></div></section></div></details>

</section>
</template>
<template id="old-fashioned-note-template">
<section aria-label="올드 패션드 수업 노트" class="recipe-notes old-fashioned-notes">
<p class="note-cue">클래식 칵테일 · Build · 설탕부터 녹이기</p>
<p class="note-taste"><span>한 줄 평</span> 으 양주맛 붐따👎</p>
<details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body">
<header class="note-heading"><h4>올드 패션드 필기</h4></header>
<div class="note-basics"><p><b>Build(빌드)</b> 제공할 잔에 직접 재료를 넣어 완성하는 기법.</p><p class="note-aside">‘잔에 바로 지거링해서 따르기 = 소맥’으로 기억. 셰이킹하지 않는다.</p></div>
<section aria-labelledby="of-flow-title" class="mn-flow mn-practice"><h5 id="of-flow-title">실습 순서 · 기주보다 설탕 먼저</h5>
<ol>
<li><strong>가니시 먼저 준비</strong><p>오렌지 슬라이스와 체리를 픽에 꽂아 둔다. 잔을 미리 칠링했다면 얼음과 물을 비운다.</p><p class="note-aside">이 잔은 얼음과 함께 제공! 사전 칠링은 공통 준비 메모 참고.</p></li>
<li><strong>가루 설탕 1 tsp</strong><p>티스푼을 수평으로 깎아 계량하고, 빈 올드 패션드 잔에 넣는다.</p><p class="note-aside">Powdered Sugar = 가루 설탕. 수북하게 말고, 깎아서 한 스푼.</p></li>
<li><strong>앙고스투라 비터스 1 dash</strong><p>병을 기울여 한 번 톡 털어 설탕을 적신다.</p><p class="note-aside">원래 각설탕을 비터스로 적시는 동작으로 기억. 형제가 병·라벨 크기를 맞추지 못했다는 그 병!</p></li>
<li><strong>소다 워터 1/2 oz → 설탕 녹이기</strong><p>지거로 계량해 넣고 스푼으로 저어 설탕을 녹인다. 얼음과 기주는 아직 넣지 않는다.</p><p class="note-aside">소다 워터 = 탄산수. Club Soda도 탄산수. 여기서는 설탕을 녹이려고 조금 넣는다. 이것은 설탕을 푸는 동작이고, 조주법은 Build.</p></li>
<li><strong>얼음 넣기</strong><p>설탕을 녹인 뒤 잔에 얼음을 넣는다.</p><p class="note-aside">순서: 설탕 → 비터스 → 소다 → 녹이기 → 얼음. ‘기주 먼저’로 시작하지 않기.</p></li>
<li><strong>버번 위스키 1 1/2 oz</strong><p>기주를 계량하여 얼음 위로 따른다.</p><p class="note-aside">얼음 위에 증류주 → 거친 표면을 코팅하듯 붓기.</p></li>
<li><strong>가볍게 젓기 → 코스터</strong><p>바스푼으로 가볍게 섞고 완성 잔을 코스터로 옮긴다.</p><p class="note-aside">수업 메모: 마지막에 두세 번만. 탄산을 거칠게 휘젓지 않기. 이 레시피의 소다는 4번에서 이미 넣었으므로 다시 추가하지 않는다.</p></li>
<li><strong>준비한 가니시 올리기</strong><p>오렌지 슬라이스 + 체리 가니시를 잔 입구에 올려 마무리한다.</p><p class="note-aside">체리를 픽에 먼저 찌르고, 그 픽을 오렌지에 꽂기. 안정적으로 고정하면 된다.</p></li>
</ol>
<p class="mn-order-reminder">설탕 → 비터스 → 소다 → 녹이기 → 얼음 → 버번 → 가볍게 젓기 → 코스터 → 가니시</p>
</section>
<div class="note-topic-grid">
<section class="note-topic"><h5>설탕·기법 암기</h5><p>오늘 외우는 9종 중 가루 설탕을 쓰는 메뉴: <b>올드 패션드 Build / 뉴욕 Shake / 위스키 사워 Shake·Build.</b></p><p class="note-aside">‘설탕 나오는 것 중 얘는 빌드!’라는 비교로 기억. 전체 40종에는 다른 Build 메뉴와 가루 설탕을 쓰는 프레시 레몬 스쿼시도 있다.</p><p class="note-aside">업장에서는 좋은 각설탕(원당)을 깸… 마스코바토? 각설탕 중 흑설탕 같은 애 쓰기도 하구.</p><p class="note-aside">시간 지나며 달아지라고 설탕을 남기기도 함. 시험은 설탕 먼저 → 비터스 톡 → 탄산수 → 스푼으로 녹이기. 스터링 말고 그냥 젓기.</p></section>
<section class="note-topic"><h5>가니시 이름부터 확인</h5><p><b>오렌지 슬라이스 + 체리.</b> 40종 표에서 이 조합은 올드 패션드와 싱가포르 슬링에 사용한다.</p><p class="note-aside">‘슬라이스 오렌지’ → 수업에서는 반달 모양. 오렌지를 너무 얇게 썰면 픽에 꽂을 때 흐물거리니, 형태를 지탱할 두께로 자르기.</p><p class="note-aside">체리 먼저 픽에 찌르기 → 오렌지 슬라이스에 꽂기 → 잔 입구에. “걍 냅다 꽂아도 됨, 예쁘게 꾸미는 별도 형태는 안 배움”이라는 수업 메모.</p></section>
<section class="note-topic note-garnish"><h5>슬라이스 · 웨지 · 휠 구분</h5>
<div aria-label="가니시 모양 비교" class="garnish-sketches">
<figure><svg aria-label="반달 모양 슬라이스" role="img" viewbox="0 0 80 60"><path d="M9 18 A31 31 0 0 0 71 18Z" fill="#f5bd6a" stroke="#bb7229" stroke-width="3"></path><path d="M15 20 A25 25 0 0 0 65 20M40 20v24m-3-24L22 37m21-17 15 17" fill="none" stroke="#fff5d9" stroke-width="2"></path></svg><figcaption><b>슬라이스</b><span>반달 · 이번 장식</span></figcaption></figure>
<figure><svg aria-label="쐐기 모양 웨지" role="img" viewbox="0 0 80 60"><path d="M11 45 53 8Q70 24 64 49Z" fill="#f5bd6a" stroke="#bb7229" stroke-width="3"></path><path d="m14 44 39-31q13 12 8 31ZM16 43l43-13" fill="none" stroke="#fff5d9" stroke-width="2"></path></svg><figcaption><b>웨지</b><span>중심을 향한 쐐기</span></figcaption></figure>
<figure><svg aria-label="동그란 휠" role="img" viewbox="0 0 80 60"><circle cx="40" cy="30" fill="#f5bd6a" r="26" stroke="#bb7229" stroke-width="3"></circle><circle cx="40" cy="30" fill="none" r="21" stroke="#fff5d9" stroke-width="2"></circle><path d="M40 9v42M19 30h42M25 15l30 30M25 45l30-30" stroke="#fff5d9" stroke-width="2"></path></svg><figcaption><b>휠</b><span>원형 · 비교용</span></figcaption></figure>
</div>
<ol class="note-cutting"><li>과일 양끝의 꼭지 부분을 정리한다.</li><li>꼭지와 반대쪽 꼭지를 잇는 방향으로 길게 반을 가른다.</li><li><b>슬라이스:</b> 반쪽을 눕혀 길이 방향에 직각으로 썰면 반달.</li><li><b>웨지:</b> 길이 방향으로 중심을 향해 비스듬히 잘라 쐐기 모양.</li></ol>
<p class="note-aside">이미 손질된 덩어리 모양부터 보기! 웨지용을 슬라이스로, 슬라이스용을 웨지로 바꿔 쓰지 않기. 통과일을 가로로 자른 원형이 휠이며, 공식 표에는 ‘휠’이라는 가니시 명칭이 없다.</p>
<p class="note-caption">웨지 덩어리를 슬라이스로 자르거나 슬라이스 덩어리를 웨지로 바꾸지 않기. 가니시 이름을 보고 손질!</p>
</section>
<section class="note-topic"><h5>실습 때 들은 메모</h5><p class="note-aside">통과일로 나오면 첫 조가 처음 손질한다. 다음 조는 앞 조가 손질한 과일을 보게 되어 첫 조가 조금 불리하다는 수업 이야기. 실제 지급 상태는 당일 확인.</p><p class="note-aside">가니시는 모양 이름을 먼저 읽고 자르기. 오렌지는 얇게 저미지 말고 픽에 꽂혀 버틸 두께로. 최종 조립은 체리 → 오렌지, 마지막에 잔 입구!</p></section>
</div>
<section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">올드 패션드 = 클래식 칵테일.</p><p class="note-aside">한줄평: 으 양주맛 붐따👎</p><p class="note-aside">레몬은 흰부분을 없애는 느낌으로 베어 노란부분만 사용하기. 업장에서는 좋은 각설탕(원당) 을 깸... 마스코바토? 각설탕 중 흑설탕같은 애 쓰기도 하구.</p><p class="note-aside">쉐이킹이 아니라 빌드(과제중 유일함). 얘 빼고 설탕 나오면 다 쉐이킹임. 시간지나며 달아지라고 설탕 안섞고 뿌리기만 함. 얼음있으니 사전칠링은 하지 않음. 하지만 헷갈릴테니 시험때는 미리 걍 잔 3개에 얼음 다 넣어두기.</p><p class="note-aside">빌드 기법: 잔에 지거링 해서 따르기 = 소맥. 그냥 따르는 것.</p><p class="note-aside">기주: 버번. powdered sugar은 걍 가루 설탕. 앙고수트라 형제가 잘못 만든 병. 소다워터 = 탄산수. 설탕 녹이려고 조금 넣는 것. = club soda 도 탄산수. 가니쉬는 얘랑 싱가폴 두개만 이 가니쉬를 씀. slice는 반달모양</p><p class="note-aside">통과일 로 나올때 2조부터는 그 앞조에서 손질해두었기에 1조가 조금 분리함. 가로로 썰면 휠(동그라미) &gt; 이 가니쉬는 조주기능사에 없음. 무조건 꼭지와 꼭지사이로 세로로 길게 자르는 것밖에 없음. 가니쉬은 끝은 없애기. 꼭지와 꼭지 사이를 자른다 = 세로로 자른다는 뜻. 눕혀서 자르면 반달모양, = slice, 세로로 자르면 웨지(자를때 대각선으로, 중앙을 향해 잘라야함) 이거 헷갈리면 실격임. 기존에 잘라둔 모양 보고 웨지로 쓰던걸 슬라이스로 자르면 안됨. 슬ㄹ라이스 덩어리를 웨지로 자르는 것도 안됨.</p><p class="note-aside">가니쉬이름이 슬라이스 오렌지라 반달모양을 자르라는 것</p><p class="note-aside">오렌지는 너무 얇게 썰면 가니쉬픽으로 체리를 꽂을때 너무 흐물거려 꽂히지 않으니, 두껍게 썰것.</p><p class="note-aside">가니쉬픽으로 체리 먼저 찌른 상태에서 오렌지에 꽂으면 오렌지 슬라이스 체리라는 가니쉬가 됨. 걍 냅다 꽂아도 됨. 예쁘게 형태에 대한 기준 없음</p><p class="note-aside">순서 다름. 기주 안넣고 설탕 녹일거라 설탕 먼저 넣음. 1티스푼: 깎아서 설탕 넣기. 원래 비터스로 각설탕을 적심. 기울여 한번 톡 털어 설탕에 묻혀둠. 탄산수를 1/2 계량해서 따르기. 설탕을 스푼으로 적어 녹임. 스터링 말고 걍 젓기. 시험장에서는 대충 넣고 젓는 흉내만 내도 됨. 얼음 넣기 &gt; 얼음 위에 증류주를 넣으며는 얼음의 거친 표면을 코팅해서 얼음 녹는 걸 방지. 탄산수도 그 위에 올려야 탄산이 안 날아감. 버번 위스키 넣고 &gt; 빌드의 마지막은 스푼으로 젓기. 두세번만. 코스터</p><p class="note-aside">아까 만든 가니쉬 입구에 올리기</p></div></section></div></details>

</section>
</template>
<template id="new-york-note-template">
<section aria-label="뉴욕 수업 노트" class="recipe-notes new-york-notes">
<p class="note-cue">시티 칵테일 · Shake · 그레나딘은 1/2 tsp</p>
<p class="note-taste"><span>한 줄 평</span> 생각보다 맛있지는 않았음...</p>
<details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body">
<header class="note-heading"><h4>뉴욕 필기</h4></header>
<div class="note-basics"><p><b>라임 주스 1/2 oz · 가루 설탕 1 tsp · 그레나딘 시럽 1/2 tsp</b></p><p class="note-aside">같은 ‘1/2’라도 단위가 다름! 그레나딘은 온스가 아니라 티스푼. 이 실수 특히 조심.</p></div>
<div class="note-topic-grid">
<section class="note-topic"><h5>먼저, 레몬 트위스트 준비</h5><ol class="note-cutting"><li>레몬의 <b>껍질만</b> 준비한다. 과육이 붙지 않도록 하고 흰 부분을 덜어낸다.</li><li>껍질 양끝을 교차해 잡고, 모양을 만든다.</li><li>한 번 더 살짝 꼬아 눌러 트위스트 형태를 잡는다.</li></ol><p class="note-aside">칼질이 불안하면 집게로 고정해서 손이 칼날 쪽에 가지 않게 하기. 양끝을 세게 당기지 않기 — 잡고, 꼬고, 눌러서 형태만!</p></section>
<section class="note-topic"><h5>레몬 향과 마무리 메모</h5><p>뉴욕의 가니시는 <b>레몬 껍질 트위스트</b>. 준비한 껍질을 완성 잔에 가볍게 넣거나 얹어 마무리한다.</p><p class="note-aside">레몬을 잔에 바르거나 돌아가며 트위스트. 걍 잔에 던져서 넣어버려도 ㄱㅊ.</p></section>
</div>
<section aria-labelledby="ny-flow-title" class="mn-flow mn-practice"><h5 id="ny-flow-title">실습 순서 · 기법은 셰이킹</h5>
<ol>
<li><strong>칵테일 잔·셰이커에 얼음</strong><p>V자 칵테일 글라스에 칠링용 얼음을 넣어 옆에 둔다. 은색 셰이커 바디에는 혼합용 얼음을 넣는다.</p><p class="note-aside">잔에 넣은 얼음과 셰이커 안의 얼음은 용도가 다름. 잔 준비는 위 공통 메모 참고.</p></li>
<li><strong>버번 위스키 1 1/2 oz</strong><p>기주를 라벨 쇼잉하고 지거로 계량해 셰이커에 넣는다.</p><p class="note-aside">뉴욕도 시티 칵테일 → 미국 → 버번. 수업에서 본 병은 켄터키 젠틀맨(Kentucky Gentleman).</p></li>
<li><strong>라임 주스 1/2 oz</strong><p>부재료인 라임 주스를 계량해 넣는다.</p><p class="note-aside">시니까 뉴욕은 1/2 oz로 기억. 부재료는 라벨 쇼잉 생략.</p></li>
<li><strong>가루 설탕 1 tsp</strong><p>티스푼을 수평으로 깎아 한 스푼 넣는다.</p><p class="note-aside">수북하게 말고 깎아서! 설탕 등이 묻은 스푼은 다음 사용 전에 헹궈 정리.</p></li>
<li><strong>그레나딘 시럽 1/2 tsp</strong><p><b>1/2 oz가 아닌 1/2 tsp</b>를 계량해 넣는다. 사용한 스푼은 헹군다.</p><p class="note-aside">그레나딘 = 석류 시럽, 색을 내는 재료. 1/2 oz 아님! 티스푼 절반.</p><p class="note-aside">안정적으로 따르기: 셰이커 입구 쪽에 스푼을 받쳐 병에서 따르거나, 지거에 조금 덜어 스푼으로 옮기기. 최종 양은 꼭 1/2 tsp.</p></li>
<li><strong>닫고 셰이킹</strong><p>셰이커를 닫고 뚜껑과 바디를 단단히 잡은 뒤 흔들어 섞고 차갑게 만든다.</p><p class="note-aside">수업에서 배운 방향: 뚜껑은 내 가슴 쪽을 향하게. 잡는 부분이 풀리지 않게 확인하고 셰이크.</p></li>
<li><strong>칠링 얼음 비우기 → 거르며 따르기</strong><p>칵테일 잔의 칠링 얼음과 녹은 물을 버린다. 스트레이너를 잘 잡고 셰이커의 얼음을 걸러 잔에 따른다.</p><p class="note-aside">스트레이너를 잡은 채 가볍게 움직이며 따라내기. 얼음은 셰이커에 남기고 칵테일만!</p></li>
<li><strong>레몬 트위스트 얹기</strong><p>미리 준비한 레몬 껍질 트위스트로 마무리한다.</p><p class="note-aside">과육 X, 껍질만. 힘줘 잡아당기지 말고 모양을 잡아 가볍게 넣기.</p></li>
</ol>
<p class="mn-order-reminder">얼음 준비 → 버번 → 라임 주스 → 설탕 → 그레나딘 → 셰이킹 → 칠링 얼음 비우기 → 거르기 → 레몬 트위스트</p>
</section>
<div class="note-topic-grid">
<section class="note-topic"><h5>라임 주스와 라임 시럽 구분</h5><p>뉴욕의 표준 레시피는 <b>라임 주스</b>를 사용한다. 라임 시럽은 단맛을 더하는 별도 제품이므로 같은 재료로 바꿔 외우지 않는다.</p><p class="note-aside">“라임 시럽은 달아서 바에서는 안 쓰나?” → 라임 시럽도 칵테일용으로 쓰이는 제품이 있다. 사용하는지는 레시피와 업장 스타일에 따라 다름.</p></section>
<section class="note-topic"><h5>‘1/2’ 암기는 이 메뉴에 연결</h5><p><b>뉴욕: 라임 주스 1/2 oz / 그레나딘 1/2 tsp.</b></p><p class="note-aside">“시니까 대체로 1/2”라는 수업 암기 메모. 전체 시험의 99%로 외우지는 않기 — 다이키리·바카디 칵테일의 라임 주스는 3/4 oz처럼 예외가 있다.</p></section>
</div>
<section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">뉴욕</p><p class="note-aside">레몬 칼질 위험하면 집게로 집고 하기. 과육이 나오면 안되니 레몬 껍질만 필요. 끝과끝은 교차해서 잡구 형태만 만들것. 잡고, 다시 한번더 꽈서 눌러주면 트위스트 레몬이 됨. 힘줘서 당기지 X</p><p class="note-aside">칵테일v글라스에 얼음 &gt; 쉐이킹(은색) 바디에 얼음 넣기 &gt; 기주는 시티칵테일이니 버번 위스키. 켄터키 젠틀맨 &gt; 라임주스 시니까 1/2 라벨쇼잉 안해도 됨 부재료라 &gt; 설탕 1티스푼이니까 깎고 넣어주기. 묻으면 스푼 헹구기 &gt; 그레나디 시럽 = 석류시럽(색 나게 함) 1/2 온스 말고 티스푼으로 넣기. 실수 자주 함. 바스푼에 절반양만 따르고 부어주란 얘기. 안정적으로 따르려면 쉐이커 입구에 스푼과 병과을 대거나 지거에 따라서 따르기. 넣어서 헹구기. &gt; 잔 닫아서 쉐이킹 &gt; 뚜껑은 내 가슴을 바라보게 쉐이킹. 칠링한 얼음 칵테일잔에 비우고. 스트레이너 잡고 흔들며 따르기. 가니쉬 얹기.</p><p class="note-aside">뉴욕도 시티칵테일. 한줄평: 생각보다 맛있지는 않았음... 원래 레몬을 잔에 바르거나 돌아가며 트위스트 해줌. 걍 잔에 던져서 넣어버려도 ㄱㅊ</p><p class="note-aside">기주는 버번 위스키 부재료는 라임주스인데, 라임시럽이 당도가 너무 높아서 바에선 안쓰나봐?. 대체로 시험에선 많이 들어가면 시니까 99% 1/2 용량이라 외우면 됨.</p><p class="note-aside">기법은 쉐이킹</p></div></section></div></details>

</section>

<template id="whiskey-sour-note-template">
<section aria-label="위스키 사워 수업 노트" class="recipe-notes whiskey-sour-notes">
<p class="note-cue">Shake → Build · 소다 1 oz는 마지막 · 넣고 젓지 않기</p>
<p class="note-taste"><span>한 줄 평</span> 신 양주맛</p>
<details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body">
<header class="note-heading"><h4>위스키 사워 필기</h4></header>
<div class="note-basics"><p><b>먼저 Shake: 버번 + 레몬 주스 + 설탕 / 마지막 Build: 소다 워터 1 oz</b></p><p class="note-aside">탄산수는 셰이킹 X! On Top이므로 마지막에 계량해 얹고, 이 수업 순서에서는 젓지 않는다.</p></div>
<div class="note-topic-grid">
<section class="note-topic"><h5>먼저, 레몬으로 체리 감싸기</h5><ol class="note-cutting"><li>레몬 슬라이스를 <b>얇게</b> 썬다. 체리를 감쌀 수 있는 두께로 준비한다.</li><li>가니시 픽으로 <b>레몬 한쪽 → 체리</b> 순서로 찌른다.</li><li>내려놓고 집게로 레몬의 남은 쪽을 잡아 체리 둘레로 말아 준다. 남은 끝을 같은 픽에 꽂아 고정한다.</li></ol><p class="note-aside">너무 두꺼우면 안 말림! ‘레몬 먼저 → 체리 → 내려놓기 → 집게로 레몬 감싸서 마저 꽂기’. 레몬이 체리를 감싸는 형태.</p></section>
<section class="note-topic"><h5>이 메뉴만 쓰는 두 가지</h5><p>기존 40종 표에서 <b>사워 잔(Sour Glass)</b>과 <b>레몬 슬라이스 + 체리</b> 조합은 위스키 사워에만 나온다.</p><p class="note-aside">사워 글라스 + 레몬으로 감싼 체리, 두 가지를 묶어서 기억! 샴페인 잔과 헷갈리지 말기.</p><p class="note-caption">잔 이름 비교: 위스키 사워는 사워 잔 · 그래스호퍼는 소서형 샴페인 잔 · 고창은 플루트 샴페인 잔.</p></section>
</div>
<section aria-labelledby="ws-flow-title" class="mn-flow mn-practice"><h5 id="ws-flow-title">실습 순서 · 탄산수 전까지 셰이킹</h5>
<ol>
<li><strong>사워 잔·셰이커에 얼음</strong><p>사워 잔에 칠링용 얼음을 넣어 옆에 둔다. 은색 셰이커 바디에는 혼합용 얼음을 넣는다.</p><p class="note-aside">잔부터 차갑게! 칠링의 공통 준비는 위 메모 참고. 이 메뉴는 설탕을 섞는 Shake부터 시작.</p></li>
<li><strong>버번 위스키 1 1/2 oz</strong><p>기주인 버번 위스키를 지거로 계량해 셰이커에 넣는다.</p><p class="note-aside">위스키 사워 → 기주는 위스키. 시험 레시피는 버번! 수업에서 본 병은 켄터키 젠틀맨(Kentucky Gentleman).</p></li>
<li><strong>레몬 주스 1/2 oz</strong><p>레몬 주스를 계량해 넣는다.</p><p class="note-aside">사워 → 레몬 → 시니까 이 메뉴는 1/2 oz로 기억. 뉴욕의 라임 주스와 구분!</p></li>
<li><strong>가루 설탕 1 tsp</strong><p>설탕 한 티스푼을 계량해 셰이커에 넣는다.</p><p class="note-aside">여기까지 버번 + 레몬 주스 + 설탕. 소다 워터는 아직 넣지 않기.</p></li>
<li><strong>닫고 셰이킹</strong><p>뚜껑과 바디를 단단히 잡고 흔들어 섞고 차갑게 만든다.</p><p class="note-aside">설탕을 섞으며 셰이크. 탄산수는 셰이커에 넣지 않고, 잔에 따른 뒤 따로!</p></li>
<li><strong>칠링 얼음 비우기 → 거르며 따르기</strong><p>사워 잔의 칠링 얼음과 녹은 물을 버린다. 셰이커의 얼음을 걸러 따르며, <b>소다 1 oz를 넣을 공간</b>을 남긴다.</p><p class="note-aside">수업 메모: ‘반 정도 차면 한 번 끊기’. 오래 지체하면 물이 많아지니 잔을 보며 따르기. ‘반’은 공간을 확인하는 감각 메모이며, 재료 계량을 절반으로 줄이라는 뜻은 아님.</p></li>
<li><strong>소다 워터 1 oz를 On Top → 젓지 않기</strong><p>탄산수를 <b>지거로 1 oz 계량</b>해 마지막에 잔 위로 가볍게 붓는다. 이 실습에서는 추가로 젓지 않는다.</p><p class="note-aside">그냥 가득 붓는 Fill이 아님! On Top with Soda Water 1 oz. ‘Build니까 마지막에 젓기’로 자동 연결하지 말고, 이번에는 얹고 끝.</p></li>
<li><strong>가니시를 잔 입구에 얹기</strong><p>미리 준비한 레몬 슬라이스 + 체리를 잔 입구에 올려 마무리한다.</p><p class="note-aside">얇은 레몬이 체리를 감싼 모양. 사워 잔과 이 장식을 한 세트로 기억.</p></li>
</ol>
<p class="mn-order-reminder">가니시 준비 → 얼음 → 버번 → 레몬 주스 → 설탕 → 셰이킹 → 칠링 얼음 비우기 → 거르기 → 소다 1 oz On Top · 젓지 않기 → 가니시</p>
</section>
<div class="note-topic-grid">
<section class="note-topic"><h5>사워 · 식전주 연결 메모</h5><p class="note-aside">사워 = 식전주.</p><p>이 메뉴의 암기 조합은 <b>버번 + 레몬의 신맛 + 설탕</b>. 마지막에 정량의 소다를 더한다.</p></section>
<section class="note-topic"><h5>머랭·흰자·탄산수 이야기</h5><p class="note-aside">‘레몬 주스 + 설탕 + 계란 흰자 → 머랭 재료를 떠올리기 → 시험에서는 흰자 대신 탄산수’라는 수업 연결 메모.</p><p>이번 시험 레시피는 <b>흰자 없이 소다 워터 1 oz</b>. IBA의 일반 위스키 사워에서는 흰자가 선택 재료이고 거품을 만드는 데 쓰인다. 흰자와 탄산수를 같은 역할의 대체재로 외우지는 않는다.</p></section>
<section class="note-topic"><h5>소다와 피즈를 연결할 때</h5><p class="note-aside">‘소다 워터가 들어가면 피즈’라는 수업 설명은 피즈 계열을 떠올리는 단서. 소다가 들어간 모든 칵테일의 이름이 피즈가 되는 것은 아님.</p><p>이번 제출 메뉴는 <b>위스키 사워</b>. 진 피즈도 소다를 제외하고 셰이킹한 뒤 소다를 더하지만, 재료·잔·정량은 각 메뉴대로 기억한다.</p></section>
<section class="note-topic"><h5>시험 기법 메모</h5><p class="note-aside">시험에 기법은 1개씩만 나옴.</p><p>위스키 사워 자체의 표기부터 정확히: <b>Shake / Build</b>. 앞의 세 재료를 셰이크하고, 마지막 소다를 잔에 더한다.</p></section>
</div>
<section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">레몬 슬라이스가 너무 두꺼우면 안말리니까 얇게 썰기. 체리를 감싸고 있는 형태가 되려면 레몬 먼저 찌르기 &gt; 체리 찌르기 &gt; 내려놓고 집게 이용해서 레몬으로 찔러서 말기.</p><p class="note-aside">잔에 얼음 넣기</p><p class="note-aside">기법은 설탕 있으니 쉐이킹 먼저 하겠지. 쉐이킹 은색 잔에 얼음 넣기.</p><p class="note-aside">위스키 사워니까 당연히 기주는 위스키. 버번위스키 켄터키 젠틀맨</p><p class="note-aside">사워니까 레몬주스 시니까 1/2</p><p class="note-aside">설탕 1 티스푼 섞기</p><p class="note-aside">쉐이킹 잔 닫고 섞기</p><p class="note-aside">칠링한 얼음 잔 비우고</p><p class="note-aside">글라스에 따를때, 오래걸리면 물 많이 생기니 양 많으니 따르다 반정도 차면 끊기. 탄산수 부을 자리가 필요하기 때문</p><p class="note-aside">탄산수 그냥 붓지 말고 용량 있으니 1온스 계량 후 따르기</p><p class="note-aside">빌드기법이니 마지막에 저어준다인데, on the top이라 되어있음. 젓지 않기.</p><p class="note-aside">가니쉬 잔 입구에 얹기</p><p class="note-aside">사워: 식전주.</p><p class="note-aside">레몬주스 설탕 계란흰자 - 원래 머랭 재료. &gt; 계란 흰자를 탄산수로 대체</p><p class="note-aside">시험에 기법은 1개씩만 나옴.</p><p class="note-aside">원래 소다워터 들어가면 피즈임.</p><p class="note-aside">탄산수는 쉐이킹X 이전까지 쉐이킹 후 빌드함</p><p class="note-aside">사워글래스를 시험에서 얘만 씀. 샴페인잔과 헷갈리지 말기.</p><p class="note-aside">가니쉬도 얘만 씀. 이때만 쓰는게 두개이니 기억해둘 것</p><p class="note-aside">한줄평: 신 양주맛</p></div></section></div></details>

</section>
</template>
<template id="boulevardier-note-template">
<section aria-label="불바디에 수업 노트" class="recipe-notes boulevardier-notes">
<p class="note-cue">1 : 1 : 1 · 각 1 oz · Stir 후 얼음과 함께 제공</p>
<p class="note-taste"><span>한 줄 평</span> 씀. 쓴 빵맛...</p>
<details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body">
<header class="note-heading"><h4>불바디에 필기</h4></header>
<div class="note-basics"><p><b>버번 위스키 1 oz + 스위트 베르무트 1 oz + 캄파리 1 oz = 1 : 1 : 1</b></p><p class="note-aside">얘만 버번 1 oz! 기존 40종 표에서 버번을 쓰는 나머지 네 메뉴는 모두 1 1/2 oz. 세 재료 똑같이 한 온스씩.</p></div>
<div class="note-topic-grid">
<section class="note-topic"><h5>먼저, 오렌지 껍질 트위스트</h5><ol class="note-cutting"><li>오렌지의 <b>껍질</b>을 떠서 준비한다.</li><li>껍질을 돌돌 말아 트위스트 모양을 만든다.</li><li>완성 잔 입구에 얹을 수 있게 준비해 둔다.</li></ol><p class="note-aside">오렌지 과육 슬라이스가 아니라 껍질! 기존 40종 표에서 ‘오렌지 껍질 트위스트’는 이 메뉴에 한 번만 나온다.</p></section>
<section class="note-topic"><h5>Stir인데, 완성 잔에 얼음!</h5><p>믹싱 글라스에서 젓고 걸러, <b>얼음이 있는 올드 패션드 잔</b>에 담는다.</p><p class="note-aside">‘Stir인데 유일하게 얼음이 있다’는 완성 잔의 제공 얼음을 기억하는 메모. 젓는 데 쓰는 믹싱 얼음과 구분!</p><p class="note-caption">기존 40종 표에서 Stir + 올드 패션드 잔 조합은 불바디에뿐입니다.</p></section>
</div>
<section aria-labelledby="bv-flow-title" class="mn-flow mn-practice"><h5 id="bv-flow-title">실습 순서 · 각 1 oz 넣고 스터링</h5>
<ol>
<li><strong>올드 패션드 잔에 얼음</strong><p>제공할 잔을 골라 얼음을 채워 옆에 둔다. 완성 칵테일도 얼음과 함께 제공한다.</p><p class="note-aside">수업 메모: 얼음과 같이 서비스하니 별도 사전 칠링을 생략해도 됨. 시험 때는 헷갈리지 않게 일단 얼음을 채워 두기.</p></li>
<li><strong>믹싱 글라스·스트레이너 준비</strong><p>Stir에 쓸 믹싱 글라스와 스트레이너를 준비하고, 믹싱 글라스에 얼음을 채운다.</p><p class="note-aside">제공할 잔과 섞는 잔은 따로! 믹싱 글라스를 미리 칠링했다면 계량 전에 스트레이너로 얼음을 잡고 녹은 물만 비운다.</p></li>
<li><strong>버번 위스키 1 oz</strong><p>기주인 버번을 지거로 계량해 믹싱 글라스에 넣는다.</p><p class="note-aside">맨해튼·올드 패션드·뉴욕·위스키 사워는 버번 1 1/2 oz. 불바디에만 1 oz로 구분!</p></li>
<li><strong>스위트 베르무트 1 oz</strong><p>스위트 베르무트를 계량해 넣는다.</p><p class="note-aside">마티니 빨간 뚜껑 = Rosso = 스위트 베르무트.</p></li>
<li><strong>캄파리 1 oz</strong><p>캄파리를 계량해 넣는다. 세 재료가 모두 같은 양이다.</p><p class="note-aside">캄파리 = 이탈리아의 빨간 비터 리큐르. 허브 향과 쓴맛으로 기억. 부재료인 베르무트·캄파리의 넣는 순서는 바뀌어도 된다는 수업 메모 — 각각 1 oz는 꼭!</p></li>
<li><strong>바스푼으로 스터링</strong><p>믹싱 글라스 안의 재료를 바스푼으로 저어 섞고 차갑게 만든다.</p><p class="note-aside">수저로 젓기 = Stir. 제공 잔에서 바로 만드는 Build와 구분하기.</p></li>
<li><strong>스트레이너로 거르기 → 코스터</strong><p>제공 잔의 녹은 물을 비우고 제공할 얼음을 준비한다. 믹싱 글라스에 스트레이너를 잘 잡고 칵테일을 걸러 따른 뒤, 잔을 코스터로 옮긴다.</p><p class="note-aside">믹싱 글라스의 얼음은 거르고, 완성 잔에는 서비스용 얼음이 남음. 따르기 → 코스터!</p></li>
<li><strong>오렌지 껍질을 잔 입구에 얹기</strong><p>미리 돌돌 말아 둔 오렌지 껍질 트위스트를 잔 입구에 얹는다.</p><p class="note-aside">마지막은 오렌지 껍질. 레몬 트위스트나 오렌지 슬라이스와 헷갈리지 않기.</p></li>
</ol>
<p class="mn-order-reminder">오렌지 껍질 준비 → 잔·믹싱 글라스에 얼음 → 버번 1 → 스위트 베르무트 1 → 캄파리 1 → Stir → 얼음 있는 잔에 거르기 → 코스터 → 오렌지 트위스트</p>
</section>
<div class="note-topic-grid">
<section class="note-topic"><h5>불바디에, 이름 기억하기</h5><p class="note-aside">불바디에 = 건달, 대로에 있는 사람.</p><p>불바디에 = 건달, 대로에 있는 사람.</p></section>
<section class="note-topic"><h5>세 병을 한 줄로</h5><p><b>기주:</b> 버번 위스키<br/><b>부재료:</b> 스위트 베르무트 + 캄파리<br/><b>용량:</b> 셋 다 1 oz</p><p class="note-aside">마티니 Rosso = 스위트 베르무트. 캄파리 = 이탈리아, 빨강, 허브, 쓴맛. 색과 병 이름까지 묶어 떠올리기.</p></section>
</div>
<section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">불바디에: 건달, 대로에 있는 사람</p><p class="note-aside">오렌지 껍질 떠서 돌돌 말아 트위스트</p><p class="note-aside">stir인데 유일하게 얼음이 있다. 1:1:1로 레시피 기억하기</p><p class="note-aside">잔 칠링 &gt; 얼음 같이 서비스되니 칠링 안해도 되지만 채워놓기만 해도 됨</p><p class="note-aside">stir니까 믹싱글라스와 스트레이너 준비 &gt; 믹싱글라스에 얼음 채우기 &gt; 버번 위스키 얘만 빼고 버번 다 1 1/2임, 얘만 버번 1온스. 스위트 베르무트니까 빨간뚜껑 마티니. 부재료니까 순서 상관 없음. 캄파리 이탈리아 허브 리큐르. 빨간색.</p><p class="note-aside">수저로 젓기</p><p class="note-aside">가니쉬 얘만 1번씀</p><p class="note-aside">한줄평: 씀. 쓴 빵맛...</p><p class="note-aside">스트레이스 잡고 글라스에 붓기 &gt; 코스터</p><p class="note-aside">입구에 오렌지 껍질 얹기</p></div></section></div></details>

</section>
</template>
<template id="rusty-nail-note-template">
<section aria-label="러스티 네일 수업 노트" class="recipe-notes rusty-nail-notes">
<p class="note-cue">스카치 1 oz + 드람뷔 1/2 oz · Build · 가니시 없음</p>
<p class="note-taste"><span>한 줄 평</span> 꿀맛 안나는데? 쩝... 아쉽</p>
<details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body">
<header class="note-heading"><h4>러스티 네일 필기</h4></header>
<div class="note-basics"><p><b>Scotch Whisky 1 oz + Drambuie 1/2 oz</b> · 올드 패션드 잔 · Build</p><p class="note-aside">쉽다! 두 재료만. 기존 40종 시험 표에서 스카치 위스키를 기주로 쓰는 메뉴는 러스티 네일뿐.</p></div>
<section aria-labelledby="rn-flow-title" class="mn-flow mn-practice"><h5 id="rn-flow-title">실습 순서 · 잔에 바로 넣고 젓기</h5><ol>
<li><strong>얼음이 든 올드 패션드 잔 준비</strong><p>제공할 잔과 얼음을 준비한다. 믹싱 글라스에서 따로 섞지 않고 이 잔에서 만든다.</p><p class="note-aside">Build니까 잔에 직접! 가니시도 없음.</p></li>
<li><strong>스카치 위스키 1 oz</strong><p>기주를 계량해 잔에 넣는다.</p><p class="note-aside">수업에서 본 병은 Sir Edward’s(서 에드워즈). 다른 위스키 메뉴의 버번과 헷갈리지 말기.</p></li>
<li><strong>드람뷔 1/2 oz</strong><p>드람뷔 리큐르를 계량해 넣는다. 사용 후 병 입구에 묻은 액을 깨끗이 닦는다.</p><p class="note-aside">수업에서 ‘드람부이’라고 부른 그 병! 코르크는 돌리면서 위로 당겨 열기. 꿀이 들어가 끈적이니 한 번 닦아 정리.</p></li>
<li><strong>바스푼으로 젓기 → 코스터</strong><p>잔 안의 재료를 가볍게 저어 섞는다. 가니시 없이 코스터에 올려 마무리한다.</p><p class="note-aside">Sir Edward’s → 드람뷔 → 닦기 → Build니까 수저로 젓기.</p></li>
</ol><p class="mn-order-reminder">얼음 든 잔 → 스카치 1 oz → 드람뷔 1/2 oz → 가볍게 젓기 → 가니시 없이 코스터</p></section>
<div class="note-topic-grid">
<section class="note-topic"><h5>앤틱한 느낌으로 기억</h5><p class="note-aside">녹슨 못이 아니라 고풍스러운, 앤틱한. 쉽다.</p></section>
<section class="note-topic"><h5>드람뷔는 꿀이 들어간 리큐르</h5><p>스카치 위스키에 헤더 꿀, 허브와 향신료를 더한 리큐르다.</p><p class="note-aside">꿀 자체를 따로 넣는 레시피는 아님. 꿀맛이 기대보다 덜 느껴졌다는 개인 메모 — 재료 설명과 내 입맛은 따로 기억!</p></section>
</div>
<section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">러스티네일</p><p class="note-aside">녹슨 못이 아니라 고풍스러운, 앤틱한. 쉽다.</p><p class="note-aside">한줄평: 꿀맛 안나는데? 쩝... 아쉽</p><p class="note-aside">칵테일 중 유일하게 기주가 scotch whisky.</p><p class="note-aside">리큐르는 드람부이. 코르크는 돌려서 위로 따기.</p><p class="note-aside">sir edward &gt; 드람부이 꿀이라 한번 닦기 &gt; 빌드니까 수저로 젓기</p></div></section></div></details>

</section>

<template id="sidecar-note-template">
<section aria-label="사이드카 수업 노트" class="recipe-notes sidecar-notes">
<p class="note-cue">브랜디 1 oz · 트리플 섹 1 oz · 레몬은 1/4 oz · 소프트 셰이킹</p>
<details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body">
<header class="note-heading"><h4>사이드카 필기</h4></header>
<div class="note-basics"><p><b>브랜디 1 oz + 트리플 섹 1 oz + 레몬 주스 1/4 oz</b> · Shake · 칵테일 잔 · 가니시 없음</p><p class="note-aside">레몬 주스인데 왜 1/2가 아니지? 사이드카는 1/4 oz! ‘거의 다 반’보다 이 메뉴의 예외를 정확히.</p></div>
<section aria-labelledby="sc-flow-title" class="mn-flow mn-practice"><h5 id="sc-flow-title">실습 순서 · 가볍게 물결을 만들며</h5><ol>
<li><strong>칵테일 잔·셰이커에 얼음</strong><p>칵테일 잔에 칠링용 얼음을 넣어 두고, 셰이커 바디에는 혼합용 얼음을 넣는다.</p><p class="note-aside">제공 잔과 섞는 잔, 두 군데 얼음부터.</p></li>
<li><strong>브랜디 1 oz</strong><p>기주 브랜디를 계량해 셰이커에 넣는다.</p><p class="note-aside">나폴레옹 = 브랜디.</p></li>
<li><strong>트리플 섹 1 oz</strong><p>트리플 섹을 계량해 넣는다.</p><p class="note-aside">디카이퍼 트리플 섹 = 바 필수 리큐르. 오렌지 리큐르.</p></li>
<li><strong>레몬 주스 1/4 oz</strong><p>레몬 주스를 1/4 oz 계량해 넣는다.</p><p class="note-aside">1/2 oz로 자동 계량하지 않기. 사이드카의 레몬은 1/4!</p></li>
<li><strong>닫고 소프트 셰이킹</strong><p>셰이커를 단단히 잡고 물결을 만들듯 부드럽게 흔들어 섞고 차갑게 한다.</p><p class="note-aside">가루 설탕이 없어 수업에서는 칠링을 중심으로 소프트 셰이킹. 셰이킹은 혼합과 희석도 함께 일어나는 동작.</p></li>
<li><strong>칠링 얼음 비우기 → 거르며 따르기</strong><p>칵테일 잔의 얼음과 물을 비우고, 스트레이너를 잘 잡아 혼합용 얼음을 걸러 따른다.</p><p class="note-aside">잔 비우기 → 스트레이너 잡기 → 따르기.</p></li>
<li><strong>가니시 없이 코스터</strong><p>장식 없이 완성 잔을 코스터에 올려 마무리한다.</p><p class="note-aside">식전주.</p></li>
</ol><p class="mn-order-reminder">얼음 준비 → 브랜디 1 → 트리플 섹 1 → 레몬 1/4 → 소프트 셰이킹 → 잔 비우기 → 거르기 → 코스터</p></section>
<div class="note-topic-grid">
<section class="note-topic"><h5>Triple Sec · 브랜디 연결</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“트리플섹 = 바 필수 리큐르<br/>sec = dry.”</p><p>오늘 외우는 브랜디 계열 3종은 모두 칵테일 잔 + Shake. 모든 브랜디 칵테일의 규칙은 아니며 40종에는 Float인 푸스 카페도 있다.</p></section>
<section class="note-topic"><h5>레몬과 업장 메모</h5><p class="note-aside">노란색이라 레몬 주스!</p><p class="note-aside">업장 취향 메모: 브랜디 자리에 코냑 + 생레몬즙을 쓰면 맛있다고 배움. 코냑도 브랜디의 한 종류. 시험에서는 지급 재료와 위 표의 용량으로 연습.</p></section>
</div>
<section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">사이드카</p><p class="note-aside">칵테일 잔에 얼음넣기 &gt; 쉐이킹에 얼음 넣기.</p><p class="note-aside">나폴레옹 브랜디 &gt; 디카이퍼 트리플 섹 &gt; 레몬 주스 &gt; 쉐이킹 잔 닫고 쉐이킹(물결 이루며 흔들기)</p><p class="note-aside">칵테일 잔 얼음 버리기 &gt; 스트레이너 잡구 따르기</p><p class="note-aside">식전주</p><p class="note-aside">가루X인데 단순 칠링 목적으로 소프트 쉐이킹</p><p class="note-aside">트리플섹 = 바 필수 리큐르</p><p class="note-aside">레몬 주스: 신데 왜 1/2이 아니지? 거의 다 1/2이고 사이드카가 걍 1/4</p><p class="note-aside">sec = dry.</p><p class="note-aside">브랜디는 무조건 칵테일 글라스 + 쉐이킹. 노란색이라 무조건 레몬주스. 브랜디 대신 꼬낙+생레몬즙 넣어도 맛있음</p></div></section></div></details>

<template id="memory-common-guide-template">
<details class="memory-study-guide"><summary>공통 암기표 · 잔·용량·라임/레몬 · 하이볼 만드는 순서</summary><div class="memory-study-guide-body">
<p>빠르게 떠올리는 암기법입니다. 실제 재료·용량은 각 메뉴의 표를 먼저 확인하세요.</p>
<table><thead><tr><th>수업에서 묶어 외우기</th><th>함께 기억할 예외·범위</th></tr></thead><tbody>
<tr><td>위스키는 레몬/라임</td><td>뉴욕은 라임, 위스키 사워는 레몬. 맨해튼·러스티 네일에는 둘 다 주스로 넣지 않음.</td></tr>
<tr><td>브랜디는 레몬</td><td>사이드카·허니문에 적용. 브랜디 알렉산더는 카카오·밀크이며 레몬 없음.</td></tr>
<tr><td>보드카·럼·데킬라→라임 연상</td><td>모스코 뮬·코스모·애플 마티니·마이 타이·쿠바·다이키리·바카디·마가리타에 연결. 블랙 러시안·시브리즈·피나 콜라다·블루 하와이안·테킬라 선라이즈에는 라임 없음.</td></tr>
<tr><td>투명한 술→라임 / 노란 술→레몬 (진 제외)</td><td>색으로 떠올리는 보조 암기법. 재료를 선택하거나 대체하는 규칙으로 사용하지 않음.</td></tr>
<tr><td>롱 드링크 기주 1 1/2 oz</td><td>이번 모스코 뮬·시브리즈·쿠바 리브레에 적용. 필스너 Blend 럼 메뉴들은 1 또는 1 1/4 oz로 다름.</td></tr>
<tr><td>보드카 숏은 1 oz</td><td>코스모·애플 마티니는 칵테일 잔, 블랙 러시안은 올드 패션드 잔. 잔은 메뉴별 확인.</td></tr>
<tr><td>파인애플 주스↔파인애플 가니시</td><td>이번 버진 펀치·피나 콜라다·블루 하와이안·마이 타이에 연결. 퀴즈에서는 마이 타이도 생파인애플 웨지 + 체리로 고른다. 표의 오렌지 대안은 해설에만 표시.</td></tr>
</tbody></table>
<h3>집에서 하이볼, 무엇부터 넣을까?</h3>
<p class="note-original note-transcript"><b>필기 원문</b><br/>“기주넣고 얼음넣고 탄산 과 기주넣고 탄산 넣고 얼음 중 뭐가 더 낫지? 집에서 하이볼 말면 둘 방법 중에 하나로 해서 맛이 없는 거라는데 설명을 놓침...”</p>
<p><b>차가운 잔 → 넉넉한 얼음 → 기주 → 먼저 차갑게 섞기 → 차가운 탄산 → 최소한으로 섞기</b>가 익히기 좋은 흐름입니다. 기주를 먼저 넣었다면 얼음을 준비한 다음 탄산을 넣으세요. 탄산을 붓고 큰 얼음을 나중에 떨어뜨리면 거품·넘침과 탄산 손실을 조절하기 어렵습니다.</p>
<p class="note-aside">탄산은 마지막! 차가운 잔·재료, 충분한 얼음. Fill은 채우기, 약 80%로 여유 공간 두기.</p>
<div class="note-topic-grid"><section class="note-topic"><h3>도구와 병</h3><p>지거는 손목을 비틀지 않고 수평을 유지하며 잔 가까이에서 계량합니다. 무거운 주스 병은 안정적으로 받칩니다.</p><p class="note-aside">지거링할 때 손 가로로! 병 뚜껑을 미리 전부 열어 두는 것은 권장하지 않음. 큰 지거가 반드시 1 1/2 oz인 것은 아니므로 표시 확인. 짐빔=버번, ‘나폴레옹’은 수업에서 본 브랜디 병.</p></section><section class="note-topic"><h3>칠링·블렌딩·탄산</h3><p>시험 시간 기준 Blend 순서: <b>필스너 잔에 얼음을 계량해 한 번 칠링 → 그 얼음을 바로 블렌더 통으로 옮기기 → 통에 술과 재료를 계량해 넣기 → 뚜껑을 닫고 블렌딩.</b> 블렌딩한 내용물은 그 잔에 다시 담습니다.</p><p class="note-aside">얼음부터 잔에서 계량·칠링하고 바로 블렌더로! 그다음 통에 술·재료를 부으며 작업하기. 탄산은 셰이크·블렌딩하지 않기.</p></section></div>
<h3>데킬라 두 잔 · 기주 용량은 같게</h3><p><b>마가리타 = 선라이즈 = 데킬라 1 1/2 oz.</b> 마가리타는 오렌지 리큐르·라임 1/2 oz씩, 선라이즈는 오렌지 Fill·그레나딘 1/2 oz. 이번 두 메뉴에서는 숏·롱으로 기주 용량을 나누지 않아요. 전체 40종의 롱 아일랜드는 데킬라 1/2 oz라는 예외가 있어요.</p>
<h3>럼 6종 · 숫자를 한 줄로</h3><table><thead><tr><th>메뉴</th><th>기주</th><th>라임 주스</th></tr></thead><tbody>
<tr><td>피나 콜라다</td><td>1 1/4 oz</td><td>없음</td></tr><tr><td>블루 하와이안</td><td>1 oz</td><td>없음</td></tr><tr><td>마이 타이</td><td>1 1/4 oz</td><td>1 oz</td></tr><tr><td>쿠바 리브레</td><td>1 1/2 oz</td><td>1/2 oz</td></tr><tr><td>다이키리</td><td>1 3/4 oz</td><td>3/4 oz</td></tr><tr><td>바카디 칵테일</td><td>지정 바카디 화이트 1 3/4 oz</td><td>3/4 oz</td></tr>
</tbody></table><p class="note-aside">‘블루 1 · 큐바 1/2 · 다이키리 3/4’는 1 뒤에 분수가 붙는 연상. 실제 기주는 1 → 1 1/2 → 1 3/4 oz. 피나·마이는 1 1/4 oz로 한 쌍. 다이키리와 바카디는 설탕/그레나딘을 구분.</p>
<h3>슬라이스·웨지·껍질</h3><p><b>모스코 뮬 = 슬라이스 / 시브리즈 = 웨지 / 쿠바 리브레 = 레몬 웨지 / 코스모폴리탄 = 껍질 트위스트.</b> 라임·레몬 둘 중 하나가 허용되는 메뉴도 실제 표를 확인합니다.</p>
<p class="note-aside">‘콜라면 웨지 + 시브리즈’는 이번 비교 메모. 이름과 모양을 함께 외우기. 칵테일 글라스를 쓰는 메뉴에는 칠링 얼음과 물을 비우고 따른다.</p>
<h3>출제 빈도와 연습 목표</h3><p>레몬 스쿼시 출제 적음 / 버진 펀치 자주 / 보드카 Build 3종은 2분 이내 / 서울은 Blend 또는 Float 꼭 외우기.</p>
</div></details>

<template id="lemon-squash-note-template"><section aria-label="프레시 레몬 스쿼시 수업 노트" class="recipe-notes lemon-squash-notes">
<p class="note-cue">생레몬 반 개 · 설탕 2 tsp · 소다 Fill · Build</p><p class="note-taste"><span>한 줄 평</span> 시-------------------------------큼. 노맛</p>
<details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body">
<header class="note-heading"><h4>프레시 레몬 스쿼시 필기</h4></header>
<div class="note-basics"><p><b>생레몬 착즙 1/2 ea · 가루 설탕 2 tsp · 소다 워터 Fill</b></p><p>Build · 하이볼 잔 · 레몬 슬라이스</p></div>
<section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>레몬과 잔 준비</strong><p>하이볼 잔을 칠링하고, 레몬 슬라이스 가니시를 먼저 준비한다.</p><p class="note-aside">즙을 짤 레몬은 둥근 단면이 나오도록 가로로 반 자르기. 도마에서 안정적으로 잡고 절단면 중앙에 얕은 + 칼집을 내어 짜기.</p></li><li><strong>생레몬 1/2개 착즙</strong><p>생레몬 반 개의 즙을 준비해 잔에 넣는다. 씨는 걸러 낸다.</p><p class="note-aside">1/2 ea = 반 개. 1/2 oz 레몬 주스와 다름!</p></li><li><strong>가루 설탕 2 tsp</strong><p>설탕을 깎아서 두 티스푼 넣고 레몬즙과 섞어 녹인다.</p><p class="note-aside">기존 40종 표에서 가루 설탕 2 tsp는 이 메뉴만.</p></li><li><strong>얼음과 소다 워터</strong><p>서비스용 얼음을 넣고 차가운 소다 워터로 Fill 한다.</p><p class="note-aside">Fill → 약 80%까지, 흘리지 않을 여유 두기.</p></li><li><strong>가볍게 섞고 장식</strong><p>탄산을 과하게 날리지 않도록 부드럽게 섞고 코스터로 옮긴다. 레몬 슬라이스에 칼집을 내어 잔 입구에 꽂는다.</p><p class="note-aside">Build = 제공 잔에서 완성. 과육을 깊이 잘라 쪼개기보다 걸릴 만큼 칼집.</p></li></ol></section>
<div class="note-topic-grid"><section class="note-topic"><h5>스쿼시와 에이드</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“프레쉬 레몬 스쿼시=ade 외국에서 ade는 주스이고, 보통 squash는 탄산 들어간 주스를 의미하나 봅니다.<br/>fill with soda water: fill with란 80%까지 채운다는 뜻입니다.”</p><p>스쿼시 = 탄산 들어간 주스. ade = 주스. Fill은 80%까지.</p></section><section class="note-topic"><h5>출제 메모</h5><p>출제 빈도가 낮다고 들은 수업 메모.</p></section></div>
<section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">논알코올 칵테일: 프레쉬 레몬 스쿼시=ade 외국에서 ade는 주스이고, 보통 squash는 탄산 들어간 주스를 의미하나 봅니다.</p><p class="note-aside">기법은 빌드.</p><p class="note-aside">맛은 시-------------------------------큼. 노맛</p><p class="note-aside">레몬 1/2 설탕 2 티스푼 탄산수, 하이볼잔, 썬 레몬</p><p class="note-aside">레몬은 처음에 가로로(둥근 단면이 나오도록) 자른 뒤 + 열십자를 중간에 내어 짭니다.</p><p class="note-aside">설탕이 2티스푼인건 이 레시피가 유일합니다.</p><p class="note-aside">fill with soda water: fill with란 80%까지 채운다는 뜻입니다.</p><p class="note-aside">빌드라서 다 넣구 젓기</p><p class="note-aside">레몬의 중간에 칼집내어서 세로로 잔 입구에 꽂습니다.</p><p class="note-aside">출제 빈도 낮음</p></div></section></div></details>

</section></template>
<template id="virgin-punch-note-template"><section aria-label="버진 프루트 펀치 수업 노트" class="recipe-notes virgin-punch-notes">
<p class="note-cue">과즙 5종 + 그레나딘 · 1 oz 네 개 / 1/2 oz 두 개 · Blend</p><p class="note-taste"><span>한 줄 평</span> 시큼한 조금 단 시원한 주스. 굳</p>
<details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body">
<header class="note-heading"><h4>버진 프루트 펀치 필기</h4></header>
<div class="note-basics"><p><b>오렌지 주스 1 oz · 파인애플 주스 1 oz · 크랜베리 주스 1 oz · 자몽 주스 1 oz · 레몬 주스 1/2 oz · 그레나딘 시럽 1/2 oz</b></p><p>Blend · 필스너 잔 (받침형) · 생파인애플 웨지 + 체리</p></div>
<section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>잔과 가니시 준비</strong><p>필스너 잔과 블렌더, 파인애플 웨지와 체리를 준비한다.</p><p class="note-aside">주스·시럽은 얼음을 옮겨 놓은 블렌더 통에 계량해 넣기.</p></li><li><strong>얼음 계량·칠링 → 바로 블렌더로</strong><p>필스너 잔에 얼음을 계량해 한 번 칠링하고, 그 얼음을 바로 블렌더 통으로 옮긴다.</p><p class="note-aside">시험 시간 기준. 이어서 얼음이 담긴 블렌더 통에 주스·시럽을 넣기.</p></li><li><strong>네 과즙 각 1 oz</strong><p>오렌지·파인애플·크랜베리·자몽 주스를 각각 1 oz 계량해 얼음이 담긴 블렌더 통에 넣는다.</p><p class="note-aside">과즙끼리는 같은 단계라 계량 순서를 바꿔도 됨.</p></li><li><strong>레몬과 그레나딘 각 1/2 oz</strong><p>레몬 주스 1/2 oz와 그레나딘 시럽 1/2 oz를 넣는다.</p><p class="note-aside">레몬은 신맛, 그레나딘은 색과 단맛. 과즙 5종에 시럽 하나가 더해진 총 6가지 재료.</p></li><li><strong>뚜껑 닫고 블렌딩</strong><p>재료를 모두 넣은 뒤 블렌더 뚜껑을 닫고 간다.</p><p class="note-aside">정확한 얼음 개수나 블렌딩 초수는 이 공식 레시피 표에 별도 지정되어 있지 않음.</p></li><li><strong>따르기와 장식</strong><p>얼음을 블렌더로 옮겨 비워 둔 필스너 잔에 블렌딩한 내용물을 담는다. 코스터로 옮기고 파인애플·체리로 장식한다.</p><p class="note-aside">셰이크처럼 혼합용 얼음을 모두 거르는 메뉴가 아님.</p></li></ol></section>
<div class="note-topic-grid"><section class="note-topic"><h5>다섯 과즙 연상</h5><p>라임·레몬·파인애플·오렌지·크랜베리·자몽 중 라임을 제외한 다섯 과즙.</p><p class="note-aside">‘라임은 레몬과 겹치니 제외’는 이 메뉴 암기법. 라임과 레몬이 같은 재료라서 서로 대체한다는 뜻은 아님.</p></section><section class="note-topic"><h5>Punch의 다섯</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“virgin fruit punch punch는 숫자 아랍어 5. 과일주스 5개를 넣어서 감”</p><p>Punch = 5. 과일 주스 다섯 가지!</p></section><section class="note-topic"><h5>같이 외울 묶음</h5><p>피나 콜라다·블루 하와이안·마이 타이와 Blend + 필스너 잔으로 묶는다.</p><p class="note-aside">출제 자주 됨.</p></section></div>
<section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">virgin fruit punch punch는 숫자 아랍어 5. 과일주스 5개를 넣어서 감</p><p class="note-aside">출제 자주 됨</p><p class="note-aside">시큼한 조금 단 시원한 주스. 굳</p><p class="note-aside">블렌드: 뒤의 럼주들과 묶어서 기억</p><p class="note-aside">레몬주스니까 1/2</p><p class="note-aside">석류시럽은 색을 위해 조금, 레몬과 같이 1/2</p><p class="note-aside">블렌드니까 필스너 잔</p><p class="note-aside">주스 6개가 여태 나왔음. 라임 레몬 파인애플 오렌지 크랜베리 자몽 중 라임은 레몬과 중복이니 라임 빼고 다섯개임.</p></div></section></div></details>

</section></template>
<template id="black-russian-note-template"><section aria-label="블랙 러시안 수업 노트" class="recipe-notes black-russian-notes">
<p class="note-cue">보드카 1 oz + 커피 리큐르 1/2 oz · Build · 장식 없음</p>
<details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body">
<header class="note-heading"><h4>블랙 러시안 필기</h4></header>
<div class="note-basics"><p><b>보드카 1 oz · 커피 리큐르 1/2 oz</b></p><p>Build · 올드 패션드 잔 · 없음</p></div>
<section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>올드 패션드 잔에 얼음</strong><p>차가운 올드 패션드 잔에 서비스용 얼음을 준비한다.</p><p class="note-aside">러스티 네일처럼 두 재료, Build, 같은 잔, 가니시 없음으로 연결.</p></li><li><strong>보드카 1 oz</strong><p>보드카를 계량해 잔에 넣는다.</p><p class="note-aside">러시안 → 러시아 → 보드카로 연상. 모스코 뮬의 1 1/2 oz와 다름.</p></li><li><strong>커피 리큐르 1/2 oz</strong><p>커피 리큐르를 계량해 넣는다.</p><p class="note-aside">Kahlúa = 깔루아/칼루아. 까만 커피 리큐르.</p></li><li><strong>잔에서 젓고 코스터</strong><p>바스푼으로 가볍게 섞어 코스터로 옮긴다. 가니시는 없다.</p><p class="note-aside">러스티 네일은 스카치+드람뷔, 블랙 러시안은 보드카+커피.</p></li></ol></section>
<div class="note-topic-grid"><section class="note-topic"><h5>우유·크림을 넣으면?</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“칼루아에 우유 넣으면 칼루아밀크, 블랙러시안은 화이트러시안은??? 두개는 가성비 떨어지니까 사먹지 말기”</p><p>‘맥심 모카골드 주세요’ 같은 느낌이라 바에서 굳이… 두 메뉴는 가성비가 아쉽다는 개인 메모.</p></section><section class="note-topic"><h5>커피 리큐르 취향</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“칼루아 싫으면 티아마리아, 미스터블랙(미국, 더치커피향) 추천. 해외에서 많이 사용”</p><p>Mr Black은 미국이 아니라 호주에서 시작한 콜드브루 커피 리큐르. 더치커피 향으로 기억. 해외 사용 빈도는 별도 통계 확인 없음.</p></section><section class="note-topic"><h5>이름 이야기</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“kgb 특수부대에 저항하는 러시아의 어두운면을 으ㅢ미. 맥심 모카골드 주세요 같은 느낌의 술이라 바에서 굳이... 가성비 떨어짐”</p><p>KGB에 저항하는 러시아의 어두운 면. 맥심 모카골드 주세요 같은 느낌.</p><p>KGB 특수부대에 저항하는 러시아의 어두운 면. 맥심 모카골드 주세요 같은 느낌의 술.</p></section><section class="note-topic"><h5>속도 연습</h5><p>블랙 러시안·모스코 뮬·시브리즈는 간단한 Build 3종.</p><p class="note-aside">‘이 세 개를 2분 이내’는 수업 연습 목표. 공식 시험은 지정 3작품 7분.</p></section></div>
<section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">블랙러시안: 러스티네일이랑 묶어서 외우기</p><p class="note-aside">러시아니까 기주는 보드카. kahlua는 까만 리큐르 = 커피. 깔루아.빌드</p><p class="note-aside">칼루아에 우유 넣으면 칼루아밀크, 블랙러시안은 화이트러시안은??? 두개는 가성비 떨어지니까 사먹지 말기</p><p class="note-aside">칼루아 싫으면 티아마리아, 미스터블랙(미국, 더치커피향) 추천. 해외에서 많이 사용</p><p class="note-aside">kgb 특수부대에 저항하는 러시아의 어두운면을 으ㅢ미. 맥심 모카골드 주세요 같은 느낌의 술이라 바에서 굳이... 가성비 떨어짐</p></div></section></div></details>

</section></template>
<template id="moscow-mule-note-template"><section aria-label="모스코 뮬 수업 노트" class="recipe-notes moscow-mule-notes">
<p class="note-cue">보드카 1 1/2 · 라임 1/2 oz · 진저 에일 Fill · 슬라이스</p>
<details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body">
<header class="note-heading"><h4>모스코 뮬 필기</h4></header>
<div class="note-basics"><p><b>보드카 1 1/2 oz · 라임 주스 1/2 oz · 진저 에일 Fill</b></p><p>Build · 하이볼 잔 · 라임 또는 레몬 슬라이스</p></div>
<section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>잔과 슬라이스 준비</strong><p>하이볼 잔을 칠링하고 라임 또는 레몬 슬라이스를 준비한다.</p><p class="note-aside">Moscow = 모스크바, mule = 노새. 러시아 수도 → 보드카 연상. 노새는 당나귀와 같은 동물이 아님.</p></li><li><strong>얼음과 보드카</strong><p>차가운 잔에 서비스용 얼음을 준비하고 보드카 1 1/2 oz를 넣는다.</p><p class="note-aside">기주를 먼저 넣었더라도 탄산보다 얼음을 먼저 준비하는 흐름이 좋음.</p></li><li><strong>라임 주스 1/2 oz</strong><p>라임 주스를 계량해 넣는다.</p><p class="note-aside">쿠바 리브레와 산미 용량은 같고, 기주·탄산 재료·가니시 모양이 다름.</p></li><li><strong>진저 에일 Fill</strong><p>차가운 진저 에일을 채우고 과하게 휘젓지 않게 부드럽게 섞는다.</p><p class="note-aside">시험 표는 Ginger ale. 스프라이트나 토닉으로 바꾸지 않기.</p></li><li><strong>슬라이스 장식</strong><p>코스터로 옮기고 라임 또는 레몬 슬라이스를 잔에 건다.</p><p class="note-aside">모스코 뮬은 웨지 X. 시험장에 레몬이 나올 거라는 예상은 수업 메모이며 실제 지급 재료 확인.</p></li></ol></section>
<div class="note-topic-grid"><section class="note-topic"><h5>업장에서는 구리 머그</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“클래식바에서는구리잔에나감<br/>토닉 또는 분다버그(진저비어), 피버트리가 향이 더 강함”</p><p>하이볼 잔 + 진저 에일. 분다버그 진저비어, 피버트리는 향이 더 강함.</p></section><section class="note-topic"><h5>스프라이트로 대체?</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“라임주스에 진저에일이면 걍 스프라이트 쓰면 해결됨”</p><p>집에서 하는 변형으로는 시도할 수 있어도 이 레시피의 정답으로 대체하지 않기.</p></section><section class="note-topic"><h5>캐나다 드라이</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“진저에일 canada dry: 생각향이 높은, 캐나다 산. 캐나다드라이라고 한글로 써있으면 생각향이 낮고 국내 양산에서 만드나봄”</p><p>Canada Dry: 영문 라벨은 생강 향이 강함. 한글 캐나다드라이: 생강 향이 낮고 국내 양산에서 만드나 봄.</p></section></div>
<section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">moscow mule. 모스크바 노새(당나귀0모스크바니까러시아수도니까기주는보드카</p><p class="note-aside">클래식바에서는구리잔에나감</p><p class="note-aside">라임주스에 진저에일이면 걍 스프라이트 쓰면 해결됨</p><p class="note-aside">위스키는 레몬/라인, 브랜디는 레몬, 보드카는 라임,(전체에 쓸것)</p><p class="note-aside">토닉 또는 분다버그(진저비어), 피버트리가 향이 더 강함</p><p class="note-aside">롱 드링크는 기주는 무조건 1과 1/2(전체에 쓸것)</p><p class="note-aside">생 라임이 비싸서 시험장에는 없어 레몬이 나올 것.(가니쉬) 업장에는 이ㅆ음.</p><p class="note-aside">기주넣고 얼음넣고 탄산 과 기주넣고 탄산 넣고 얼음 중 뭐가 더 낫지? 집에서 하이볼 말면 둘 방법 중에 하나로 해서 맛이 없는 거라는데 설명을 놓침...</p><p class="note-aside">술이 투명하면 라임, 술이 노란색이면 레몬. (진 빼고)(전체에 쓸것)</p><p class="note-aside">진저에일 canada dry: 생각향이 높은, 캐나다 산. 캐나다드라이라고 한글로 써있으면 생각향이 낮고 국내 양산에서 만드나봄</p></div></section></div></details>

</section></template>
<template id="seabreeze-note-template"><section aria-label="시브리즈 수업 노트" class="recipe-notes seabreeze-notes">
<p class="note-cue">보드카 1 1/2 · 크랜베리 3 · 자몽 1/2 oz · 웨지</p><p class="note-taste"><span>한 줄 평</span> 시큼하고 씀</p>
<details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body">
<header class="note-heading"><h4>시브리즈 필기</h4></header>
<div class="note-basics"><p><b>보드카 1 1/2 oz · 크랜베리 주스 3 oz · 자몽 주스 1/2 oz</b></p><p>Build · 하이볼 잔 · 라임 또는 레몬 웨지</p></div>
<section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>하이볼 잔과 웨지</strong><p>하이볼 잔을 칠링하고 라임 또는 레몬 웨지를 준비한다. 서비스용 얼음을 넣는다.</p><p class="note-aside">Sea breeze = 해풍, 바닷바람. 빨간 보드카 칵테일 → 크랜베리로 연결.</p></li><li><strong>보드카 1 1/2 oz</strong><p>보드카를 계량해 넣는다.</p><p class="note-aside">수업 지거의 큰 쪽이 1 1/2 oz라면 한 번에 계량. 모든 지거가 같은 용량은 아니므로 표시 확인.</p></li><li><strong>크랜베리 3 oz</strong><p>크랜베리 주스를 계량해 넣는다.</p><p class="note-aside">Ocean Spray·Langers 주스 병이 무거웠다는 메모. 안정적으로 받치고 잔 가까이에서, 지거를 사용해 흘리지 않기.</p></li><li><strong>자몽 1/2 oz</strong><p>자몽 주스를 계량해 넣는다.</p><p class="note-aside">레몬·라임이 아니라 자몽 반 온스!</p></li><li><strong>가볍게 젓고 웨지</strong><p>잔에서 고르게 섞고 코스터로 옮긴 뒤 웨지를 올린다.</p><p class="note-aside">모스코 뮬의 슬라이스와 비교. 콜라가 없어도 시브리즈는 웨지.</p></li></ol></section>
<div class="note-topic-grid"><section class="note-topic"><h5>같이 비교하기</h5><p>모스코 뮬·시브리즈는 보드카 1 1/2 oz와 하이볼 잔을 공유한다.</p><p class="note-aside">보드카라고 항상 하이볼 잔은 아님. 코스모폴리탄·애플 마티니는 칵테일 잔, 블랙 러시안은 올드 패션드 잔.</p></section><section class="note-topic"><h5>주스 병과 시간</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“1과 1/2oz는 지거링(큰쪽)이 횟수가 적게 사용할 수 있음<br/>주스는 오션스프레이/랭거스 두개 브랜드가 있음. 1.8l라서 무거우니쏟지않게 내려놓고 부어야함 또는 지거에대라<br/>이 3개는 2분이내에 만들어야함”</p><p>블랙 러시안·모스코 뮬과 3개 2분 연습. 탄산은 들어가지 않는 메뉴.</p></section></div>
<section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">seebreeze=해풍, 산들바람, 바닷바람</p><p class="note-aside">빨간보드카: 크랜베리 주스 사용</p><p class="note-aside">맛은 시큼하고 씀</p><p class="note-aside">보드카라서 하이볼잔, 기주는 1과 1/2. 하이볼은 소맥, 조금 작은 잔.</p><p class="note-aside">1과 1/2oz는 지거링(큰쪽)이 횟수가 적게 사용할 수 있음</p><p class="note-aside">가니쉬 웻지레몬인데, 웻지가 콜라 들어가는 레시피에는 웨지, 씨브리즈 두번임</p><p class="note-aside">주스는 오션스프레이/랭거스 두개 브랜드가 있음. 1.8l라서 무거우니쏟지않게 내려놓고 부어야함 또는 지거에대라</p><p class="note-aside">이 3개는 2분이내에 만들어야함</p></div></section></div></details>

</section></template>
<template id="cosmopolitan-note-template"><section aria-label="코스모폴리탄 수업 노트" class="recipe-notes cosmopolitan-notes">
<p class="note-cue">보드카 1 oz · 나머지 셋 각 1/2 oz · 빨강은 크랜베리</p><p class="note-taste"><span>한 줄 평</span> 상큼달달화함</p>
<details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body">
<header class="note-heading"><h4>코스모폴리탄 필기</h4></header>
<div class="note-basics"><p><b>보드카 1 oz · 트리플 섹 1/2 oz · 라임 주스 1/2 oz · 크랜베리 주스 1/2 oz</b></p><p>Shake · 칵테일 잔 · 라임 또는 레몬 껍질 트위스트</p></div>
<section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>잔과 껍질 트위스트</strong><p>칵테일 잔을 칠링하고 라임 또는 레몬 껍질 트위스트를 준비한다.</p><p class="note-aside">레몬 슬라이스 만든 뒤 껍질을 트위스트.</p></li><li><strong>셰이커 얼음과 보드카</strong><p>셰이커에 혼합용 얼음을 준비하고 보드카 1 oz를 계량해 넣는다.</p><p class="note-aside">이번 보드카 숏 드링크는 1 oz.</p></li><li><strong>세 부재료 각 1/2 oz</strong><p>트리플 섹·라임 주스·크랜베리 주스를 각각 1/2 oz 넣는다.</p><p class="note-aside">트리플 섹 = 투명한 디카이퍼 병. 보드카 + 빨강이어도 그레나딘 X.</p></li><li><strong>닫고 셰이킹</strong><p>셰이커를 잘 닫고 고르게 섞는다.</p><p class="note-aside">사이드카·허니문과 트리플 섹+산미+Shake로 연결하되 코스모는 라임과 크랜베리.</p></li><li><strong>거르며 따르기</strong><p>칵테일 잔의 칠링 얼음·물을 비우고 스트레이너로 혼합용 얼음을 걸러 따른다.</p><p class="note-aside">따를 때 셰이커 하단을 손가락으로 받쳐 안정적으로 잡기.</p></li><li><strong>트위스트와 코스터</strong><p>코스터에 옮기고 라임 또는 레몬 껍질 트위스트로 장식한다.</p><p class="note-aside">시험 표는 두 과일 껍질을 허용.</p></li></ol></section>
<div class="note-topic-grid"><section class="note-topic"><h5>이름과 이미지</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“도수있는주스같은. 섹스앤더시티 드라마의 인기”</p><p>도수 있는 주스 같음. 드라마 ‘섹스 앤 더 시티’와 연결해 기억한 수업 메모.</p></section><section class="note-topic"><h5>Triple Sec 오해 풀기</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“트리플섹: 3배 dry함. 리큐르 40도라 뭐 달기 어렵다고?? 오렌지 리큐르.<br/>디카이퍼 투명”</p><p>‘3배 dry’는 당도 계산식이 아님. 40도인 제품에도 설탕이 들어간다.</p></section><section class="note-topic"><h5>뉴욕과 빨강 비교</h5><p>코스모폴리탄의 빨강은 크랜베리 1/2 oz, 뉴욕은 그레나딘 1/2 tsp.</p><p class="note-aside">둘 다 빨갛다는 이유로 재료를 바꾸지 않기.</p></section></div>
<section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">코스모폴리탄</p><p class="note-aside">세계적인.</p><p class="note-aside">도수있는주스같은. 섹스앤더시티 드라마의 인기</p><p class="note-aside">사이드카, 허니문과 연상</p><p class="note-aside">빨간색.</p><p class="note-aside">술 따를때(쉐이크하구) 하단의 받침 손가락으로 잡기</p><p class="note-aside">맛은 상큼달달화함</p><p class="note-aside">보드카라서 라임.</p><p class="note-aside">트리플섹: 3배 dry함. 리큐르 40도라 뭐 달기 어렵다고?? 오렌지 리큐르.</p><p class="note-aside">디카이퍼 투명</p><p class="note-aside">칵테일 글라스 - 양이 적은 숏 드링크는 기주가 1과1/2이 아니라 보드카가 1oz</p><p class="note-aside">가니쉬는 레몬 슬라이스 만든 후 트위스트.</p><p class="note-aside">보드카 빨강에 그레나딘X</p><p class="note-aside">뉴욕과 헷갈리지X</p></div></section></div></details>

</section></template>
<template id="apple-martini-note-template"><section aria-label="애플 마티니 수업 노트" class="recipe-notes apple-martini-notes">
<p class="note-cue">보드카 1 · 사워 애플 리큐르 1 · 라임 1/2 oz · 사과 슬라이스</p><p class="note-taste"><span>한 줄 평</span> 떫고 화한 사과맛.</p>
<details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body">
<header class="note-heading"><h4>애플 마티니 필기</h4></header>
<div class="note-basics"><p><b>보드카 1 oz · 애플 퍼커 1 oz · 라임 주스 1/2 oz</b></p><p>Shake · 칵테일 잔 · 사과 슬라이스</p></div>
<section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>칵테일 잔과 사과</strong><p>칵테일 잔을 칠링하고 사과 슬라이스를 준비한다.</p><p class="note-aside">칵테일 글라스/마티니 글라스로 부른 V형 잔. 공식 표는 사과 색을 지정하지 않음.</p></li><li><strong>얼음과 보드카 1 oz</strong><p>셰이커에 얼음을 준비하고 보드카 1 oz를 계량한다.</p><p class="note-aside">코스모폴리탄과 함께 숏 보드카 1 oz로 기억.</p></li><li><strong>애플 퍼커 1 oz</strong><p>사워 애플 리큐르 1 oz를 넣는다.</p><p class="note-aside">Apple Pucker, 수업에서는 애플 푸커로 들음. 피치트리와는 다른 리큐르.</p></li><li><strong>라임 주스 1/2 oz</strong><p>라임 주스를 1/2 oz 계량해 넣는다.</p><p class="note-aside">사이드카 레몬 1/4과 애플 마티니 라임 1/2을 비교.</p></li><li><strong>셰이크 → 잔 비우기 → 거르기</strong><p>뚜껑을 닫고 셰이킹한다. 칵테일 잔의 칠링 얼음·물을 비우고 혼합용 얼음을 걸러 따른다.</p><p class="note-aside">마티니라는 이름만 보고 Stir로 바꾸지 않기.</p></li><li><strong>사과 슬라이스와 코스터</strong><p>코스터로 옮기고 사과 슬라이스로 장식한다.</p><p class="note-aside">전통주 메뉴 ‘풋사랑’에도 사과 슬라이스가 나옴.</p></li></ol></section>
<div class="note-topic-grid"><section class="note-topic"><h5>마티니라는 이름</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“에플마티니: 마티니가 베르무트 회사거라??? 홍보제품인데 마티니 들어간다고 헷갈리지 않기. 사이드카 1/4 애플마티니1/2<br/>마티니 관계 없이 생긴거 때문에 마티니라고 이름이 붙음<br/>에스프레스 마티니도 그러한 종류임”</p><p>애플·에스프레소 마티니 같은 이름만으로 베르무트 사용을 판단하지 않기. 사이드카의 1/4은 레몬, 애플 마티니의 1/2은 라임 주스 용량이다.</p></section><section class="note-topic"><h5>애플트리 병 메모</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“피치트리도 디카이퍼. 디카이퍼의 pb=애플푸커=애플트리로 이름 바뀜<br/>애플푸커=애플트리(올해 10월에 이름과 병이 바뀜)”</p><p>정확한 제품 변경은 공식 확인 전. 시험 표의 Apple Pucker(Sour apple Liqueur)와 지급 라벨을 확인. 자동 채점에서는 애플 푸커/사워 애플 리큐르 표기를 사용.</p></section><section class="note-topic"><h5>사과 색</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“slice of apple 전통주때도 가니쉬 나오는데, 그냥 빨간 사과 쓸거임. 한국은 사계절이 있어서 청사과가 여름에만 나오나봄”</p><p>청사과가 여름에만 있다는 기억은 품종·유통에 따라 달라질 수 있음. 공식 표는 A Slice of Apple.</p></section></div>
<section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">에플마티니: 마티니가 베르무트 회사거라??? 홍보제품인데 마티니 들어간다고 헷갈리지 않기. 사이드카 1/4 애플마티니1/2</p><p class="note-aside">마티니 관계 없이 생긴거 때문에 마티니라고 이름이 붙음</p><p class="note-aside">에스프레스 마티니도 그러한 종류임</p><p class="note-aside">피치트리도 디카이퍼. 디카이퍼의 pb=애플푸커=애플트리로 이름 바뀜</p><p class="note-aside">숏이니까 보드카1</p><p class="note-aside">떫고 화한 사과맛.</p><p class="note-aside">칵테일 글라스=마티니글라스, 숏이라서 기주 보드카 1oz</p><p class="note-aside">애플푸커=애플트리(올해 10월에 이름과 병이 바뀜)</p><p class="note-aside">slice of apple 전통주때도 가니쉬 나오는데, 그냥 빨간 사과 쓸거임. 한국은 사계절이 있어서 청사과가 여름에만 나오나봄</p></div></section></div></details>

</section></template>
<template id="pina-colada-note-template"><section aria-label="피나 콜라다 수업 노트" class="recipe-notes pina-colada-notes">
<p class="note-cue">라이트 럼 1 1/4 · 피나 콜라다 믹스 2 · 파인애플 2 oz</p><p class="note-taste"><span>한 줄 평</span> 맛있고 씁쓸한 맛이었따</p>
<details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body">
<header class="note-heading"><h4>피나 콜라다 필기</h4></header>
<div class="note-basics"><p><b>라이트 럼 1 1/4 oz · 피나 콜라다 믹스 2 oz · 파인애플 주스 2 oz</b></p><p>Blend · 필스너 잔 (받침형) · 생파인애플 웨지 + 체리</p></div>
<section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>필스너 잔과 가니시</strong><p>필스너 잔과 블렌더, 파인애플 웨지·체리를 준비한다.</p><p class="note-aside">파인애플 모서리에 체리가 잘 안 꽂히면 과육 쪽에 안정적으로 고정하기.</p></li><li><strong>얼음 계량·칠링 → 바로 블렌더로</strong><p>필스너 잔에 얼음을 계량해 한 번 칠링하고, 그 얼음을 바로 블렌더 통으로 옮긴다.</p><p class="note-aside">시험 시간 기준. 이어서 얼음이 담긴 블렌더 통에 술·재료를 넣기.</p></li><li><strong>라이트 럼 1 1/4 oz</strong><p>라이트 럼을 계량해 얼음이 담긴 블렌더 통에 넣는다.</p><p class="note-aside">마이 타이와 같은 럼 용량. 일반적인 보드카 1 1/2 규칙을 가져오지 않기.</p></li><li><strong>믹스와 과즙 각 2 oz</strong><p>피나 콜라다 믹스 2 oz, 파인애플 주스 2 oz를 계량해 블렌더 통에 넣는다.</p><p class="note-aside">흰색 믹스로 기억. 코코넛 럼으로 대체하지 않음.</p></li><li><strong>뚜껑 닫고 블렌딩</strong><p>재료를 모두 넣은 뒤 블렌더 뚜껑을 닫고 간다.</p><p class="note-aside">빙삭 가능한 기기를 사용. 기기 이름만으로 얼음 분쇄 가능 여부를 판단하지 않기.</p></li><li><strong>같은 잔에 담기 → 장식</strong><p>얼음을 블렌더로 옮겨 비워 둔 필스너 잔에 블렌딩한 내용물을 담는다. 코스터와 파인애플·체리로 마무리한다.</p><p class="note-aside">과즙에도 파인애플, 장식에도 파인애플로 연결.</p></li></ol></section>
<div class="note-topic-grid"><section class="note-topic"><h5>맛 순위와 트로피컬</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“피나콜라다 파인애플(스페니쉬0이무성한언덕제일맛있었음파일에플 모서리에 체리 못 꽂겠으면 걍 살 찔러서 제출하자.<br/>맛있고 씁쓸한 맛이었따”</p><p>‘제일 맛있었음’ 메모. 트로피컬은 이번 파인애플 중심 묶음의 연상법.</p></section><section class="note-topic"><h5>믹스 병 기억</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“라이트럼: 1과1/4(럼에만 나오는 용량인가봄) - 트로피컬시럽 또는 marand mrs 검은라벨<br/>pina colada mix는 흰색.<br/>오렌지 파인 라임주스 코코넛밀크<br/>피스널잔은 맥주잔.”</p><p>marand mrs 검은 라벨. 피나 콜라다 믹스는 흰색.</p></section><section class="note-topic"><h5>매장과 시험</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“소음이 많아서 매장에선 블렌드 안쓰고 쉐이킹으로 함<br/>블렌더는 얼음갈기, 믹서기는 그냥 갈기라 둘이 다름.<br/>서울에서는 100%블렌드나 플로팅 기법이 둘중에 하나는 무조건 나오기 때문에 완벽히 외울것. 3메뉴중에 하나로 무조건 나오기에 확률은 50%”</p><p>Blend. 소음이 많아서 매장에서는 셰이킹으로 함. 서울은 Blend 또는 Float 완벽히 외울 것.</p></section></div>
<section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">피나콜라다 파인애플(스페니쉬0이무성한언덕제일맛있었음파일에플 모서리에 체리 못 꽂겠으면 걍 살 찔러서 제출하자.</p><p class="note-aside">맛있고 씁쓸한 맛이었따</p><p class="note-aside">소음이 많아서 매장에선 블렌드 안쓰고 쉐이킹으로 함</p><p class="note-aside">블렌더는 얼음갈기, 믹서기는 그냥 갈기라 둘이 다름.</p><p class="note-aside">서울에서는 100%블렌드나 플로팅 기법이 둘중에 하나는 무조건 나오기 때문에 완벽히 외울것. 3메뉴중에 하나로 무조건 나오기에 확률은 50%</p><p class="note-aside">라이트럼: 1과1/4(럼에만 나오는 용량인가봄) - 트로피컬시럽 또는 marand mrs 검은라벨</p><p class="note-aside">pina colada mix는 흰색.</p><p class="note-aside">오렌지 파인 라임주스 코코넛밀크</p><p class="note-aside">pineapple 있으니 트로피칼 칵테일이라고 부름</p><p class="note-aside">피스널잔은 맥주잔.</p><p class="note-aside">가니쉬는 파인애플과 체리. 레시피에도 파인애플이 있으니 연결.</p></div></section></div></details>

</section></template>
<template id="blue-hawaiian-note-template"><section aria-label="블루 하와이안 수업 노트" class="recipe-notes blue-hawaiian-notes">
<p class="note-cue">라이트 럼·블루 큐라소·코코넛 럼 각 1 · 파인애플 2 1/2 oz</p><p class="note-taste"><span>한 줄 평</span> 술맛 생각보다 별로였음 · 3위</p>
<details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body">
<header class="note-heading"><h4>블루 하와이안 필기</h4></header>
<div class="note-basics"><p><b>라이트 럼 1 oz · 블루 큐라소 1 oz · 코코넛 플레이버드 럼 1 oz · 파인애플 주스 2 1/2 oz</b></p><p>Blend · 필스너 잔 (받침형) · 생파인애플 웨지 + 체리</p></div>
<section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>잔과 파인애플 장식</strong><p>필스너 잔과 블렌더, 파인애플 웨지·체리를 준비한다.</p><p class="note-aside">먼저 제공 잔부터 차갑게.</p></li><li><strong>얼음 계량·칠링 → 바로 블렌더로</strong><p>필스너 잔에 얼음을 계량해 한 번 칠링하고, 그 얼음을 바로 블렌더 통으로 옮긴다.</p><p class="note-aside">시험 시간 기준. 이어서 얼음이 담긴 블렌더 통에 술·재료를 넣기.</p></li><li><strong>라이트 럼 1 oz</strong><p>라이트 럼을 계량해 얼음이 담긴 블렌더 통에 넣는다.</p><p class="note-aside">럼만 1 oz인 블루로 기억.</p></li><li><strong>파란 술과 코코넛 술 각 1 oz</strong><p>블루 큐라소와 코코넛 플레이버드 럼을 각각 1 oz 넣는다.</p><p class="note-aside">Blue → 블루 큐라소, Hawaiian → 말리부로 떠올린 코코넛 럼. 블루 큐라소는 시럽이 아니라 리큐르.</p></li><li><strong>파인애플 주스 2 1/2 oz</strong><p>파인애플 주스를 계량해 넣는다.</p><p class="note-aside">이 레시피에는 라임 주스가 없음. 럼=라임 암기법의 예외!</p></li><li><strong>뚜껑 닫고 블렌딩</strong><p>재료를 모두 넣은 뒤 블렌더 뚜껑을 닫고 간다.</p><p class="note-aside">큐라소는 오렌지 계열 리큐르로, 파란 제품은 색을 더한 종류로 기억.</p></li><li><strong>따르고 곧 제출</strong><p>얼음을 블렌더로 옮겨 비워 둔 필스너 잔에 블렌딩한 내용물을 담아 코스터·가니시로 마무리한다.</p><p class="note-aside">수업 관찰: 시간이 지나 파랑~하양으로 분리되어 보임. 모든 블렌드가 같은 속도로 분리된다는 법칙은 아님.</p></li></ol></section>
<div class="note-topic-grid"><section class="note-topic"><h5>Blue Hawaii와 구분</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“블루하와이안. 근데 사실 이 레시피는 블루하와이 임. 이안은 따로 있음???”</p><p>Blue Hawaii라는 다른 이름·배합도 있지만 이 시험 메뉴 이름을 고치지 않기.</p></section><section class="note-topic"><h5>맛과 병 연상</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“말리부 앞 하와이안.<br/>술맛 생각보다 별로였음 3위<br/>블루라서 블루 큐라소(퀴라소: 네덜란드섬, 특산품: 오렌지. 리큐르 거기에 파란색 넣은것)<br/>하와이: 코코넛 럼. (말리부)<br/>블루큐라소 술임!”</p><p>말리부 병의 하와이 이미지, 파란 큐라소, 파인애플을 한 묶음으로. 코코넛 럼과 라이트 럼은 둘 다 넣음.</p></section></div>
<section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">블루하와이안. 근데 사실 이 레시피는 블루하와이 임. 이안은 따로 있음???</p><p class="note-aside">말리부 앞 하와이안.</p><p class="note-aside">컵에 얼음 넣고 해야 칠링이지. 블렌더에 얼음넣는 것보다는.(전체에 쓸것)</p><p class="note-aside">술맛 생각보다 별로였음 3위</p><p class="note-aside">블루라서 블루 큐라소(퀴라소: 네덜란드섬, 특산품: 오렌지. 리큐르 거기에 파란색 넣은것)</p><p class="note-aside">하와이: 코코넛 럼. (말리부)</p><p class="note-aside">블루큐라소 술임!</p><p class="note-aside">트로피칼이니 파인애플, 파인애플이라 가니쉬도 파인애플(전체에 쓸것)</p><p class="note-aside">잔에 붓고 나면 블렌더 썼을 때는 얼음과 분리가 빠름. 색이 금방 파랑~하양으로 변함 블렌더 쓰는 애들이 다 그런가봄</p><p class="note-aside">보드카, 럼도 라임주스(전체에 쓸것)</p></div></section></div></details>

</section></template>
<template id="mai-tai-note-template"><section aria-label="마이 타이 수업 노트" class="recipe-notes mai-tai-notes">
<p class="note-cue">럼 1 1/4 + 트리플 섹 3/4 = 2 · 파라오 각 1 · 그레나딘 1/4 oz</p><p class="note-taste"><span>한 줄 평</span> 시고 쌉싸름 단맛. 2위</p>
<details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body">
<header class="note-heading"><h4>마이 타이 필기</h4></header>
<div class="note-basics"><p><b>라이트 럼 1 1/4 oz · 트리플 섹 3/4 oz · 라임 주스 1 oz · 파인애플 주스 1 oz · 오렌지 주스 1 oz · 그레나딘 시럽 1/4 oz</b></p><p>Blend · 필스너 잔 (받침형) · 생파인애플 웨지 + 체리</p></div>
<section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>필스너 잔과 가니시</strong><p>필스너 잔과 블렌더, 파인애플 또는 오렌지 웨지와 체리를 준비한다.</p><p class="note-aside">수업은 파인애플로 연결. 공식 표는 파인애플(오렌지)과 체리.</p></li><li><strong>얼음 계량·칠링 → 바로 블렌더로</strong><p>필스너 잔에 얼음을 계량해 한 번 칠링하고, 그 얼음을 바로 블렌더 통으로 옮긴다.</p><p class="note-aside">시험 시간 기준. 이어서 얼음이 담긴 블렌더 통에 술·재료를 넣기.</p></li><li><strong>라이트 럼 1 1/4 oz</strong><p>라이트 럼을 계량해 얼음이 담긴 블렌더 통에 넣는다.</p><p class="note-aside">피나 콜라다와 같은 1 1/4 oz.</p></li><li><strong>트리플 섹 3/4 oz</strong><p>트리플 섹을 넣는다.</p><p class="note-aside">두 술을 더하면 2 oz: 1 1/4 + 3/4.</p></li><li><strong>파라오 각 1 oz</strong><p>파인애플·라임·오렌지 주스를 각각 1 oz 넣는다.</p><p class="note-aside">파·라·오 = 파인애플 / 라임 / 오렌지. 라임이 1/2가 아닌 1 oz!</p></li><li><strong>그레나딘 1/4 oz</strong><p>그레나딘 시럽을 계량해 넣는다.</p><p class="note-aside">럼의 1 1/4와 시럽의 1/4를 연결. 뉴욕의 tsp와 다름.</p></li><li><strong>블렌딩 → 같은 잔에 담기</strong><p>재료를 모두 넣은 뒤 블렌더 뚜껑을 닫고 간다. 얼음을 옮겨 비워 둔 필스너 잔에 내용물을 담아 코스터로 옮긴다.</p><p class="note-aside">시험에서는 Blend.</p></li><li><strong>웨지와 체리</strong><p>파인애플 또는 오렌지 웨지와 체리로 마무리한다.</p><p class="note-aside">파인애플 주스와 가니시를 함께 떠올리기.</p></li></ol></section>
<div class="note-topic-grid"><section class="note-topic"><h5>난이도와 이름</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“최악, 난이도상.<br/>마이타이. 타히티어 "최고" 트로피칼 중 잘 나감<br/>시고 쌉싸름 단맛. 2위”</p><p>‘최악, 난이도 상’은 만들 때의 느낌. 맛 순위는 트로피컬 중 2위!</p></section><section class="note-topic"><h5>집에서의 취향</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“라임주스 1/3로 줄이면 덜 셔서 좋음. 그래서 맛이 2위로 괜찮았나보다”</p><p>라임 주스를 1/3로 줄이면 덜 셔서 좋음. 그래서 맛이 2위로 괜찮았나 보다.</p></section><section class="note-topic"><h5>주류 합과 과즙 묶음</h5><p>술 둘은 합쳐 2 oz, 파라오 셋은 각각 1 oz, 시럽은 1/4 oz.</p><p class="note-aside">피나 콜라다와 럼 용량은 같지만 믹스·과즙 배합은 모두 다름.</p></section></div>
<section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">최악, 난이도상.</p><p class="note-aside">마이타이. 타히티어 &#x27;최고&#x27; 트로피칼 중 잘 나감</p><p class="note-aside">시고 쌉싸름 단맛. 2위</p><p class="note-aside">주스앞자는 파라오로 외우기.</p><p class="note-aside">라이트럼+트리플섹 용량 합치면 2oz</p><p class="note-aside">라이트럼 11/4, 석류시럽 1/4 연관해서 외우기.</p><p class="note-aside">ㅇㄹ라이트럼 1.1/4 = 피나콜라다. 얘네둘만 이 용량임</p><p class="note-aside">라임이 1/2이 아니네!</p><p class="note-aside">라 임+파 인애플 오 렌지 = 파라오 1온스씩</p><p class="note-aside">프로피칼이니까 파인애플 주스고, 가니쉬도 파인애플</p><p class="note-aside">라임주스 1/3로 줄이면 덜 셔서 좋음. 그래서 맛이 2위로 괜찮았나보다</p></div></section></div></details>

</section></template>
<template id="cuba-libre-note-template"><section aria-label="쿠바 리브레 수업 노트" class="recipe-notes cuba-libre-notes">
<p class="note-cue">라이트 럼 1 1/2 · 라임 1/2 oz · 콜라 Fill · 레몬 웨지</p><p class="note-taste"><span>한 줄 평</span> 달긴한데 써. 담배맛....?</p>
<details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body">
<header class="note-heading"><h4>쿠바 리브레 필기</h4></header>
<div class="note-basics"><p><b>라이트 럼 1 1/2 oz · 라임 주스 1/2 oz · 콜라 Fill</b></p><p>Build · 하이볼 잔 · 레몬 웨지</p></div>
<section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>하이볼 잔과 레몬 웨지</strong><p>잔을 칠링하고 레몬 웨지를 준비한 뒤 서비스용 얼음을 넣는다.</p><p class="note-aside">쿠바의 자유 → 럼으로 연결. 모스코 뮬의 슬라이스와 구분.</p></li><li><strong>라이트 럼 1 1/2 oz</strong><p>라이트 럼을 계량해 넣는다.</p><p class="note-aside">‘럼·라임 둘 다 1/2’는 끝의 분수 연상. 럼 전체 용량은 반드시 1 1/2 oz.</p></li><li><strong>라임 주스 1/2 oz</strong><p>라임 주스를 계량해 넣는다.</p><p class="note-aside">럼콕에 라임을 더하면 쿠바 리브레로 연결.</p></li><li><strong>콜라 Fill</strong><p>차가운 콜라를 채우고 탄산이 과하게 빠지지 않도록 가볍게 섞는다.</p><p class="note-aside">모스코 뮬은 진저 에일, 이 메뉴는 콜라.</p></li><li><strong>레몬 웨지와 코스터</strong><p>코스터로 옮기고 레몬 웨지로 마무리한다.</p><p class="note-aside">주스는 라임, 가니시는 레몬 웨지.</p></li></ol></section>
<div class="note-topic-grid"><section class="note-topic"><h5>세 가지 콜라 조합</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“잭다니엘+콜라=잭콕<br/>럼+콜라=럼콕<br/>럼콕+라임주스=큐바리브레<br/>버번위스키=버번어쩌구... 얘네는 가성비없나바”</p><p>버번+콜라 조합과 가성비 이야기도 취향 메모. 시험 재료를 잭 다니엘스로 바꾸지는 않기.</p></section><section class="note-topic"><h5>쿠바 이야기</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“쿠바의 liberty 자유. 사탕수수산지라 럼기준.<br/>헤밍웨이가 즐겨먹던 1번. 2번은 다이킬, 3번은 모히또”</p><p>헤밍웨이: 1번 쿠바 리브레, 2번 다이키리, 3번 모히토.</p></section><section class="note-topic"><h5>모스코 뮬과 다른 세 가지</h5><p>보드카→럼, 진저 에일→콜라, 슬라이스→레몬 웨지.</p><p class="note-aside">두 메뉴 모두 하이볼·Build, 기주 1 1/2 oz와 라임 1/2 oz는 같음.</p></section></div>
<section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">쿠바 리브레</p><p class="note-aside">쿠바의 liberty 자유. 사탕수수산지라 럼기준.</p><p class="note-aside">헤밍웨이가 즐겨먹던 1번. 2번은 다이킬, 3번은 모히또</p><p class="note-aside">달긴한데 써. 담배맛....?</p><p class="note-aside">= 모스코 뮬. 기주, 부재료 빼고 똑같음</p><p class="note-aside">럼, 라임 둘 다1/2연관해서 외우기</p><p class="note-aside">콜라라서 웨지. 욕같은애 시브리즈 웨지.</p><p class="note-aside">럼은 라임주스(전체에반영)</p><p class="note-aside">라임이니 1/2</p><p class="note-aside">하이볼잔이라 기주는 1과 1/2</p><p class="note-aside">잭다니엘+콜라=잭콕</p><p class="note-aside">럼+콜라=럼콕</p><p class="note-aside">럼콕+라임주스=큐바리브레</p><p class="note-aside">버번위스키=버번어쩌구... 얘네는 가성비없나바</p><p class="note-aside">모스코뮬에 웨지XX주의</p></div></section></div></details>

<template id="daiquiri-note-template"><section aria-label="다이키리 수업 노트" class="recipe-notes daiquiri-notes">
<p class="note-cue">라이트 럼 1 3/4 · 라임 3/4 oz · 가루 설탕 1 tsp · Shake</p>
<details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body">
<header class="note-heading"><h4>다이키리 필기</h4></header>
<div class="note-basics"><p><b>라이트 럼 1 3/4 oz · 라임 주스 3/4 oz · 가루 설탕 1 tsp</b></p><p>Shake · 칵테일 잔 · 없음</p></div>
<section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>칵테일 잔과 셰이커 얼음</strong><p>제공 잔을 칠링하고 셰이커에 혼합용 얼음을 넣는다.</p><p class="note-aside">설탕이 들어가는 셰이크 메뉴. 올드 패션드·레몬 스쿼시는 설탕이 있어도 Build인 예외.</p></li><li><strong>라이트 럼 1 3/4 oz</strong><p>라이트 럼을 계량해 넣는다.</p><p class="note-aside">1 1/4가 아님! 다이키리·바카디는 1 3/4.</p></li><li><strong>라임 주스 3/4 oz</strong><p>라임 주스를 계량해 넣는다.</p><p class="note-aside">기주의 분수 3/4를 라임 3/4와 연결.</p></li><li><strong>가루 설탕 1 tsp</strong><p>설탕을 깎아서 한 티스푼 넣는다.</p><p class="note-aside">바카디의 그레나딘 1 tsp와 비교.</p></li><li><strong>셰이킹 → 거르기</strong><p>닫고 셰이킹한다. 칵테일 잔의 칠링 얼음·물을 버리고 혼합용 얼음을 걸러 따른다.</p><p class="note-aside">가니시 없이 코스터에 제출.</p></li></ol></section>
<div class="note-topic-grid"><section class="note-topic"><h5>쿠바와 라임</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“다이키리는 쿠바의 탄광이름. 노동자들의 노동주 - 럼주+더워서 라임주스”</p><p>더운 곳의 럼+라임이라는 연상. 세부 역사 이야기는 레시피 정답 조건으로 쓰지 않음.</p></section><section class="note-topic"><h5>바카디와 한 쌍</h5><p>다이키리는 일반 라이트 럼 + 설탕, 바카디는 지정 바카디 럼 + 그레나딘.</p><p class="note-aside">럼과 라임의 용량은 두 메뉴가 같음. 이름만 보고 서로 바꾸지 않기.</p></section></div>
<section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">다이키리는 쿠바의 탄광이름. 노동자들의 노동주 - 럼주+더워서 라임주스</p><p class="note-aside">기주용량 기억</p><p class="note-aside">설탕있어서 쉐이킹</p><p class="note-aside">라이트럼 기주따라 라임주스 3/4이라고 외우기</p><p class="note-aside">피나콜라다와 마이타이</p><p class="note-aside">럼/차</p><p class="note-aside">다 다르지만 기억해.</p><p class="note-aside">블루1 큐바1/2 다이키리 3/4</p></div></section></div></details>

</section></template>
<template id="bacardi-note-template"><section aria-label="바카디 칵테일 수업 노트" class="recipe-notes bacardi-notes">
<p class="note-cue">바카디 럼 화이트 1 3/4 · 라임 3/4 oz · 그레나딘 1 tsp</p>
<details class="recipe-note-details"><summary>만드는 순서</summary><div class="note-detail-body">
<header class="note-heading"><h4>바카디 칵테일 필기</h4></header>
<div class="note-basics"><p><b>바카디 럼 화이트 1 3/4 oz · 라임 주스 3/4 oz · 그레나딘 시럽 1 tsp</b></p><p>Shake · 칵테일 잔 · 없음</p></div>
<section class="mn-flow mn-practice"><h5>만드는 순서</h5><ol><li><strong>칵테일 잔과 셰이커 얼음</strong><p>제공 잔을 칠링하고 셰이커에 혼합용 얼음을 넣는다.</p><p class="note-aside">다이키리와 같은 Shake·칵테일 잔·가니시 없음.</p></li><li><strong>바카디 럼 화이트 1 3/4 oz</strong><p>Bacardi Rum White로 지정된 병의 라벨을 확인하고 계량한다.</p><p class="note-aside">바카디는 럼 회사. 이 메뉴는 브랜드까지 지정된 기주.</p></li><li><strong>라임 주스 3/4 oz</strong><p>라임 주스를 계량해 넣는다.</p><p class="note-aside">다이키리와 같은 3/4 oz.</p></li><li><strong>그레나딘 시럽 1 tsp</strong><p>그레나딘 시럽 한 티스푼을 넣는다.</p><p class="note-aside">설탕 X, 1 oz X. 다이키리의 설탕 1 tsp를 그레나딘 1 tsp로 비교.</p></li><li><strong>셰이킹 → 거르기 → 코스터</strong><p>닫고 셰이킹하고, 칵테일 잔의 칠링 얼음·물을 비운 뒤 혼합용 얼음을 걸러 따른다. 장식 없이 코스터로 옮긴다.</p><p class="note-aside">병 선택부터 정확히.</p></li></ol></section>
<div class="note-topic-grid"><section class="note-topic"><h5>병 이름과 럼 종류 정리</h5><p><b>브랜드명과 술의 종류를 나누어 읽기.</b> 수업에서 들은 이름은 <b>올드 닉 화이트 럼(Old Nick White Rum)</b>으로 정리. “올드 닉 브랜드의 화이트 럼”이라는 뜻이다.</p><table class="note-brand-table"><thead><tr><th scope="col">메모에 쓴 말</th><th scope="col">뜻 · 병에서 확인할 이름</th></tr></thead><tbody><tr><th scope="row">바톤</th><td><b>Barton</b>(바턴·바톤) 브랜드를 말한 것으로 보임. <b>Barton Light Rum</b>이라는 제품이 있다.</td></tr><tr><th scope="row">바카디</th><td><b>BACARDÍ</b>라는 브랜드. 화이트 럼 제품명은 <b>Superior / Carta Blanca</b>로 확인.</td></tr><tr><th scope="row">Old Nick</th><td><b>올드 닉</b>이라는 브랜드. <b>Rhum Blanc = 화이트 럼</b>.</td></tr><tr><th scope="row">White Rum</th><td><b>화이트 럼이라는 술의 종류.</b> 이번 수업의 Light Rum(라이트 럼)과 연결해서 기억.</td></tr></tbody></table><p class="note-aside">“검은”이 병·라벨 등 무엇을 가리켰는지는 들은 문장만으로 알 수 없음. 검은색 럼으로 외우지 말고 제품명 확인하기.</p><p class="note-original note-transcript"><b>필기 원문</b><br/>“다이키리에 바카디럼만 쓰면 노상관. 검은 바톤/바카디 있을거임. 휘경동은 old nick, white rum 있을거임”</p><p class="note-caption">위 문장은 들리는 대로 적어 둔 원문. “old nick, white rum”은 한 제품 이름인 “올드 닉 화이트 럼”으로 정리함.</p></section><section class="note-topic"><h5>바카디 칵테일에는 어느 병?</h5><p><b>바카디 칵테일 → 바카디 화이트 럼 1 3/4 oz.</b> BACARDÍ 브랜드와 Superior / Carta Blanca 화이트 제품명을 함께 확인한다.</p><p><b>다이키리 → Light Rum 1 3/4 oz.</b> 이 표에는 브랜드가 따로 지정되어 있지 않으므로 바카디 화이트 럼도 사용할 수 있다.</p><p class="note-aside">암기: “바카디는 이름부터 브랜드!” 같은 화이트 럼이라도 바카디 칵테일에는 Barton·Old Nick으로 바꿔 넣지 않기.</p></section><section class="note-topic"><h5>실격이라는 강조</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“하지만 바카디에 바카디럼이 아닌 바톤, 올드닉 쓰면 실격임”</p><p>바카디에는 바카디 럼! 바톤·올드 닉과 바꾸지 않기.</p></section><section class="note-topic"><h5>홍보와 이름</h5><p class="note-original note-transcript"><b>필기 원문</b><br/>“바카디는 럼 만드는 회사지. 홍보하려고 만들어진 술임<br/>바카디엔 바카디럼만 사용”</p><p>브랜드의 칵테일 이름 보호 이야기는 한국 시험의 실격 규정과 별개.</p></section></div>
<section class="note-class-sheet merged-class-notes"><h5>필기</h5><div class="lesson-original-body"><p class="note-aside">바카디는 럼 만드는 회사지. 홍보하려고 만들어진 술임</p><p class="note-aside">바카디엔 바카디럼만 사용</p><p class="note-aside">바카디는 기주가 바카디 화이트 럼. 따로 있음.</p><p class="note-aside">다이키리에서는 시럽대신 설탕넣은 거지. 빼고 똑같음(기주도 이름만 다르고 종류자제는 럼인건 같지)</p><p class="note-aside">다이키리에 바카디럼만 쓰면 노상관. 검은 바톤/바카디 있을거임. 휘경동은 old nick, white rum 있을거임</p><p class="note-aside">하지만 바카디에 바카디럼이 아닌 바톤, 올드닉 쓰면 실격임</p><p class="note-aside">올드닉 화이트럼이겠네요.</p></div></section></div></details>

</section></template>
